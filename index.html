 I said buttermilk) and mix again until fully incorporated. At this point, everything should start looking creamy, like a dessert should."],["p","5. Mix in the dry ingredients in three parts. Don’t rush! Be gentle—mix until just combined. The batter might get a little shy, so be kind. Over-mixing is the enemy here."],["p","6. When you’ve got your smooth batter, it's time for the red! Add the red food coloring gel while the mixer is on. You want that deep red velvet color, so don't be shy with the gel. It's your chance to feel like a mad scientist—go wild!"],["p","7. Evenly distribute the batter between your cupcake cases. No need to be a perfectionist, but try to keep it even so they all rise in harmony."],["p","8. Bake at 180°C (350°F) for about 30 minutes or until a toothpick inserted into the center comes out clean. The house should start smelling like a sweet, buttery dream."],["h3","For the Cream Cheese Frosting:"],["p","1. Combine the chilled cream cheese and whipped cream in a stand mixer and beat until creamy and lump-free. If there are lumps, you’ll need to apologize to your frosting for not treating it better."],["p","2. Add in the vanilla extract and stir well. Vanilla = love."],["p","3. Slowly add powdered sugar, starting with 100g and adjusting based on your personal preference for sweetness. Whisk until the frosting is as smooth."],["p","4. Once your cupcakes are cooled, top them with the cream cheese frosting. You can use a piping bag if you’re feeling professional, or a spoon if you’re feeling more “homey.” Either way, you’ll be serving up cupcakes that look (and taste) like a dream."],["h3","Enjoy!"],["p","Now, sit back, relax, and bask in the glory of your creation. You’ve made something red, velvety, and divine—surely, the world is a better place for it. Don’t forget to share (or keep all of them to yourself—no judgment here)."]],"date":"24 January 2024","tags":["recipes","desserts","american","cooking","cake"]},{"title":"Rosemary Focaccia Bread Recipe","blocks":[["p","Did we tell you that we love Italy? 😂 😂 😂 You are not reading our blog! 😂 😂 😂 When we went to Italy we had an amazing Tomato Focaccia Bread with Passion Fruit Lemonade! And now was our time to do something to try bringing the Italian spirit back to our house!"],["p","We made this amazing Rosemary Focaccia Bread, is super easy to make, and while you wait for the rising of your focaccia you can always enjoy a nice glass of Aperol Spritz!"],["p","Don't forget to have fun in the kitchen! If you do, you'll have even more fun while eating!"],["p","Be Happy, Be Fun, Be Loving! ❤️"],["h4","Ingredients :"],["ul","1 tsp Granulated Sugar"],["ul","5g Bakers Yeast (or 15g Fresh Bakers Yeast)"],["ul","1 ½ Cups Warm Water (not hot water)"],["ul","3 Cups Wheat Flour"],["ul","2 tsp Salt (Sea Salt)"],["ul","¼ Cup Olive Oil + 3 tbsp Olive Oil"],["ul","¼ Cup Rosemary Leaves"],["h4","Recipe:"],["p","1. In a bowl, place the sugar, baker's yeast, and ¼ cup of warm water. Give it a little mix with a fork and let it sit for about 10min."],["p","2. In another container put the flour, ¼ cup of olive oil, and the remaining water (1 + ¼ cups), and start kneading."],["p","3. Add the preparation from Point 1 to your dough."],["p","4. Knead for 2 min without stopping, add 1 tsp of salt and knead for another 1min."],["p","5. In a new container place 1 tbsp of olive oil and add the dough, covering it with a cloth and letting it rise for 1h in a warm environment at about 30ºC | 86ºF."],["p","6. After 1h, transfer the dough to a tray, previously greased with 1 tbsp of olive oil, and spread the dough, leaving the dough 1cm | 0.39in high."],["p","Note: The 2nd time we did this recipe, we put first in the tray a baking paper, it helps when removing it."],["p","7. Press the dough with your fingers and drizzle It with 1 tbsp of olive oil. Cover with a cloth and let rise again for another 40min."],["p","8. After leavening, distribute the rosemary leaves and 1 tsp of salt."],["p","9. Bake for 20min at 200ºC | 392ºF"],["p","10. Cut the Focaccia into large pieces and make dipping sauces to accompany."],["p","Dipping Sauces Ideas:"],["p","1 - Grated olives;"],["p","2 - Grated and refined chorizo ​​and sausage;"],["p","3 - Pesto with olive oil;"],["p","4 - Olive oil with balsamic vinegar;"],["p","5 - Why don't you try this recipe and give us a dipping sauce idea? We would love to try your ideas! 🥰"]],"date":"20 October 2020","tags":["bread","recipes","main dishes","italian","cooking","appetizers"]},{"title":"Russian Salad Recipe","blocks":[["p","Good in winter, delicious in summer... I make a very nice sauce with the egg yolks, but if you prefer you can always add some mayonnaise... This recipe is really simple and you can eat it all year and never get tired of it! try my recipe and tell me what you think!"],["h4","Ingredients:"],["ul","7 Eggs"],["ul","500g Potatoes"],["ul","500g Peas"],["ul","250g Green Beans (optional)"],["ul","4 Carrots"],["ul","4 Hake Fillets (or replace with 4 cans of tuna preserved in water)"],["ul","Oil to Fry the Hake Fillets"],["ul","Flour"],["ul","Salt"],["ul","Black Pepper"],["ul","Lemon Juice"],["ul","Olive Oil"],["ul","Vinegar"],["h4","Recipe:"],["p","1. Place 4 eggs to boil."],["p","2. Cut the potatoes and carrots into cubes and cook in salted water, along with the peas and green beans. After the vegetables are cooked, remove from heat and remove the water."],["p","3. It's time to bread the fillets: Put flour in a deep dish and in another dish the 3 eggs mixed with 2 tablespoons of warm water; pass the fillets already seasoned with salt and lemon through the egg mixture and then through the flour, until the entire fillet is completely covered."],["p","4. Place the breaded fillets in the hot oil for frying."],["p","5. Peel the eggs and separate the whites from the yolks; add the sliced egg whites to the mixture of cooked vegetables."],["p","6. To make the sauce, add 10cL of olive oil, 10cL of vinegar, the egg yolks, salt and black pepper to taste, and beat with a fork."],["p","7. Then, mix the mixture of vegetables and cooked egg whites with the previous sauce."]],"date":"18 August 2020","tags":["main dishes","cooking","recipes","fish"]},{"title":"Salmon Ceviche in Toasted Wraps","blocks":[["h4","Ingredients - 2 Drinks :"],["ul","200g Salmon"],["ul","½ Avocado"],["ul","¼ Purple Onion"],["ul","½ Lemon Juice"],["ul","1 tbsp Parsley"],["ul","1 Orange"],["ul","2 Wrap Bread"],["ul","Black Pepper"],["ul","Salt"],["h4","Recipe:"],["p","1. Place the Wrap Bread in two bowls and take it to the oven for 20 minutes at 180ºC | 360ºF - These will be our ceviche bowls."],["p","2. Cut the salmon fillet into equal cubes and add it to a large bowl."],["p","3. Cut the avocado into cubes and add to the salmon, along with the juice of half a lemon, salt, and black pepper."],["p","4. Slice the onion very finely and add to the prepared and break the orange into cubes to add."],["p","5. Add the parsley and stir everything well and let it rest for 5 min."],["p","6. Remove the wraps from the oven and let them cool! Then just plate!"],["p","7. Isn't it a super easy and delicious recipe?"]],"date":"18 March 2021","tags":["cooking","appetizers","fish","recipes"]},{"title":"Salmon Teriyaki Skewers with Pineapple Recipe","blocks":[["p","Salmon is one of my favorite types of fish! You can eat it in so many ways, and even raw is amazing!"],["p","This time we added the pineapple and the flavor increased a lot! Give this recipe a try! You won't regret it!"],["h4","Ingredients :"],["ul","4 Skewers"],["ul","½ pineapple"],["ul","500g Salmon"],["ul","1 tsp Sea Salt"],["ul","½ Cup Teriyaki Sauce"],["ul","Vegetable Oil (brush the pan)"],["h4","Recipe:"],["p","1. Cut the pineapple into identical cubes."],["p","2. Cut the salmon into cubes with the same dimensions as the pineapple."],["p","3. Place the cubes intercalated on the skewers."],["p","4. Season with salt."],["p","5. Place a frying pan over medium-high heat, and brush with vegetable oil."],["p","6. Place the skewers in the frying pan and brush with teriyaki sauce, turning every 3 min each side."],["p","7. Sprinkle everything with chives and you're ready to eat!"],["p","8. Delight yourself!"]],"date":"14 November 2020","tags":["fish","recipes","main dishes","vietnamese","cooking"]},{"title":"Salted Caramel (Toffee) Cheesecake Recipe","blocks":[["p","Do you remember trying those caramel sweets we ate when we were young? This is the memory that this cheesecake brings to me (Richie)!"],["p","Those were good times, I always had uncles that used to bring in their pockets this kind of candy!"],["p","You have to try this delicious cheesecake!"],["h4","Ingredients - Salted Caramel :"],["ul","240g Granulated Sugar"],["ul","250mL Cream"],["ul","40g Butter"],["ul","½ tsp Salt"],["h4","Ingredients - Cheesecake :"],["ul","150g Digestive Wafer (or oat cookies)"],["ul","70g Butter"],["ul","270g Cream Cheese"],["ul","250ml Cream"],["ul","3 sheets of gelatin"],["ul","½ tsp vanilla flavor"],["h4","Recipe - Salted Caramel:"],["p","1. Combine the sugar with cold water in a medium saucepan set over medium-high heat. Cook, without stirring, until the sugar has turned a deep amber hue."],["p","2. Slowly add in the cream and continue simmering the mixture until it is smooth. Remove from heat, then whisk in the butter and salt, and let it cool."],["p","3. Reserve it."],["h4","Recipe - Cheesecake:"],["p","1. Mix the crushed wafer/cookies with the melted butter. Place this in a removable ring cake pan by pressing with the help of a spoon. Let it rest in the cold."],["p","2. Beat the cream, and then add the cream cheese and vanilla flavor until creamy. Gradually add half of the salted caramel you made."],["p","3. Hydrate the gelatin sheets in very cold water for 5 minutes. Drain excess water and microwave for about 10 seconds, until dissolved. Add to the previous mixture."],["p","4. Pour the cheesecake mix over the biscuit base and refrigerate for at least 4-6 hours."],["p","5. Add the salted caramel on top of the cheesecake."],["p","6. Can you see what a beautiful thing you did?"]],"date":"16 January 2021","tags":["gluten free","recipes","cake","cooking","desserts"]},{"title":"Salted Caramel and Nuts Cheesecake Pots Recipe","blocks":[["p","It will always be different, depending on which nuts do you love more! This time we did it with pecan nuts! But for you, others can work as well!"],["p","Quick tip, If you like a more liquid caramel just double the double cream! 🤤"],["p","Hope you like it!"],["h4","Ingredients :"],["ul","6 Oatmeal Cookies (110g)"],["ul","1 tbsp Butter"],["ul","1/2 Cup Pecan Nuts (or any kind of nuts)"],["ul","250g Mascarpone"],["ul","150mL Double Cream"],["ul","4 tbsp Icing Sugar"],["ul","1 Lemon Zested and Juiced"],["ul","100g Granulated Sugar"],["ul","50mL Double Cream"],["ul","10g Salt"],["h4","Recipe:"],["p","1. Place the cookies in a bowl and crush them sharply with a wooden spoon."],["p","2. Put the pecans and butter in a frying pan and let it toast a little."],["p","3. Remove from the heat and add to the cookies, creating a crumble."],["p","4. In a mixer, beat the double cream, and once firm, add the mascarpone, icing sugar, and one lemon, zested and juiced."],["p","5. In a pan add the sugar over high heat, when it gets a brown color turn off the stove and add the double cream, stirring quickly. Be careful not to burn yourself! And then season with salt."],["p","6. It's time to do the assembly!"],["p","7. Take in 4 cups or glasses and add some of the cookie and nut crumble, add the caramel, and then the double cream and mascarpone preparation."],["p","8. You can save some of the caramel and crumble for decoration!"],["p","9. Have fun!"]],"date":"22 October 2020","tags":["cooking","american","desserts","cookies","recipes"]},{"title":"Salted Caramel Petit Gâteau Recipe","blocks":[["p","Try this recipe for Valentine's Day! It will be the perfect finish for your dinner at home!"],["p","And very special as well! 🥰"],["h4","Ingredients - Cake :"],["ul","200g Dark Chocolate (53% cocoa)"],["ul","180g Butter"],["ul","50g Flour"],["ul","3 Egg Yolks"],["ul","4 Eggs"],["ul","75g Granulated Sugar"],["ul","1 tsp Espresso Powder"],["ul","Butter (to grease)"],["ul","Flour (for sprinkling)"],["ul","Ice Cream and Raspberries"],["h4","Ingredients - Salted Caramel :"],["ul","150g Granulated Sugar"],["ul","150mL Cream"],["ul","1 tbsp Butter"],["ul","1 tsp Vanilla Flavor"],["ul","1 tsp Sea Salt"],["h4","Recipe:"],["p","1. Start your recipe by preparing the chocolate cake. Broke the chocolate into pieces and put them in a glass bowl. Melt it in a water bath."],["p","2. Once the chocolate is melted, add the butter and whisk until the butter is melted."],["p","3. Then, add the eggs, the egg yolks, the sugar, and espresso powder and whisk until you have a homogenous mix."],["p","4. Finally, add the flour and incorporate it."],["p","5. Grease the molds of the petit gâteaus with butter and then sprinkle with flour, not to stick, and then pour the mixture into the molds and leave it to the fridge for at least an hour."],["p","6. Now, let’s make the salted caramel. Combine the sugar with cold water in a saucepan set over medium-high heat. Cook, without stirring, until the sugar has turned a deep amber hue."],["p","7. Slowly add in the cream and continue simmering the mixture until it is smooth. Remove from heat, then whisk in the butter and salt, and let it cool. Reserve it."],["p","8. When ready to serve, preheat the oven to 220°C | 425ºF."],["p","9. With the help of a string or piping bag, insert the salted caramel inside each petit gateau."],["p","10. Bake for about 6-8 minutes (depending on the oven and cupcake molds you use)."],["p","11. Remove them from the oven when they have formed a crust on the outside while the center is still a little soft."],["p","12. Unmould carefully and serve immediately, while hot."],["p","13. Be amazed by this delicious and exciting recipe! 😍"]],"date":"16 February 2021","tags":["desserts","cooking","cake","chocolate","french","recipes"]},{"title":"Simple and Easy Garlic Bread Recipe","blocks":[["p","Andrew loves this garlic bread recipe! I'm not such a fan of garlic, in a matter of fact, I can really leave very well without it! Yes, you can always change garlic with something else and it's still delicious!"],["p","But the things we do for love! 😅"],["h4","Ingredients :"],["ul","1 Baguette"],["ul","100g Butter"],["ul","2 tbsp Chopped Parsley"],["ul","3 Garlic Cloves"],["ul","Salt"],["h4","Recipe:"],["p","1. Make cuts on a baguette."],["p","2. In a bowl, place 100g of butter, at room temperature, then add chopped parsley, salt, and the finely chopped 3 garlic cloves."],["p","3. After creating this butter paste, fill the baguette and take it to the oven."],["p","4. The baguette should be left in the oven for 15-20min at 180ºC | 356ºF."],["p","5. Could this be easier?"]],"date":"29 December 2020","tags":["cooking","appetizers","portuguese","recipes","bread"]},{"title":"Sparkling Berry Sangria Recipe","blocks":[["p","This is probably the drink that we most do at our home! This and caipirinha! You must do this as well! The berries are amazing with the sparkling wine and if you don't like berries you can change them with other kinds of frozen fruit that you have!"],["p","You'll thank us later! We promise!"],["h4","Ingredients :"],["ul","500mL Brut Sparkling Wine"],["ul","500mL Soft Drink (Seven-Up)"],["ul","1 Cup Frozen Berries"],["ul","1 tsp Granulated Sugar"],["ul","1 tsp Lemon Juice"],["ul","2 Cinnamon Sticks"],["ul","Ice"],["h4","Recipe:"],["p","1. In a 1L jar put the sugar, lemon juice, and cinnamon sticks. Mix everything and add the frozen berries."],["p","2. Put 500mL of brut sparkling wine in the jar and let it rest in the refrigerator for 30 minutes."],["p","3. Add the 500mL of any Soft Drink you like, we prefer Seven-Up Free, because it's low on sugar, it is colorless and does not add a big punch flavor."],["p","4. And that's it!!! Just fill a glass of ice and enjoy and do it again until the mood increases! 😂🤣"]],"date":"8 November 2020","tags":["recipes","drinks","cooking"]},{"title":"Spicy Cheese Balls with Bacon Recipe","blocks":[["p","You can do this in 10min, let's set up the chronometer?"],["p","This recipe is super easy and for cheese lovers is just perfect! It combines a lot of flavors, such as the hotness of the chili, the saltness of the pretzel, and the sweetness of the jam!"],["p","I'm always making these cheese balls when I want something more fulfilling! 😅"],["p","Be happy, Be Fun, Be Loving!"],["h4","Ingredients :"],["ul","8 Bacon Slices"],["ul","160g Cheddar Cheese Bar"],["ul","300g Cream Cheese"],["ul","32 Pretzel Sticks"],["ul","50g Peanuts"],["ul","1 Jalapeño or ½ Ghost Pepper"],["ul","Black Pepper"],["ul","Paprika"],["ul","Salt"],["ul","Fruit Jam (we like fig or tangerine jam)"],["h4","Recipe:"],["p","1. Place the bacon slices in a frying pan until they are well toasted. Remove the bacon and dry it with a paper towel to remove the released fat."],["p","2. After the bacon has cooled, chop them with a knife into very small pieces."],["p","3. In a bowl, add the bacon, roughly chopped peanuts, salt, paprika, black pepper, and chopped Jalapeño (or half a ghost pepper)."],["p","4. In another bowl, add the cream cheese, salt, and grate the cheddar cheese bar, mix well and form 16 small cheese balls."],["p","5. Pass the cheese balls through the bacon mixture and place 2 pretzel sticks in each ball."],["p","6. To accompany in the best way possible these spicy cheese balls, a fig or tangerine jam is very good."]],"date":"21 October 2020","tags":["recipes","american","appetizers","cooking","spicy"]},{"title":"Spicy Gizzards Recipe","blocks":[["p","There is nothing better and tastier than a plate of hot and spicy gizzards. For a Sunday afternoon party or snack with the family, it is the ideal snack to start interesting conversations and to socialize."],["h4","Ingredients:"],["ul","1Kg Gizzards"],["ul","1 Large Onion"],["ul","2 Chilies"],["ul","500mL White Wine"],["ul","80g Concentrated Tomato"],["ul","Black pepper"],["ul","Salt"],["ul","Olive oil"],["h4","Recipe:"],["p","1. Wash the gizzards thoroughly (whether frozen or fresh) and remove the excess fat."],["p","2. Break gizzards in half or quarters, depending on the size of the gizzards you want."],["p","3. In a pan, boil the gizzards in water for 45 minutes."],["p","4. After the gizzards are cooked, remove the water and place the gizzards in a bowl. The time has come to braise them!"],["p","5. Cut the onion into slices and place in the pan to braise with salt, olive oil, and black pepper until golden brown, then place the gizzards, wine, concentrated tomato, and the chilies cut into small slices."],["p","6. Let it braise well, stirring occasionally until a thick sauce is created to accompany the gizzards."]],"date":"14 August 2020","tags":["spicy","meat","portuguese","appetizers","cooking","recipes"]},{"title":"Stewed Peas with Poached Eggs Recipe","blocks":[["h4","Ingredients :"],["ul","600g Peas"],["ul","4 Carrots"],["ul","4 Eggs"],["ul","1 Onion"],["ul","6 Tomatoes"],["ul","2 Chorizos"],["ul","2 Spicy Sausages"],["ul","2 bay Leaves"],["ul","50mL White Wine"],["ul","Olive Oil"],["ul","Salt"],["ul","Black Pepper"],["h4","Recipe:"],["p","1. In a pan, place the olive oil, salt, black pepper, and bay leaves over high heat."],["p","2. Add the chopped onion and let it simmer for 3 minutes."],["p","3. Then add the white wine and stir."],["p","4. When boiling, add the tomatoes and cover the pan for 7-10 minutes, until the tomatoes make a sauce."],["p","5. Cut the carrots into pieces and add them to the pan."],["p","6. While everything is cooking, remove the skin from the spicy sausages and the chorizos and cut them into pieces. Add them to the pan together with the peas and cover to sauté everything."],["p","7. After 10 minutes, add the 4 whole eggs, turn off the stove, cover the pan and let it rest for 5 minutes."],["p","8. And this divine dinner is ready!"]],"date":"11 March 2021","tags":["portuguese","cooking","main dishes","recipes"]},{"title":"Stewed Veal with Peas and Carrots Recipe","blocks":[["p","A dish full of history that feeds the soul! This is one of my favorite recipes from my mother, which inspires most of my food. With or without meat I could eat this for the rest of my life! And the sauce is the most simple to do, but the flavor is just indescribable!"],["h3","Ingredients:"],["ul","400g Veal Mear"],["ul","4 Carrots"],["ul","1⁄2 Spicy Chorizo"],["ul","800g Peas"],["ul","3 Tomatoes"],["ul","1 Onion"],["ul","White Wine"],["ul","Olive Oil"],["ul","Salt"],["ul","Chili"],["h3","Recipe:"],["ul","In a pan, start to stew the finely chopped onion with olive oil, salt, and the chili."],["ul","As soon as the onion becomes golden in color, place the tomatoes (with or without skin) and let them stew until they crumble."],["ul","Then cut into thin slices the carrots and chorizo, cut the veal into cubes and cover everything with white wine, let it rest for 20min."],["ul","Finally, add the peas and let them stew for another 15 minutes."],["h4","TIP: Preferably serve with white rice, for the sauce to become the king of the meal."],["p","A very warm dish, which makes any cold winter night happy, for those passionate about traditional and homemade food."]],"date":"31 July 2020","tags":["recipes","meat","main dishes","portuguese","cooking"]},{"title":"The Grand Big Mac - Hamburger Recipe","blocks":[["p","Will this recipe amaze you? For sure! this combination of flavors with blow your mind and make you think that you are at Mcdonalds eating your favorite meal!"],["p","After you try this recipe we will be your best friends!"],["h4","Ingredients :"],["ul","4 Buns (get our recipe here)"],["ul","½ onion"],["ul","3 Lettuce Leaves"],["ul","2 Sweet and Sour Pickle Cucumbers"],["ul","4 Slices of Cheddar Cheese"],["ul","400g ground beef"],["ul","1 Egg"],["ul","1 tsp Salt"],["ul","2 tsp Black Pepper"],["ul","2 tbsp Breadcrumbs"],["ul","1 tsp Garlic Powder (sauce)"],["ul","1 tsp White Wine Vinegar (sauce)"],["ul","1 tsp Paprika (sauce)"],["ul","1 tsp Mustard (sauce)"],["ul","½ Cup Mayonnaise (sauce)"],["ul","4 Skewer Sticks"],["h4","Recipe:"],["p","1. First let us prepare the maison place."],["p","2. Take half of the onion and chop it into tiny cubes."],["p","3. Cut the cucumbers into slices, super thin."],["p","4. Wash the lettuce leaves and cut them into very thin strips."],["p","5. Slice 4 buns, leaving out two pieces of the top."],["p","5. Let's prepare the hamburgers! In a bowl add the ground beef and add an egg, salt, black pepper, and breadcrumbs. Mix everything very well and form 4 burgers."],["p","6. Put a drizzle of olive oil in a frying pan and when it is hot place the 4 burgers to grill."],["p","7. Grill each side of the burger for 4 min."],["p","8. Add a slice of cheddar cheese to each burger and let it simmer for 2 min."],["p","9. Time to make the sauce. In a bowl, add the mayonnaise, garlic powder, paprika, mustard, and white wine vinegar and mix everything."],["p","10. Now let's just do the fun part! The Assembly!"],["p","11. Put the sauce on the buns, followed by the burger, sprinkle with chopped onion, cucumber, and lettuce. Then just join the second floor of the burger and hold everything with a skewer stick."],["p","12. Try to resist this temptation!"]],"date":"4 February 2021","tags":["recipes","bread","american","cooking","meat","main dishes"]},{"title":"Traditional Brigadeiros (Brazilian Fudge Balls) Recipe","blocks":[["p","This recipe will save your life when you have some cravings for chocolate! We do this a lot! And you can use anything you have running out at your place!"],["p","Super easy, super delicious!"],["p","Don't forget to have fun! 😍"],["h4","Ingredients :"],["ul","200mL Condensed Milk"],["ul","3 tbsp Chocolate Powder"],["ul","Chocolate Powder"],["ul","Grated Coconut"],["h4","Recipe:"],["p","1. Place the condensed milk and 3 tbsp of powdered chocolate in a pan."],["p","2. Bring to medium-high heat for 8 minutes, stirring slowly until it thickens."],["p","3. Let it cool for 15-20min and wet your hands with water to start forming the small balls."],["p","4. Pass the balls through chocolate powder or grated coconut, or another delicious option you may have!"],["p","5. Refrigerate for at least 2 hours!"],["p","6. A chocolate explosion in your mouth!"]],"date":"19 December 2020","tags":["chocolate","cooking","desserts","brazilian","recipes"]},{"title":"Tuna Pate Recipe","blocks":[["p","If there is an entry that is absolutely mandatory at any party or dinner at home, it is the tuna pate! It should be made in advance to serve it very fresh. It is cheap, tasty, and is an accompaniment that is wonderfully complemented with beautiful toasts... and white wine! Let's do this together? ❤️"],["h4","Ingredients:"],["ul","4 Cans Tuna in Oil"],["ul","4 Kani-kama Bars"],["ul","2 Cups Mayonnaise"],["ul","Toasts"],["ul","Oregano"],["h4","Recipe:"],["p","1. Open the tuna cans and remove excess oil."],["p","2. Place the tuna in a bowl and roughly undo it with a fork."],["p","3. Add the mayonnaise, creating a homogeneous paste."],["p","4. Add the Kani-kama cut into thin slices and the oregano, mixing well."],["p","5. Place it in the cold and serve with toasts or toasted bread."]],"date":"12 August 2020","tags":["fish","recipes","pate","appetizers","cooking","portuguese"]},{"title":"Turkey Schnitzel with Buttery Roasted Potatoes Recipe","blocks":[["p","We love a good Schnitzel, but our favorite is the Turkey one, the meat is healthier and tastes lighter than pork meat."],["p","This is a good recipe for a busy weekend or to take on a pick-nick!"],["p","Why don't you give it a try?"],["h4","Ingredients :"],["ul","1Kg Small Potatoes"],["ul","4 Large Turkey Steaks"],["ul","1 Lemon"],["ul","70g Butter"],["ul","2 tbsp Parsley"],["ul","3 tsp Salt"],["ul","2 tbsp 5 Peppercorns Mill"],["ul","300g Breadcrumbs"],["ul","4 Eggs"],["ul","Vegetable Oil for Frying"],["h4","Recipe:"],["p","1. Cut the potatoes in halves or in three parts to make them the same size."],["p","2. Wash them and cook them in water and 1tsp of salt for 10min."],["p","3. Remove the water from the pan and add the butter, 1 tbsp of parsley, 1 tsp of salt, and 1 tbsp of 5 Peppercorns Mill."],["p","4. Let everything wrap very well in the heat and then place on a tray and bake in the oven for 20min at 180ºC | 356ºF."],["p","5. Place the turkey steaks on a wooden board and with the help of a hammer beat the meat. This process will help the steaks to become more tender."],["p","6. In a large plate, beat 4 eggs, and in another add the breadcrumbs, 1 tbsp of parsley, 1 tsp of salt, and 1 tbsp of 5 Peppercorns Mill."],["p","7. Pass the steaks through the egg and then through the breadcrumbs, repeating this process twice."],["p","8. In a frying pan heat the vegetable oil and place the breadcrumbs for frying."],["p","9. As soon as they get a golden-brown color they are ready!"],["p","10. To enjoy your Schnitzels in the best way, squeeze the juice of a lemon over them! They will be wonderful!"]],"date":"12 December 2020","tags":["recipes","meat","main dishes","german","cooking"]},{"title":"Vegetarian Leek with Potato Sticks Recipe","blocks":[["p","If you just want to relax and eat something super tasteful and easy to make, you can do this vegetarian dish! This will amaze you and probably be one of your favorites too!"],["p","Give it a try, you won't regret it!"],["h4","Ingredients :"],["ul","2 Leeks"],["ul","200g Potato Sticks"],["ul","4 Eggs"],["ul","1 Onion"],["ul","1 Bay Leaf"],["ul","Black Pepper"],["ul","Olive Oil"],["ul","Salt"],["ul","Parsley"],["ul","Black Olives"],["h4","Recipe:"],["p","1. In a pan place the salt and olive oil, turn on the heat, and add the chopped onion to sauté."],["p","2. Add the bay leaf and black pepper."],["p","3. Cut the leek into slices and add to the pan, allowing to sauté well. Creating a soft consistency."],["p","4. Add the potato sticks and mix everything well."],["p","5. In a bowl, beat the four eggs and then add to the pan distorting everything very well and you're done!"],["p","6. Add pieces of fresh parsley and black olives to the plate!"],["p","7. A vegetarian dish, super easy for a relaxing Sunday night."],["p","8. Enjoy!"]],"date":"24 November 2020","tags":["main dishes","cooking","vegetarian","recipes"]},{"title":"Vietnamese Garlic Prawns Recipe","blocks":[["p","This kind of cuisine was a first for us! But we are telling you... these prawns were from beyond this world!"],["p","You have to try them to taste it for yourself!"],["h4","Ingredients :"],["ul","700Kg Prawns (peeled and deveined)"],["ul","2 Garlic Cloves"],["ul","1 tsp Dried parsley"],["ul","1 tsp Black Pepper"],["ul","½ tsp Sea Salt"],["ul","1 tbsp Worcestershire Sauce"],["ul","1 tsp Granulated Sugar"],["ul","1 tbsp Vegetable Oil"],["ul","Sweet and sour sauce (to dip the prawns)"],["ul","6 Skewers"],["h4","Recipe:"],["p","1. Peel all the prawns and place them on a deep plate."],["p","2. Add salt, sugar, vegetable oil, chopped garlic, Worcestershire sauce, dry parsley, and black pepper."],["p","3. Mix everything and let it stand for 30min."],["p","4. Take the skewer sticks and start placing the prawns."],["p","5. Take a skillet to medium-high heat and start to grill the prawns, adding a little vegetable oil and sweet and sour sauce."],["p","6. Grill each side for 4 minutes and it's ready to be enjoyed!"],["p","7. Tell us, don't we show you the most tasteful dishes? 🥰"]],"date":"19 November 2020","tags":["cooking","appetizers","fish","seafood","main dishes","vietnamese","recipes"]},{"title":"White Bûche de Noël (Yule Log Cake) Recipe","blocks":[["p","If you wonder why we make so many gluten-free desserts, is because my big sister (Richie) is celiac, so she can't eat gluten! In the beginning, it gave us a real headache when was time to go to the kitchen! All of us, in the family, had to learn how to do things and be careful to not let other stuff get contaminated! She only got this condition when she reached 25 years of age!"],["p","Now we got used to it! Just have to go around some recipes and make it work! The best part is that we still manage to have fun!"],["h4","Ingredients - Cake :"],["ul","6 Large Eggs Separated"],["ul","120g Granulated Sugar"],["ul","1 tbsp Granulated Sugar"],["ul","50g Cocoa Powder"],["ul","Pinch of Salt"],["ul","½ tsp Vanilla"],["h4","Ingredients - Filling :"],["ul","250g Mascarpone Cheese"],["ul","80g Powdered Sugar"],["ul","200mL Cream"],["ul","1 tsp Vanilla"],["ul","50g Roasted Hazelnuts"],["h4","Ingredients - Roof :"],["ul","100g Cream Cheese"],["ul","80g Powdered Sugar"],["ul","200ml Cream"],["h4","Recipe - Cake:"],["p","1. Preheat the oven to 180ºC."],["p","2. Beat the egg yolks with the sugar until you get a yellowish mixture."],["p","3. Add the cocoa and mix until combined."],["p","4. Wishk the egg whites with 1 tbsp of sugar until you get firm peaks"],["p","5. Add the whisked egg whites to the previously made mixture."],["p","6. Pour the dough into a rectangular shape oven tray with parchment paper."],["p","7. Place in the oven at 180ºC | 356ºF between 10-15min."],["p","8. Let the cake cool for 10 minutes and, with the help of a towel dusted with powdered sugar, wrap the cake in its final shape"],["h4","Recipe - Filling:"],["p","1. Beat the mascarpone cheese with the powdered sugar and vanilla, until a velvety mixture is obtained."],["p","2. Add the cream, and whisk until firm peaks are reached."],["p","3. Roll out the cake and spread the filling over the entire surface of the cake."],["p","4. Roll the cake again and let it rest."],["h4","Recipe - Topping:"],["p","1. Beat the cream cheese with the powdered sugar and vanilla until a velvety mixture is obtained."],["p","2. Add the cream, and beat until firm peaks are reached."],["p","3. Spread the icing over the entire cake and it's ready to serve."],["h4","Tip: you should make this cake 12-24h in advance, in order to have a more moist cake."]],"date":"7 January 2021","tags":["cake","recipes","holidays","cooking","desserts","chocolate","gluten free","christmas"]},{"title":"White Wine Sangria Recipe","blocks":[["p","Tell me one person that doesn't love a good Sangria and I'll make him love mine! It's a challenge!"],["p","This Sangria goes very well with spicy dishes or summer nights! It's Super delicate and fresh! I love to do Sangria on Saturdays, this way we can rest on Sundays!"],["h4","Ingredients :"],["ul","500mL White Wine"],["ul","500mL Champagne"],["ul","1 tbsp Granulated Sugar"],["ul","Lime Slices"],["ul","1 Cinnamon Stick"],["ul","3 Mint Leaves"],["ul","Ice"],["h4","Recipe:"],["p","1. In a jar add white wine, sugar, lime, cinnamon stick, and mint."],["p","2. Let it rest for 30min and add champagne."],["p","3. If you keep it resting in the fridge you can add the ice cubes on the glass, if not add in the jar directly."],["p","4. Drink with moderation, or not 😂."]],"date":"6 September 2020","tags":["drinks","recipes"]},{"title":"Yogurt Cake Recipe","blocks":[["p","We like to do this recipe with coconut yogurt! But here I'll let you choose the flavor! You can add strawberry, banana, lemon, blueberries, etc... It will give a small hint of fruit in the cake, and I hope you will love it as much as we do! Give it a try!"],["h4","Ingredients :"],["ul","1 Cup Yogurt (any flavor you like)"],["ul","1 Cup Sunflower Oil (or Vegetable Oil)"],["ul","4 Cups Flour"],["ul","4 Cups Granulated Sugar"],["ul","5 Eggs"],["ul","1 tsp Baking Powder"],["ul","Butter to Grease"],["h4","Recipe:"],["p","1. Turn on the oven at 180 Celsius degrees | 356 Fahrenheit degrees."],["p","2. Separate the egg yolks from the whites and whisk the egg whites."],["p","3. Beat the egg yolks with the sugar, after obtaining a homogeneous mixture add the oil, yogurt, flour, and baking powder."],["p","4. After everything is well mixed, blend in the whisked egg whites in the mixture with the help of a wooden spoon."],["p","5. Grease a circular shape pan with a hole in the center with butter."],["p","6. Distribute the mixture to the pan and bake for about 40min."]],"date":"31 August 2020","tags":["recipes","desserts","portuguese","breakfast","cooking","cake"]}],"Travel and city guides":[{"title":"PICOS DE EUROPA | Road Trip - 4 days in the Picos de Europa 🇪🇸","date":"20 October 2026","tags":["travel","traveling","city guide","road trip","spain","asturias","cantabria","picos de europa","hiking","nature","vacation","holidays"],"blocks":[["p","In October 2020 we swapped cities for mountains. We packed the car, left Porto early on a Saturday morning and drove north to the Picos de Europa, the national park that sits between Asturias, Cantabria and Castilla y León."],["p","Expect green valleys, tiny stone villages, lakes up in the clouds, gorges carved by rivers and some of the best cheese in Spain. Also expect fog. A lot of fog. It is part of the charm (most of the time)."],["p","We slept in a different village every night, so the trip works as a loop: Cangas de Onís, then Arenas de Cabrales, then Potes, and back home."],["tip","Tip: Bring proper walking shoes, layers and a raincoat, even if the forecast looks good. The weather in the mountains changes in minutes."],["h3","Day 0 - Porto to Asturias, the scenic way"],["p","We left Porto at 8am and took the long way up, along the AP-9 and the A-8, stopping along the coast of Galicia and Asturias:"],["ul","Pontevedra, with its pretty, compact old town."],["ul","Santiago de Compostela, for a walk around the Cathedral and the Praza do Obradoiro, where the pilgrims finish the Camino."],["ul","A Coruña, by the sea, with the Roman Tower of Hercules, the oldest working lighthouse in the world."],["ul","Oviedo, the elegant capital of Asturias, with its Gothic cathedral and cider houses."],["ul","Gijón, on the coast, for a last stretch of the legs by the beach before heading inland."],["p","It makes for a long day in the car, but every stop breaks it up nicely."],["h3","Day 1 - Cangas de Onís, Covadonga and the Lakes"],["h3","1. Cangas de Onís"],["p","The gateway to the Picos de Europa and a great base for the first night. The main points of interest:"],["ul","The municipal market, where local producers sell their artisan cheeses."],["ul","The Church of Santa Eulalia."],["ul","The Roman bridge over the River Sella, with the Victory Cross hanging under its arch."],["ul","The Visitor Centre of the Picos de Europa National Park, good for maps and trail information."],["h3","2. Covadonga"],["p","About 9 km (11 minutes) from Cangas, Covadonga is one of the most visited places in the park. The pink stone Basilica sits on the mountainside, and next to it is the Santa Cueva, a cave in the rock with the Virgin of Covadonga and the tomb of King Pelayo, the first king of Asturias."],["h3","3. Lakes of Covadonga"],["p","Another 13 km (25 minutes) of winding road takes you up to the Lakes of Covadonga: Enol, Ercina and Bricial. Several trails start here."],["p","The best way to see all of them is the PR-PNPE 2 trail, a 5 km loop that passes all the lakes and the old Buferrera mines. Cows, mist, mirror-like water, a very peaceful walk."],["p","Parking was €2 for the whole day in 2020."],["p","Night: Hotel Los Lagos Nature, in Cangas de Onís."],["h3","Day 2 - Poo de Cabrales, Poncebos and Bulnes"],["h3","1. Poo de Cabrales"],["p","A small village with one of the best (and easiest to reach) viewpoints over the most iconic peak of the Picos de Europa, the Naranjo de Bulnes, also known as Pico Urriellu."],["h3","2. Poncebos"],["p","Just 7 km further, Poncebos is basically the starting point for the walk up to Bulnes (and for the Ruta del Cares, more on that tomorrow)."],["h3","3. Bulnes"],["p","A tiny, isolated village in the mountains, with no road access. There are only two ways to get there: on foot, or with an underground funicular that climbs through the mountain."],["p","We walked the Canal del Texu path, 4 km uphill (8 km return). It is steep, but the views over the gorge make up for it, and arriving at the stone houses of Bulnes feels like a little prize."],["h3","4. Naranjo de Bulnes (Pico Urriellu)"],["p","The most emblematic mountain of the Picos de Europa, with its huge orange-tinted rock wall. From Bulnes, a short extra walk takes you to a spot where you can see it."],["p","Night: Hotel Los Ángeles, in Arenas de Cabrales."],["h3","Day 3 - Arenas de Cabrales and the Ruta del Cares"],["h3","1. Arenas de Cabrales"],["p","Famous for Cabrales cheese, one of the best blue cheeses in the world, aged in natural caves in the mountains. Don't leave without trying it (and maybe bringing some home, if you can handle the smell in the car)."],["h3","2. Ruta del Cares"],["p","The rest of the day was all about the most famous trail in the Picos de Europa, the Ruta del Cares, also known as the Divine Gorge. It starts in Poncebos and follows the River Cares through a deep canyon all the way to Caín."],["p","It is 12 km each way, so 24 km there and back. Long, but mostly flat, carved into the rock with tunnels, bridges and vertical walls on both sides. One of the most impressive walks we have ever done."],["tip","Tip: Start early, bring plenty of water and snacks, and keep an eye on the time, it gets dark early in October."],["p","Night: Hotel Valdecori, in Potes."],["h3","Day 4 - Potes, Sotres and Fuente Dé"],["h3","1. Potes"],["p","A lovely stone village where four valleys meet, surrounded by mountains on all sides. Don't miss:"],["ul","The Torre del Infantado, a medieval tower in the centre of town."],["ul","The medieval bridges of San Cayetano and La Cárcel, over the River Quiviesa."],["h3","2. Church of Santa María de Lebeña"],["p","On the road through the Hermida gorge you pass this small 10th-century Mozarabic church, set against the mountains. A quick but beautiful stop."],["h3","3. Sotres"],["p","The highest village in the Picos de Europa, at the end of a twisty mountain road. Quiet, stony and surrounded by peaks."],["h3","4. Fuente Dé"],["p","Fuente Dé is famous for its cable car, which climbs 753 metres in just four minutes to the Mirador del Cable, at 1,834 metres. On a clear day the views from the top are magnificent, and several hiking routes start up there."],["p","Our day was not a clear day. The fog and the snow were so heavy that we didn't go up. Seeing the cable car disappear into a white wall was enough for us! So it stays on the list for next time."],["p","In 2020 the cable car cost €11 one way and €17 return, from 10am to 6pm."],["p","From Fuente Dé we drove all the way back to Porto, tired, muddy and very happy."],["h3","Where to Sleep?"],["ul","Cangas de Onís: Hotel Los Lagos Nature."],["ul","Arenas de Cabrales: Hotel Los Ángeles."],["ul","Potes: Hotel Valdecori."],["p","Sleeping in a different village each night means less driving back and forth, and you wake up every morning right where the day's walk begins."]]},{"title":"BARCELONA | City Guide - 4 days in Barcelona + Montserrat 🇪🇸","date":"20 October 2026","tags":["travel","traveling","city guide","spain","barcelona","catalonia","montserrat","vacation","holidays","1 week trip"],"blocks":[["p","Barcelona had been on our list for years, and in April 2024 we finally booked it: four days in the city and one day up in the mountains at Montserrat."],["p","The city has a bit of everything: Gothic alleys, Gaudí buildings that look like they are melting, a beach in the middle of town and food markets that will ruin every other market for you. It is also very walkable, so most of our days were spent on foot, with the metro for the longer hops."],["p","We split the city by neighbourhood, one area per day, so we never wasted time crossing town. Here is how we did it."],["tip","Tip: Barcelona is a short, cheap flight from Porto. We flew out early in the morning and landed before 10am, so the first day was a full day."],["h3","Day 1 - Montserrat"],["p","We started with the mountains. Montserrat is about an hour from Barcelona by train, a jagged mountain range with a Benedictine monastery built right into the rock, more than 700 metres up."],["p","The basilica is home to the Black Madonna, one of the most venerated images in Catalonia, and the monastery has one of the oldest boys' choirs in Europe. Around it there are walking trails, funiculars and viewpoints over the whole of Catalonia."],["tip","Tip: Take the R5 train from Plaça d'Espanya and then the rack railway or the cable car up the mountain. Buy the combined ticket at the station, it covers everything."],["h3","Day 2 - La Rambla, the Gothic Quarter and the Born"],["h3","1. La Rambla"],["p","The most famous street in Barcelona, running from Plaça de Catalunya down to the sea. It is really five ramblas in a row, each with its own personality: Canaletes at the top, always busy; Estudis, once home to the old bird market; Flors, the most colourful stretch, full of flower stalls; Caputxins, close to the Liceu opera house, Palau Güell and Plaça Reial; and Santa Mònica at the bottom, with bars and restaurants and the Columbus monument at the end."],["tip","Tip: Keep an eye on your bag here. It is the busiest street in the city and pickpockets know it."],["h3","2. La Boqueria"],["p","Halfway down La Rambla you will find La Boqueria, one of the most famous food markets in Europe. Colours, smells, fresh juices, jamón, seafood, sweets... It is loud, crowded and wonderful."],["p","A few of the stalls cook small menus with whatever is fresh that day, so this is the perfect place for lunch. Open Monday to Saturday, from 8am to 8.30pm."],["h3","3. El Gòtic"],["p","The Gothic Quarter is the old heart of the city, and the best way to see it is to get a little lost. Some places you should not miss:"],["ul","Plaça Sant Jaume, the political centre of Barcelona, with the City Hall and the Palau de la Generalitat."],["ul","Carrer del Bisbe, the pedestrian street that links Plaça Sant Jaume to the Cathedral, with the famous little bridge."],["ul","Plaça del Rei, the old royal palace square, where the City History Museum shows the Roman ruins underneath the city."],["ul","Plaça Nova, next to the Cathedral, where you can still see part of the two Roman towers."],["ul","El Call, the old Jewish quarter. It was abolished more than 600 years ago, but you can still find traces of it in the narrow streets."],["ul","Portal de l'Àngel, one of the best shopping streets in the city."],["h3","4. Barcelona Cathedral"],["p","The Sagrada Família gets all the fame, but the Cathedral of Santa Eulàlia holds its own with that huge Gothic façade. Go inside and don't skip the cloister, which has thirteen geese living in it. Yes, real geese."],["p","Entrance to the church and cloister is free at certain times. The full visit with the choir, the rooftop terrace and the museum was €11 each in 2024. Go up to the terrace, the view over the Gothic Quarter is worth it."],["h3","5. Picasso Museum"],["p","One of the most important museums in Barcelona, with a huge collection from Picasso's early years, spread over five medieval palaces in the Born."],["p","Tickets were €14 per adult in 2024."],["tip","Tip: On the first Sunday of every month the Picasso Museum is free, but you need to book your slot online in advance."],["h3","6. Moco Museum"],["p","Just around the corner, the Moco Museum is a small museum of modern and street art, with pieces by Banksy, Basquiat, Keith Haring, Kusama, Warhol and KAWS. Very fun, very colourful and very Instagrammable."],["p","We paid €30 online in 2024, with a student discount for Richie."],["h3","7. Basílica de Santa Maria del Mar"],["p","A simple and beautiful Gothic church that became famous thanks to the novel Cathedral of the Sea. Inside it is calm, tall and full of light."],["p","Entrance was €5 in 2024, but from Monday to Saturday between 6pm and 8.30pm it is free, so time your visit for the end of the day."],["h3","Day 3 - Eixample and Gaudí"],["h3","1. Passeig de Gràcia"],["p","The most elegant avenue in the city, full of designer shops like Prada, Gucci, Loewe and Burberry. Even if you are not shopping (we were not!) it is a lovely walk, and it leads straight to some of Gaudí's most famous buildings."],["h3","2. Casa Batlló"],["p","If you only visit one Gaudí house, make it this one. Inside there are no straight lines, everything looks like it is underwater, and the roof looks like the back of a dragon."],["p","We paid €29 with a student ticket in 2024 (adults €35). Open every day from 9am to 8pm, last entry at 7.15pm."],["h3","3. La Pedrera - Casa Milà"],["p","Another Gaudí masterpiece, a few blocks up the avenue. The highlight is the rooftop, with its strange chimneys that look like soldiers."],["p","Tickets were €25 for adults and €19 for students in 2024."],["h3","4. Casa de les Punxes"],["p","Casa Terrades, better known as the House of Spikes, looks like a castle from a fairy tale dropped in the middle of the Eixample. It was designed by Josep Puig i Cadafalch, another big name of Catalan modernism. It is worth a stop even just to see it from the outside."],["h3","5. Sagrada Família"],["p","The most famous building in Barcelona, and still unfinished more than 140 years later. We booked a late afternoon slot, when the light comes through the coloured windows and the whole church turns orange, green and blue. Nothing really prepares you for it."],["tip","Tip: Book your tickets weeks in advance and choose a late afternoon slot for the best light."],["h3","Day 4 - Montjuïc"],["h3","1. Palau Güell"],["p","We started the day back near La Rambla, at Palau Güell, one of Gaudí's first big works, built for his patron Eusebi Güell. The rooftop with its colourful chimneys is the best part."],["p","We paid €8 each with student tickets in 2024 (adults €12)."],["h3","2. Plaça Reial"],["p","Just across La Rambla, a neoclassical square full of palm trees and terraces, with lamp posts designed by a young Gaudí. In the morning it is much calmer than at night, a good moment for a coffee on the square."],["h3","3. Olympic Stadium Lluís Companys"],["p","Up on Montjuïc hill, the main stadium of the 1992 Olympic Games. It is free to peek inside."],["h3","4. National Art Museum of Catalonia (MNAC)"],["p","The museum lives in the huge Palau Nacional, and its collection of Romanesque art is said to be the most complete in the world. Even if museums are not your thing, go up the steps for the view over Plaça d'Espanya."],["p","Adults €12, students 30% off in 2024. Closed on Mondays."],["h3","5. Poble Espanyol"],["p","An open-air museum that recreates 117 buildings, streets and squares from all over Spain. A little bit kitsch and a lot of fun, a whole country in one afternoon."],["p","Tickets were €14 per adult in 2024."],["h3","6. Magic Fountain of Montjuïc"],["p","Normally the day would end here, with the light, music and water show of the Magic Fountain, between Plaça d'Espanya and the MNAC. In 2024, though, it was switched off because of the drought in Catalonia, so we only saw it dry. A good excuse to come back!"],["tip","Tip: Check the show times (and whether it is running at all) before you go."],["h3","Day 5 - Barceloneta, the Born and Gràcia"],["h3","1. Arc de Triomf"],["p","Barcelona's own triumphal arch, made of red brick and built for the 1888 Universal Exhibition. The perfect start for a walk down to the park."],["h3","2. Parc de la Ciutadella"],["p","A green oasis in the middle of the city, with a lake, palm trees and a huge monumental fountain."],["h3","3. Barceloneta Beach"],["p","The city beach, a short walk from the park. In April the water is still cold, but it is perfect for a walk on the sand and a drink at one of the beach bars."],["h3","4. Port Vell"],["p","The old port starts at the Columbus monument at the end of La Rambla and runs to Barceloneta. Hundreds of sailing boats and a lovely wooden walkway over the water."],["h3","5. Maremagnum"],["p","A shopping centre right on the water in Port Vell. Handy if it rains or if you need a break from the sun."],["h3","6. La Ribera"],["p","On the way back up we walked through La Ribera, the old neighbourhood around Santa Maria del Mar, better known as the Born. Narrow streets, little design shops and lots of bars for a late afternoon break."],["h3","7. Vila de Gràcia"],["p","Gràcia used to be a separate village, and it still feels like one: narrow streets, little squares full of terraces, independent shops and a very relaxed vibe. Any time of the day is good to sit down and watch Gràcia go by."],["h3","8. Casa Vicens"],["p","Gaudí's first house, open to the public only since 2017. It is very different from his later work, full of colourful tiles and Moorish details."],["p","We paid €18 each in 2024."],["h3","9. Park Güell"],["p","Originally planned as a luxury housing estate, it became a park that looks like it came out of a fairy tale, with the famous mosaic lizard and the curvy bench overlooking the city. UNESCO World Heritage since 1984."],["p","Adults €10 in 2024. Book a time slot online, it sells out."],["h3","Where to Sleep?"],["p","We stayed at Hostal Barcelona Travel, in the Eixample. It is simple and comfortable, and the location is great: walking distance to Passeig de Gràcia and with metro stations close by to reach everything else."],["h3","Going Home"],["p","On our last day we had time for a final walk before an evening flight back to Porto. Barcelona, we'll be back, if only to see that fountain dancing!"]]},{"title":"VIGO | City Guide - 2 days in Vigo, Spain 🇪🇸","blocks":[["p","Finding Vigo, Spain, in the charm of the largest city in Galicia and discover the heart of the Rías Baixas: it's light, its temperate climate, its gastronomy, its culture, and its incredible landscapes. Visit Vigo and let yourself be carried away by this unique city that always leaves its mark."],["p","Vigo is a city located in the south of Galicia, a short distance from Portugal. A real paradise for a 2-day getaway, romantic or family."],["p","Facing the Atlantic, this maritime city combines its natural beauty with the friendliness that is typical of the Galicians. It is one of the largest cities in Galicia and dazzles thanks to its beautiful estuary. With a vibrant spirit and gastronomy that smells of the sea, Vigo is a destination designed for those who want to enjoy a weekend away from home but close to Portugal, between the sea and nature, perfect for a romantic getaway or a vacation in the family. Its proximity to Portugal makes it suitable for a very short vacation when the goal is to restore energy or simply change the air. As it is a relatively small city - when compared to the large European centers - there is a calm and tranquility that the city transmits. Its beaches with wide sands and crystal clear waters are the icing on the cake. Just a few minutes from the city center, and connected by buses, are the most desired beaches for those visiting Vigo, which combine blue waters and paradisiacal views with recreational areas with swimming pools for those who do not venture to get their feet wet in the waters. from the sea with temperatures close to glaciers."],["p","Having an important fishing port, Vigo has an abundance of seafood and fresh fish, mirrored in the typical gastronomy that can be eaten in the city. In addition to food, the city has several art galleries and museums."],["p","\"You cannot imagine anything more fascinating than this bay of Vigo, an immense lake surrounded by mountains (...)\". Jules Verne"],["p","Vigo was designed for those who are looking for a destination that brings together a wide range of options: beach, water sports, leisure, nightlife, and Galician gastronomy."],["p","Once in Vigo, one of the destinations not to be missed is the Cíes Islands (very soon here)."],["tip","Tip: How to get there? A very practical and economical way to reach Vigo, especially for those traveling from Porto (Portugal), is by train. A few minute's walks from the center are the Vigo train station, without the need to take public transport to start your exploration journey. It is a worthwhile trip, due to the impressive landscapes that the route shows, lasting just over 2 hours and at a very attractive price."],["h3","CITY GUIDE – 2 Dias em Vigo"],["p","There are several activities to do in Vigo, which keep you busy for several days. To be able to enjoy the best that the city can offer, 2 days are enough to venture into the most emblematic points of the city, without any big rush. Taking advantage of the stay in the beautiful Galician city, it is mandatory to visit the Ciés Islands, which must have a day dedicated only to them!"],["h3","Monte do Castro"],["p","It is the highest point in the city, right in the heart of Vigo. Within the walls of this fortress, you will find the castle of O Castro, its gardens, and its spectacular views. From its walls, you have a privileged view of the Vigo estuary, which offers the perfect setting for a photo."],["p","There are two ways to visit this place: by car (with parking just a few meters away) or on foot, however, anyone who wants to climb from the lower part of the city has a long but beautiful climb ahead."],["h3","Casco Vello (Historic Center)"],["p","Vigo breathes from its Historic Center, its charismatic old town: a small village in the middle of an industrial and noisy city. It is the center of an ancient city where the remains of the walls can still be guessed."],["p","In this beautiful neighborhood of alleys and streets that wind down to the sea, located in one of the best gastronomic areas in the city, you can taste wines and tapas, or sit down to dinner in the city's historic restaurants."],["h3","MARCO – Vigo Museum of Contemporary Art"],["p","Suitable for those who like contemporary art. It is located in one of the most popular shopping areas. At our option, do not visit the museum."],["h3","Porta do Sol"],["p","It is one of the most important squares in the city of Vigo, surrounded by restaurants and cafés. A great place to have lunch or rest in the late afternoon, accompanied by a Spanish beer and tapas."],["h3","Rúa Pescadería"],["p","Also called Oyster Street (Calle de las Ostras) and located very close to the port, close to the historic area. An almost mandatory visit! For those who expect a quiet dining area, it is best to avoid it. The street has several restaurants offering seafood and, in particular, oysters from the region. Open, fresh, and tasty."],["h3","Museu Quiñones de León"],["p","It is right at the top of the city and has a privileged view of the entire region. It is worth visiting the museum, and \"spending\" a few hours in the gardens. The outdoor gardens, with free entry, allow you to enjoy an interesting and relaxed afternoon while strolling through the romantic gardens that surround the museum."],["p","The walking route is demanding, marked by demanding climbs. For the more fearful, they can go by taxi, and then enjoy the descent on foot."],["h3","Praia de Samil"],["p","It is the most popular beach in Vigo! With long white sand that contacts with water that, although fresh, is crystal clear. A precious place to enjoy your family with all your offers. Equipped with facilities such as swimming pools, showers, skate parks, picnic areas, and restaurants."],["p","By car, it is only a few minutes away from the city center. For adventurers on foot, the connection between the city and the beach is made quickly by bus."],["h3","Ilhas Cíes"],["p","Click Here (very soon)"],["p","Writing this post I just want to come back again, can I?"]],"date":"2 August 2020","tags":["vacation","travel","2 days trip","galicia","city guide","traveling","spain","vigo","holidays"]},{"title":"MILAN | City Guide - 1 day in Milan 🇮🇹","blocks":[["p","If you want to know more about the complete trip, click here."],["p","Milan is an elegant city, known for its abundance of high-end fashion retailers and the beautiful Duomo Cathedral. The city offers all the advantages of a large city reunited in a relatively small space, thus making it perfect to visit, as tourists can get to most of the city's attractions and museums on foot."],["p","“Retire me to my Milan, where every third thought shall be my grave.\""],["p","William Shakespeare"],["p","Where to go? What to see? What to eat? In this city guide, we present you the route we did in the Summer of 2019, a trip we absolutely loved and think its a must for young couples."],["h3","1. Ossuary at San Bernardino alle Ossa"],["h4","€: Free | Time: 20 min | ★★★✩✩"],["p","This church is best known for its side chapel decorated with numerous human skulls and bones, making it perfect for a quick visit for those with slightly more morbid curiosities."],["h3","2. Piazza del Duomo & Duomo Cathedral"],["p","A 6-minute walk from the ossuary conducts you to the main city square of Milan, the epicenter of the city. The Piazza area is made up of shops, monuments, theatres, and restaurants. It is where everyone goes when they first come to Milan, so it can be one of the busiest spots."],["p","€: Paid Entrance | Time: 120 min |★★★★✩"],["p","Situated in the heart of Milan, this is one beautiful cathedral. You cannot visit Milan without looking both inside this amazing piece of architecture but also, and even better, to go up to the roof and enjoy the look of the rooftop, as it is stunning! You can buy a ticket that includes the elevator to taker you to the rooftop or, as we did, prepare yourself to do some cardio and climb all the stairs. The cathedral rooftop is, without a doubt, the highlight of Milan's Duomo complex."],["tip","Tip 1: buy your tickets in advance, online."],["tip","Tip 2: Save money and buy the entrance both to the cathedral and the rooftop (here)."],["h3","3. Galleria Vittorio Emanuele II"],["h4","€: Free | Time: 60 min | ★★★★★"],["p","This Galleria is definitely worth a pit stop, as it is right next to the Duomo and the Piazza. You can take some time admiring the beautiful interior and lovely shops. For us, this was the most stunning place to visit in Milan. Take your time when visiting the Galleria to take some stunning photos (which can be quite challenging, with all the people around) and visit some name-brand stores."],["h3","4. Piazza della Scala"],["h4","€: Free | Time: 30 min | ★★★✩✩"],["p","This small piazza only requires a quick pit stop. You can't miss it because it's right at the end of the Galleria Vittorio Emanuele II. This piazza contemplates some buildings and monuments:"],["ul","Statue of Leonardo Da Vinci"],["ul","Teatro alla Scala (Milan’s most famous opera house)"],["ul","La Scala (one of Italy’s oldest banks)"],["ul","Palazzo della Banca Commerciale Italiana (Milan’s city hall)"],["ul","Palazzo Marino (Milan’s city hall) - temporary art exhibitions you can access for free."],["h3","5. Castello Sforzesco"],["h4","€: Free | Time: 30 min | ★★★✩✩"],["p","This castell is where the Sforza family, the Dukes of Milan, used to live. You can go inside the courtyard of the castle for free, as it acts as a passage between Piazza Cairoli and the inside of Parco Sempione, Milan’s largest park."],["tip","TIP 1: The best route to reach the castle is to take Via Dante, a pedestrian street not far from Duomo Square with nice stores and bars."],["tip","TIP 2: Take a tour inside the castle and exit from the back door, which leads to Parco Sempione, the next stop."],["h3","6. Parco Sempione & Porta Sempione"],["h4","€: Free | Time: 60-120 min | ★★★✩✩"],["p","Parco Sempione is a large urban park with large green spaces, where both tourists and locals come to rest and relax when it is sunny. The green space is home to the following buildings, you can visit:"],["ul","Porta Sempione: the actual arch is named Arco Della Pace."],["ul","La Triennale di Milano: promotes fine arts and Italian avant-garde architecture."],["ul","Acquario Civico Milano: It has 36 tanks with over 100 different species."],["ul","Arena Civica: impressive amphitheater where concerts and various competitions are currently held."],["h3","7. Brera"],["p","Brera is one of the trendy areas of Milan. The Brera Design District is the perfect way to end your one day in Milan: known for its fashionable cafes, restaurants, and nightlife, you couldn’t ask for a better finishing point to a whirlwind day in Milan."],["h3","Where to sleep??"],["p","In our stay, we loved the hotel we stayed in, the Hotel San Biagio. It was located just a few minutes away from the center, in a quiet zone, next to the train station and a lot of good pizzerias. We had a blast staying there."],["p","If you want to know more about the complete trip, click here."]],"date":"21 August 2020","tags":["milan","italy","travel","city guide","traveling","1 day trip"]},{"title":"CINQUE TERRE | City Guide - 2 days in Cinque Terre 🇮🇹","blocks":[["p","If you want to know more about the complete trip, click here."],["p","Cinque Terre, meaning five towns, is a string of five fishing villages perched high on the Italian Riviera."],["p","Monterosso, Vernazza, Corniglia, Manarola & Riomaggiore."],["p","Once isolated because of the geographic disposition, the villages were shaped by their profound isolation, which makes them a contemporary paradise filled with the feeling of authenticity, few roads, perfectly preserved architecture and a network of stunning coastal and mountain trails."],["p","Visitors can buy an inexpensive pass to hike the scenic trail that laces together the unique communities, as all the five villages are connected by an ancient system of footpaths. However, the easiest way to reach and travel between the villages is by train, as some oh the hiking trails are closed or under renovation. You can buy the train pass (Cinque Terre Train Card), which also gives you access to all the hiking trails, in several points, or online. If you’re traveling by car, leaving it in nearby La Spezia is a smart move."],["p","This is the place to take a sightseeing breather, and inhale slower-paced Italian culture in its purest form."],["p","Where to go? What to see? What to eat? In this city guide, we present you the route we did in the Summer of 2019, a trip we absolutely loved and think its a must for young couples."],["p","Before we start, here are the tips that should guide your visit, so you get the best experience possible:"],["tip","Tip 1: If you are traveling with your suitcases, don't you even try to walk with them throw the paradisic but narrow hiking trails. You can leave your luggage in a luggage storage at the Monterosso, in a laundry (yes, you heard it right!) not far from the station:"],["p","📍Lavarapido laundry"],["p","Address: Via Molinelli, 17"],["p","€: 5 euro/24 h"],["tip","Tip 2: You should buy the Cinque Terre Train Card, the train pass, as it allows you to move between all the villages in the quickest way, all the times you want, with the bonus that gives you access to the hiking trails; This way, you will definitely save some money."],["p","The exciting things Cinque Terre gives you are not the opportunity to visit a monument, but the chance to walk through the streets, colored with beautiful buildings surrounding it, and feel like you have been transported to the past. I think this is what you will remember for the rest of your life."],["h3","Day 1 - Vernazza & Monterosso"],["p","1. Start your day in Vernazza, as it is smaller and can be crowded in the afternoon. If you're carrying luggage, see tip 1;"],["p","2. Explore Monterosso in the afternoon;"],["p","3. When the sun is setting down, take the train and come back to Vernazza to watch the sunset."],["h3","1. Vernazza"],["p","Time: morning & lunch"],["p","Plus: Come back to watch the sunset"],["p","★★★★★"],["p","Things to visit:"],["ul","The Church of Santa Margherita di Antiochia, built on the rocks overlooking the sea (free);"],["ul","The Tower of the Doria Castle (or Vernazza Tower), located above the bay and the small port of Vernazza (paid entrance);"],["ul","The Castello Doria (paid entrance);"],["ul","Enjoy the rest of your time to search through the local stores and restaurants."],["p","Vernazza doesn't have great beaches. However, the crystalline waters of the marina, in front of the Church, are the perfect setting for a quick refreshing swim before continuing the visit of the village and of the surrounding places."],["h3","2. Monterosso"],["p","Time: Afternoon"],["p","★★★★★"],["p","Monterosso is perhaps the most touristic place between the five villages of the Cinque Terre. The village is divided into two parts, marked by the medieval tower of Aurora: Fegina and The old town."],["p","It is impossible not to stop at the Fegina beach, at least to enjoy an Italian ice cream freshly made. Take your time and have a healthy and well-deserved relaxing moment."],["p","Things to visit:"],["ul","The Church of San Giovanni Battista, located in the main square of the old town;"],["ul","The San Francesco Church;"],["ul","The concrete statue of the Giant, Il Gigante, near the beach of Fegina;"],["ul","The statue of San Benedetto d' Assisi, located on the old town side;"],["ul","The Soviore Sanctuary, high up at 400 meters above sea level."],["p","Although Fegina is one of the most popular beaches in the whole area, set right in front of the train station, the beaches located in the old town are worth a visit and make a perfect oasis for a quick refreshing swim between photographs and climbing stairs."],["h3","Day 2 - Corniglia, Riomagiore & Manarola"],["p","1. Start your day in Corniglia so you can take the hiking trail connecting Vernazza. This way it is easier to climb all the numerous stairs connecting both villages. If you decide to walk along this trail, a picturesque view is guaranteed! You will pass the olive trees, vineyards, and Mediterranean bushes. A hike you will never forget, challenging but worth it!"],["p","2. Take the train to visit Riomaggiore;"],["p","3. Go to Manarola. Here, you have two options: you can take the hiking trail, called Via dell’amore, the most famous and romantic stretch of the Cinque Terre coastline, as it is excavated through hard rock and is winding along the rock-face overhanging the sea, providing a magical atmosphere; however, Via dell’amore is closed, under renovation, so the only option you have is to take the train and go from one place to another in 10 minutes;"],["p","4. Contemplate the sunset in Manarola."],["tip","Tip 1:"],["p","Always check with the"],["p","Cinque Terre National Park office"],["p","before you set out, regarding schedules and price actualizations."],["h3","3.Corniglia"],["p","Time: morning"],["p","★★★★✩"],["p","It is the only village which is not built directly on the sea but on a cliff 100 meters above sea level. It's a tranquil village, with tangled streets that lead to a broad and breezy sea-facing terrace, the only vantage point from where you can clock (and photograph) all five villages at once."],["p","If you are attempting trail connecting Corniglia to Vernazza, do make sure you have loads of water and a good pair of hiking shoes. The beginning of the trail is tough thanks to a steep path of ascending steps, and it is this very part of the hike that has it famed for being relatively difficult. Hikers on this route are handsomely rewarded with a spectacular variety of vegetation along the way and a breathtaking panoramic view of the sea and some villages."],["h3","4.Riomaggiore"],["p","Time: morning & afternoon"],["p","★★★★✩"],["p","Known for its colorful stone houses that seem stacked on top of one another, and its harbor filled with traditional fishing boats, Riomaggiore is a fascinating tangle of pastel homes that lean on each other like drunken sailors."],["p","Stroll along the main street of the village that leads down to the sea, where a small marina framed by lovely pastel houses is filled with brightly hued fishing boats. It is a wonderful place to enjoy fabulous landscapes and slowing down to the pace of Italian village life."],["p","The beach at Riomaggiore is located east of the village. The beach is quite extensive and very impressive, making it perfect for a good and photogenic dive."],["p","Things to visit:"],["ul","The Church of San Giovanni Battista (gothic style);"],["ul","The Church of San Lorenzo;"],["ul","The Castle of Riomaggiore, where you can enjoy a wonderful sight over the sea;"],["ul","The Sanctuary of Madonna di Montenero, with a breathtaking panoramic view of the whole coastal line of the Cinque Terre."],["h3","5.Manarola"],["p","Time: afternoon & evening"],["p","★★★★★"],["p","If we had to choose a village that best represents this splendid Italian ancient treasure, it would certainly be Manarola, the oldest and most charming village of the Cinque Terre. The tiny harbor features a boat ramp, picturesque multicolored houses facing the sea, and a tiny piazza with seafood restaurants."],["p","Things to visit:"],["ul","The Church of San Lorenzo and the defense tower."],["p","Although there are no sandy beaches in Manarola, it was here we had the best time reuniting with the sun and salt and deep waters."],["p","This village is the one that offers the best view of the sunset, an absolutely magical moment to experience when in Cinque Terre. To experience a sunset in Manarola is to admire a live painting of changing colors before your eyes!"],["h3","Where to Sleep?"],["p","Accommodation in the Cinque Terre is expensive, oversubscribed and often unremarkable, so it pays to seek out something special and book well in advance. If you're on a budget, great options include staying in La Spezia. We stayed in the Aurora Hotel, right in front of the train station, but we don't recommend it at all! It was like sleeping in a horror movie hotel, we only got through those two nights because we were on a budget! But it's a life experience to really really check the reviews of the hotels we book. But from La Spezia, you can easily visit all 5 villages, as the train zips from village to village daily, with the advantage of a colorful and exciting nightlife and marvelous restaurants that elevate your stay."],["p","If you want to know more about the complete trip, click here."]],"date":"22 August 2020","tags":["travel","italy","2 days trip","traveling","city guide","cinque terre"]},{"title":"PISA | City Guide - 1 day in Pisa 🇮🇹","blocks":[["p","If you want to know more about the complete trip, click here."],["p","Pisa is a legendary city and one of the most explored cities in northern Italy. This is a famous destination, as tourists often stop there when traveling to Florence, to get a look at the most famous tower in the world. However, it is a fantastic city to stay in and offers a great deal more sites than just the legendary leaning tower. For those wishing to visit Pisa, this city has a fantastic array of beautiful historical buildings and indeed it boasts several historical churches."],["p","“Italy, and the spring and first love all together should suffice to make the gloomiest person happy.”"],["p","Bertrand Russell"],["p","We did visit this city en-route to Florence, attracted by the mediatic and photogenic Tower of Pisa. We were not expecting to find the marvelous city we found! We dedicated merely one morning to explore the city, and for us, it was enough and allowed us to rest a bit to keep exploring and recharge batteries to Florence. One disadvantage of the city is the fact most famous architectural monuments are not free of charge, so it can be a quite expensive visit. During our stay, we decided no to enter in any of the attractions, for economic reasons."],["p","Where to go? What to see? What to eat? In this city guide, we present you the route we did in the Summer of 2019, a trip we absolutely loved and think its a must for young couples."],["h3","1. Piazza dei Miracoli"],["p","When arriving Pisa, the best option is to first explore the beautiful Piazza dei Miracoli (Square of Miracles), as your sight will be certainly captivated by the magnificent Tower, the Cathedral, and the Baptistery. The marble whiteness of these monuments resting on the grassy carpet of the piazza treats visitors to a unique sight, with such harmony. But Pisa has a great deal to offer besides the famous piazza."],["h3","1.1. Cathedral of Santa Maria Assunta"],["h4","€: Paid Entrance | Time: 20 min | ★★★✩✩"],["h3","1.2. Leaning Tower of Pisa"],["h4","€: Paid Entrance | Time: 60-120 min | ★★★★★"],["p","Don’t just admire it from below: the climb up the tower is a once-in-a-lifetime opportunity, however a little expensive, in our opinion. If you decide to climb, you will enjoy both the incredible climb as well as the amazing views from the top. Only 40 people at a time are allowed inside the tower and you need to be prepared to climb 300 (old) stairs. So make an online reservation, probably several weeks in advance is the better option."],["p","Take some time to explore this point, as this is the busiest area, filled with tourists in strange positions to get the pictures with the Pisa tower we all know."],["h3","1.3. The Baptistery"],["h4","€: Paid Entrance | Time: 20 min | ★★★✩✩"],["p","Once you have admired the monuments in the piazza from all angles, continue your visit to the other ex-libris in the city. We suggest you take a walk through these beautiful streets from where you can admire the panoramic view over the river and its surroundings."],["h3","2. Campo Santo"],["p","All rights reserved to Wikipedia"],["h4","€: Free | Time: 20 min | ★★★✩✩"],["h3","3. Palazzo dei Cavalieri"],["h4","Closed | Time: 20 min | ★★★✩✩"],["p","Another major sight is the beautiful Piazza dei Cavalieri, only a few minutes’ walk from the Piazza dei Miracoli. Designed by Giorgio Vasari, it was the center of political life during the Middle Ages and a symbol of Medici rule over the city from the Renaissance. The palace is located in the Knights Square, the second most popular square to encounter in Pisa"],["h3","4. Borgo Stretto"],["p","This delightful street is located in the heart of the city and starts at the Piazza Garibaldi next to the Ponte di Mezzo."],["h3","5. Ponte di Mezzo"],["p","All rights reserved to Ross Evans"],["h3","6. River Arno & Santa Maria della Spina"],["h4","Closed | Time: 10 min | ★★✩✩✩"],["p","Standing on the south bank of the Arno is the peculiar little Church of Santa Maria della Spina, a remarkable example of Gothic art in Europe."],["p","If you want to know more about the complete trip, click here."]],"date":"24 August 2020","tags":["1 day trip","city guide","pisa","traveling","travel","italy"]},{"title":"ITALY | City Guide - 8 days in Northern Italy 🇮🇹","blocks":[["p","Italy is, without any doubt, one of Europe’s most exciting countries. With its irresistible food, awesome architecture, diverse scenery, and unparalleled art, it's packed with so many possibilities it can almost be overwhelming."],["p","“Italy is a dream that keeps returning for the rest of your life.”"],["p","Anna Akhmatova"],["p","Where to go? What to see? What to eat? How to travel between places? In this city guide, we present you the route we did in the Summer of 2019, a trip we absolutely loved and think its a must for young couples."],["p","Italy has an extensive and modern network of trains, so all the dislocations between cities were made that way, making it a funny and very cheap way to discover the country."],["p","Our journey started in Milan, we arrived at the airport (Bergamo Airport, Milan) early in the morning (day 1) and slept that night in Milan, the next morning we woke up and got straight to the train station (day 2), DESTINATION: Cinque Terre! Cinque Terre is so romantic! 😍 We spent 2 days in Cinque Terre, visiting all five towns and at night we would walk freely by the city La Spezia. After those 2 nights, we woke up at 7am and crossed the street to get on the train to Pisa (Day 4). Pisa was just a small stop, we got to know the city in just one morning, you'll have plenty enough time, but I think you'll be amazed! Still on the same day, during the afternoon we went to Florence and stayed there two nights. On day 6 we went by train to Verona to visit the city and stayed there sleeping for the last two nights, it's cheaper than staying in Venice and the trip by train is really close, so on day 7 we went from Verona to Venice and came back during the evening to sleep in Verona our last night. On day 8 we left Verona and still manage to visit Lake Garda on our way to the airport! You can now discover all our journeys in the links below! Have fun with us!❣️"],["h4","Day 1 - Milan"],["h4","Day 2 & 3 - Cinque Terre"],["h4","Day 4 - Pisa"],["h4","Day 4 & 5- Florence"],["h4","Day 6 - Verona"],["h4","Day 7 - Venice"],["h4","Day 8 - Lake Garda, on the way to the airport"]],"date":"24 August 2020","tags":["venice","travel","traveling","city guide","florence","italy","milan","cinque terre","pisa","verona","1 week trip"]},{"title":"FLORENCE | City Guide - 2 days in Florence 🇮🇹","blocks":[["p","If you want to know more about the complete trip, click here."],["p","Florence is known as one of the most cultural and historical cities in the world. This city is an open-air museum where you can admire the facades of the awe-inspiring basilicas and cathedrals. It is packed with amazing architecture and places of significance."],["p","If you are looking for a dose of culture and a cradle of the Renaissance, romantic, enchanting, and utterly irresistible buildings, Florence is the perfect place to visit, and will not disappoint."],["p","The entire city is a showcase of the Italian Renaissance. Some of its sights are among Italy's best-known icons - Ponte Vecchio, Michelangelo's David, Brunelleschi's Dome. That’s why it would take weeks to see everything Florence has to offer!"],["p","“Everything about Florence seems to be coloured with a mild
