sp Vanilla"],["ul","1 tbsp Milk (+ if necessary)"],["ul","200g Powdered Sugar"],["h4","Recipe:"],["p","1. Let’s start with the dough: mix all the dry ingredients (add the flour, the brown, 2/3 of the granulated sugar, the cinnamon, the nutmeg and the salt) to the bowl of your mixer and whisk together until combined."],["p","2.In another bowl, add the wet ingredients (the melted butter, the milk, the sour cream, the egg, the vanilla extract, and the 1/3 of the remaining granulated sugar), whisk together until combined, and then heat until the mixture is about 35-37ºC. Set the mixture aside for 10 minutes, to activate de yeast."],["p","3. Then, pour the warm liquid mixture into the dry and run the mixer, fitted with a dough hook, on medium-low for a few minutes."],["p","4. Transfer the dough to a floured surface and knead until you have a smooth not sticky dough (add flour if necessary)."],["p","5. Place the dough in a large and oiled bowl. Cover with a cloth and left the bolt in a warm and cozy place for 3 hours."],["p","6. Once the dough doubled in size is ready to roll. On a floured surface, roll the dough into a rectangle about half a centimeter thick. Move the dough as you go and add flour as needed to the work surface and your rolling pin."],["p","7. To make the cinnamon filling, in a small bowl add the butter to the brown sugar and the cinnamon, and whisk until you have a paste. With the help of a spatula, spread the cinnamon filling all over the dough."],["p","8. Roll the dough tightly."],["p","9. Cut the rolls into small and similarly sized pieces. Don’t cut the pieces too big, as the bought will rise up again and you will end up with huge cinnamon rolls. Place the rolls in an oiled baking dish (the baking dish should be large enough so the rolls are not touching), cover, and place in a warm place to rise for about 1 hour."],["p","10. Baked the rolls at 180ºC for 30 minutes."],["p","11. To make the glaze, add the cream cheese and the butter (both at room temperature), the salt, the lemon juice, the vanilla flavor, and the milk to a bowl, and then whisk with a hand mixer until smooth. Finally, add the powdered sugar and mix until combined."],["p","12. Once cool, add the glaze onto the cinnamon rolls and serve this magnificent Christmas delicacy."]],"date":"31 December 2020","tags":["recipes","bread","cake","christmas","cooking","breakfast","holidays","desserts"]},{"title":"Cinnamon Cookies Recipe","blocks":[["p","We love to cook with cinnamon, our favorite holiday of the year is Christmas! So cinnamon is always in our recipes! 🤭 If you like cookies and cinnamon, this is your recipe! After making this recipe I only whished one of two things, to have a big glass of lemonade or to have added some lemon zest! 😉 (Tip for you)"],["p","Hope you enjoy this recipe as much as we do!"],["h4","Ingredients :"],["ul","125g Butter"],["ul","300g Wheat Flour"],["ul","100g Granulated Sugar"],["ul","1 Egg"],["ul","Cinnamon Powder"],["h4","Recipe:"],["p","1. Turn on the oven at 180 Celsius degrees | 356 Fahrenheit degrees."],["p","2. First, melt the butter in the oven or microwave."],["p","3. In a bowl add the butter, the sugar, and the egg and mix everything very well."],["p","4. Then, slowly, start adding the flour until you get a nice and soft dough."],["p","5. Make small balls of dough and coat them with cinnamon powder."],["p","6. After all cinnamon balls are ready, it's time to take them to the oven! For about 20minutes."],["p","7. You'll get 20-25 cinnamon cookies with this recipe!"],["p","8. Can you smell the fragrance in your kitchen? Isn't it just amazing? I can transport myself to Christmas will the smell of cinnamon in the oven! 😍"]],"date":"5 September 2020","tags":["recipes","christmas","cookies","desserts","cooking","breakfast"]},{"title":"Classic Tiramisu Recipe","blocks":[["p","If you like coffee and Italy, you will love our tiramisu recipe! It's creamy, silky and the taste is amazing!"],["p","It's super mega easy to make and it will be one of your favorite recipes to make!"],["p","Trust us! 😍"],["h4","Ingredients :"],["ul","250g Mascarpone Cheese"],["ul","200mL Cream"],["ul","250-300g Biscuits la Reine"],["ul","300mL Instant Coffee + 6tbsp Granulated Sugar"],["ul","3 Egg Yolks"],["ul","50g Sugar"],["h4","Recipe:"],["p","1. Beat the sugar with the egg yolks in a water bath for a few minutes until it thickens and becomes much lighter. Let it cool for a bit."],["p","2. Beat the mascarpone cheese with the cream (both should be very cold) until it becomes a consistent cream. Join it with the previous egg cream you made."],["p","3. Make 300mL of strong dark instant coffee and add 6 tbsp of granulated sugar."],["p","4. In a medium container, place a layer of La Reine Biscuits soaked in the coffee syrup, cover with half the cream, make a new layer of biscuits soaked in coffee and finish with the rest of the cream. Refrigerate at least 4 hours"],["p","5. Before serving, sprinkle with cocoa powder, and boom, you made magic!"]],"date":"19 January 2021","tags":["desserts","italian","cooking","recipes"]},{"title":"Coca-Cola Cake Recipe","blocks":[["p","I know it sounds weird, but I'll make you a coke cake! But I guarantee it surprises! With a different touch, it will attract attention anywhere! With a touch of chocolate!"],["h4","Ingredients:"],["ul","4 Eggs"],["ul","2 Cups Granulated Sugar"],["ul","2 Cups Flour"],["ul","1 Cup Chocolate Powder"],["ul","1 tsp Baking Powder"],["ul","200g Butter"],["ul","1 Can (33cL) Coca-Cola"],["ul","Butter to Grease the Pan"],["ul","1 tbsp Cornstarch Flour"],["ul","3 tbsp Granulated Sugar"],["ul","3 tbsp Chocolate Powder"],["ul","1 tbsp Butter"],["ul","1 Cup Milk"],["h4","Recipe:"],["p","1. Turn on the oven at 180 Celsius degrees | 356 Fahrenheit degrees."],["p","2. Separate the egg whites from the egg yolks and whisk the egg whites."],["p","3. To the egg yolks add the sugar and stir until it forms a creamy and airy mixture."],["p","4. Add the softened butter and coke and mix well. Then add the chocolate powder, the flour, and the baking powder and gently wrap."],["p","5. Grease a circular shape pan with butter and flour."],["p","6. Pour the batter into the pan and bake about 40 minutes or until the toothpick comes out dry."],["p","7. Dissolve the cornstarch flour in 1 tablespoon of milk. Put the rest of the milk, the cornstarch flour mixture, the chocolate powder and the butter over low heat."],["p","8. Stir the mixture continuously until it thickens and begins to bubble, allowing to boil for 1 minute."],["p","9. Allow the icing to cool slightly before embellishing the cake."]],"date":"22 August 2020","tags":["cooking","portuguese","desserts","chocolate","cake","recipes"]},{"title":"Coconut Shrimp Curry Recipe","blocks":[["p","The yellow color of this dish is amazing, and its flavor will transport you to the most amazing places!"],["p","Once again, we only bring you easy and delicious recipes! It's our promise to you!"],["p","Give it a try!"],["h4","Ingredients :"],["ul","250mL Coconut Milk"],["ul","250g Shrimps"],["ul","1 Chilli"],["ul","1 Onion"],["ul","1 Cup White Rice"],["ul","3 tbsp Curry"],["ul","Salt"],["ul","Olive Oil"],["ul","Black Pepper"],["ul","Dry Parsley"],["h4","Recipe:"],["p","1. In a pan, place a drizzle of olive oil, salt, and a cup of rice over high heat."],["p","2. Add two cups of boiling water and stir."],["p","3. As soon as the water evaporates, cover the pan and place the stove on low heat for 15 minutes. The rice will be ready."],["p","4. In a frying pan, place olive oil, salt, black pepper, parsley, and the chili to sauté."],["p","4. Add the shrimps and after 3 minutes add the coconut milk."],["p","5. Bring to a boil and then add the curry."],["p","6. Wait until the sauce starts to thicken and it's ready!"],["p","7. Serve the rice in a bowl and place the shrimp on top with plenty of sauce!"],["p","8. A dish full of color and flavor!"]],"date":"30 November 2020","tags":["cooking","main dishes","spicy","recipes","seafood"]},{"title":"Cod with Cornbread Crust Recipe","blocks":[["p","So, it's Christmas time, we are in Portugal, we eat a lot of fish, so it's one more recipe of Codfish!"],["p","With bread and potatoes! Soooo, no carbs! Right?"],["p","Hope you like this simple, yet delicious, recipe!"],["h4","Ingredients :"],["ul","500g shredded cod"],["ul","500g Portuguese Cornbread"],["ul","1kg Small Potatoes"],["ul","400g Spinach"],["ul","2 onions"],["ul","Olive Oil"],["ul","White Wine Vinegar"],["ul","Tomato Pulp"],["ul","Black Pepper"],["ul","Salt"],["h4","Recipe:"],["p","1. Wash the potatoes and cut them in half, without peeling their skin."],["p","2. In a pan with boiling water, place the potatoes with salt and boil for 8 minutes."],["p","3. In a frying pan place the spinach with salt, black pepper, white wine vinegar, and olive oil to sauté."],["p","4. Put two chopped onions in a pan, salt, black pepper, tomato pulp, and olive oil. Bring to the heat and let it cook for 4min. Then place the shredded cod and let it cook for 8 minutes."],["p","5. Brush an oven tray with olive oil and then place the potatoes previously slightly cooked, then place the spinach and then the cod."],["p","6. With your hands create crumbs from the Cornbread and place them on top of the cod, brushing again with olive oil."],["p","7. Bake for 30 minutes in the oven at 180ºC | 356ºF or until the bread begins to toast."],["p","8. Good Appetite!"]],"date":"26 December 2020","tags":["cooking","portuguese","main dishes","fish","bread","recipes"]},{"title":"Cod with Cream Recipe","blocks":[["p","Who doesn't love a good dish just out of the oven? Directly from the platter to the plate, just be careful because it will be hot!"],["h4","Ingredients:"],["ul","600g of Codfish"],["ul","1Kg of Potatoes"],["ul","1 Large Onion"],["ul","40g Cornstarch Flour"],["ul","40g Butter"],["ul","250mL Milk"],["ul","250mL Cream"],["ul","Water from the boiled Codfish"],["ul","Black Pepper"],["ul","Nutmeg"],["ul","Lemon"],["ul","Olive oil"],["ul","Salt"],["ul","Breadcrumbs"],["h4","Recipe:"],["p","1. Place the codfish to be cooked in water. Once cooked, remove the codfish to shred and reserve the water aside, it will be used in the bechamel sauce."],["p","2. Cut the potatoes into cubes and fry them, without being too browned, trying to obtain a slightly golden color."],["p","3. In a pan, place the chopped onion, a drizzle of olive oil, black pepper, and salt to sauté."],["p","4. Add the codfish to the braised and after it has been thoroughly refined add the fries and turn off the stove."],["p","5. Bechamel sauce: In a saucepan, place 500mL of the codfish cooking water with the butter, cream and milk (dissolve the cornstarch flour in the milk, before adding to the mixture) let it boil until it thickens and turn off. Season with nutmeg and lemon juice."],["p","6. Put the béchamel sauce in the pan with the cod and mix everything well. Place the mixture on a platter and sprinkle with breadcrumbs and bake at 180 Celsius degrees until golden on top and serve."]],"date":"23 August 2020","tags":["cooking","portuguese","main dishes","fish","recipes"]},{"title":"Double Chocolate Chunk Cookies Recipe","blocks":[["h4","Ingredients - Red Berries Topping :"],["ul","1 Cup Unsalted Butter (250g)"],["ul","1 Cup Brown Sugar (160g)"],["ul","½ Cup Granulated Sugar (110g)"],["ul","2 Large Eggs"],["ul","½ Cup Dark Cocoa Powder (50g)"],["ul","2½ Cups All-Purpose Flour (330g)"],["ul","1 tsp Vanilla Flavor"],["ul","½ tsp Baking Soda"],["ul","½ tsp Baking Powder"],["ul","½ tsp Sea Salt"],["ul","1 Cup Semisweet Chocolate Chunks (130g - roughly chopped)"],["ul","Parchment Paper"],["h4","Recipe - Red Berries Topping:"],["p","1. Break the chocolate bar roughly into tiny pieces."],["p","2. In a mixer place the sugars to beat with the butter for 3min until you get a light and fluffy dough."],["p","3. Add the eggs, one at a time."],["p","4. After incorporating the eggs, add cocoa, flour, baking powder, baking soda, vanilla flavor, and sea salt."],["p","5. Then add the chocolate pieces."],["p","6. Take the dough to the refrigerator for 15 minutes."],["p","7. Heat the oven to 180ºC | 356ºF."],["p","8. Place a sheet of parchment paper on an oven tray and form 10 uniform balls with the previously prepared dough."],["p","9. Bake for 10-12min."],["p","10. Let the cookies rest on a cooling rack for 15 minutes and they are ready to be eaten!"],["p","11. Attention! One cookie per person! 🤣🤣🤣"]],"date":"13 February 2021","tags":["american","desserts","cooking","chocolate","recipes","cookies"]},{"title":"Easy Beef Nachos Recipe","blocks":[["p","Who loves spicy food? We do!!! 🥰 This is a perfect recipe to dip your tortilla chips in! or if you prefer you can do this recipe in the oven, with nachos and grated cheese!"],["p","Take notice that this recipe is super spicy, if your not a big fan of hot-spices don't use the habanero pepper!"],["p","Hope you like it! 😍"],["h4","Ingredients :"],["ul","200g Tortilla Chips"],["ul","500g Ground Beef"],["ul","1 Onion"],["ul","1 Habanero"],["ul","1 Chili Pepper"],["ul","50mL White Wine"],["ul","8 Tomatoes"],["ul","2 tbsp All-Purpose Flour"],["ul","Parsley"],["ul","Olive Oil"],["ul","Salt"],["ul","Oregano"],["h4","Recipe:"],["p","1. Place the tortilla chips in a bowl."],["p","2. Place the chopped onion, a drizzle of olive oil, parsley, salt, chopped chili pepper, and a chopped habanero in a pan."],["p","3. Let it cook for 3 minutes and add the white wine, let it refuse."],["p","4. After starting to boil, add the tomatoes and cook until they fall apart when stirring."],["p","5. Add ground beef and cook."],["p","6. To thicken the sauce add 2 tbsp all-purpose flour and stir for 2 min."],["p","7. It's ready! Now just eat these wonderful and spicy nachos!"]],"date":"12 January 2021","tags":["recipes","appetizers","mexican","cooking","spicy","meat"]},{"title":"Easy Crepe Recipe","blocks":[["p","A fun recipe to do with young people ❤️ they love to fill their own crepe! But be aware, because they can be very lickerish! 😂 Like we are!"],["p","Have fun with us, and try this recipe at home!"],["h4","Ingredients :"],["ul","1 Cup Flour"],["ul","1 Cup Milk"],["ul","2 tbsp Vegetable Oil"],["ul","2 Eggs"],["ul","Ice Cream or Jam"],["h4","Recipe:"],["p","1. Heat the milk until it is warm and dissolve the flour in the milk."],["p","2. Add the 2 tablespoons of vegetable oil and the two eggs."],["p","3. If lumps of flour remain, you can pass through a colander."],["p","4. Let stand for 2 hours in the fridge."],["p","5. Grease a frying pan with a little vegetable oil and place a scoop of the mixture into the middle of the pan."],["p","6. After it starts to get dark, turn the crepe over and leave it on the heat for a little while."],["p","7. You are ready to fill it with ice cream, cinnamon, jam... or even better, chocolate! 🤤"]],"date":"27 September 2020","tags":["recipes","cooking","breakfast","desserts","ice cream"]},{"title":"Easy Homemade Mayonnaise Recipe","blocks":[["p","This is a very easy and fast recipe of mayonnaise you can make yourself! It one of those things you can believe how easy it is to make!"],["p","I believe that now you will start making your own at home! 😍"],["h4","Ingredients :"],["ul","1 Egg"],["ul","200mL Vegetable Oil"],["ul","1 tsp Lemon Juice"],["ul","1 tsp White Wine Vinegar"],["ul","2 tsp Mustard"],["ul","½ tsp Black Pepper"],["ul","½ tsp salt"],["h4","Recipe:"],["p","1. Place an egg in a tall glass."],["p","2. With the help of a kitchen wand, grind the egg and start adding oil in small strands. Very slowly."],["p","3. Gradually, while adding the oil, a paste is created."],["p","4. Add vinegar, lemon juice and pass it all over again with the help of the kitchen magic wand."],["p","5. Season with mustard, salt, and black pepper to taste."],["p","6. You are ready! Super easy and fast!"]],"date":"2 November 2020","tags":["main dishes","appetizers","cooking","recipes"]},{"title":"Fig and Brie Burger Recipe","blocks":[["p","We know that adding jam to a hamburger can be weird, but this recipe will amaze you! You can trust us!"],["p","This burger has a sweet and cheese flavor that will win your heart and your belly! 😂"],["p","Give it a try!"],["h4","Ingredients :"],["ul","2 Bolo do Caco Bread (check the recipe here)"],["ul","320g Ground Beef"],["ul","3 Eggs"],["ul","2 tbsp Breadcrumbs"],["ul","Salt"],["ul","Black Pepper"],["ul","Olive Oil"],["ul","4 Slices of Brie Cheese"],["ul","4 tsp Fig Jam"],["ul","50g Arugula"],["ul","4 tbsp Mayonnaise"],["h4","Recipe:"],["p","1. Place the ground beef, breadcrumbs, 1 egg, salt, and pepper in a bowl. Mix everything very well and form 2 hamburgers."],["p","2. Heat a frying pan with a drizzle of olive oil and place the hamburgers on the grill, 6min on each side."],["p","3. In another pan add a drizzle of olive oil and fry two eggs."],["p","4. Break the 2 Bolo do Caco pieces of bread in half and place 1 tbsp of mayonnaise on each half of the bread."],["p","5. Place the hamburger on the bread, then add 2 slices of brie cheese."],["p","6. Then add the fig jam, the arugula, and the fried egg."],["p","7. Now just close the burger and be delighted!"],["p","8. You can try this recipe with some french fries or noisettes."]],"date":"4 November 2020","tags":["recipes","bread","american","main dishes","portuguese","cooking","meat"]},{"title":"Flaming Garlic & Whisky King Prawns Recipe","blocks":[["h4","Ingredients :"],["ul","2Kg King Prawns"],["ul","3 Garlic Cloves"],["ul","½ Cup Olive Oil (125mL)"],["ul","1 tsp Salt"],["ul","1 tbsp Hot Sauce"],["ul","1tbsp Black Pepper"],["ul","150mL Whiskey (30ml x 5 - shot glass)"],["ul","Olive Oil"],["h4","Recipe:"],["p","1. You can use frozen or fresh shrimp."],["p","2. We chose frozen shrimp and allowed it to thaw for 2 hours."],["p","3. After thawing slightly, we remove the legs and body of the shrimp. Leaving the head and tail."],["p","4. Next, place the shrimp in a bowl with the finely chopped garlic, oil, hot sauce, salt, and black pepper."],["p","5. Let marinate for 1 hour."],["p","6. In a frying pan, place a drizzle of olive oil and a portion of the shrimp, after 3 minutes turn the shrimp over and wait again for 3 minutes."],["p","7. Add a shot glass of whiskey to flambe the prawns."],["p","8. Repeat this process until the prawns are all ready!"],["p","9. At the end, enjoy the sauce left in the pan to pour over the prawns!"],["p","10. This is THE real delicacy!"]],"date":"21 January 2021","tags":["recipes","seafood","cooking","appetizers"]},{"title":"Focaccia al Pomodoro Recipe - Cherry Tomato Bread","blocks":[["h4","Ingredients :"],["ul","1 tsp Granulated Sugar"],["ul","5g Bakers Yeast (or 15g Fresh Bakers Yeast)"],["ul","1 ½ Cups Warm Water (not hot water)"],["ul","3 Cups Wheat Flour"],["ul","2 tsp Salt (Sea Salt)"],["ul","¼ Cup Olive Oil + 3 tbsp Olive Oil"],["ul","10 Cherry Tomatoes"],["h4","Recipe:"],["p","1. In a mug, put the sugar, the baker's yeast, and add the warm water, dissolve everything well and let it sit for 10min."],["p","2. In a bowl, add the flour and make a hole in the middle, gradually add the previous preparation and knead the dough with your hands."],["p","3. Add the olive oil and salt and continue to knead for 2min."],["p","4. Cover the bowl with a cloth and let it rise for 1 hour at room temperature."],["p","5. One hour later, take a tray and place a sheet of buttered parchment paper and add the dough, let it rise for another 30 minutes."],["p","6. After rising again, cut tomatoes in half and distribute them in the dough adding coarse salt."],["p","7. Bake for 20min at 200ºC | 392ºF"],["p","8. Cut the Focaccia into large pieces and make dipping sauces to accompany."]],"date":"9 January 2021","tags":["recipes","bread","italian","vegetarian","cooking","appetizers"]},{"title":"Francesinha - Little Frenchie Portuguese Sandwich Recipe","blocks":[["p","In Portugal, especially in PORTO, we love to eat Francesinha, this kind of sandwich is very traditional, and you will find it made in numerous ways, but promise to me that you'll try the original one! That's the best! One of the best dishes in the hole country!"],["h4","Ingredients :"],["ul","12 Slices of Rustic Bread"],["ul","6 Steaks"],["ul","12 Fresh Sausages"],["ul","12 Slices of Ham"],["ul","12 Slices of Chorizo"],["ul","6 Eggs"],["ul","1Kg Potatoes"],["ul","18 Slices of Cheese"],["ul","Olive Oil"],["ul","Oil to Fry"],["ul","Salt"],["h4","Ingredients - Sauce :"],["ul","33cl Beer"],["ul","66cl Water"],["ul","1 tbsp Cornstarch"],["ul","1 tbsp Butter"],["ul","1 Garlic Clove"],["ul","1 tbsp Port Wine (or Whisky)"],["ul","½ Squeezed Lemon Juice"],["ul","5 tbsp Tomato Pulp"],["ul","Chili"],["ul","Salt"],["h4","Recipe:"],["p","Sauce:"],["p","1. In a saucepan, brown the garlic clove with a tablespoon of butter."],["p","2. Then add the beer and water, covering the pot until it boils."],["p","3. Remove a cup of the hot sauce to undo the cornstarch and add it to the sauce, again."],["p","4. Add the Port Wine, the lemon juice, the tomato pulp, the salt, and the chili to taste (spicy 😍)."],["p","5. Let it boil until it thickens."],["p","Francesinha:"],["p","1. In a frying pan, place olive oil to do the steaks for about 8-10min."],["p","2. Cut the potatoes into sticks and fry in hot oil."],["p","3. Then, on a baking tray, place the first slice of bread, then the steak, covered with two slices of ham, two slices of chorizo, and two sausages cut in half."],["p","4. Place another slice of bread and a fried egg on top. At the end of the assembly, cover everything very well with sliced cheese, try choosing a cheese that melts very well, and that you love to eat!"],["p","5. Place the Francesinhas in the oven to melt the cheese at 180 Celsius degrees | 356 Fahrenheit degrees, for about 15min."],["p","6. Serve everything in a deep dish with plenty of sauce and fried potatoes."]],"date":"7 October 2020","tags":["cooking","portuguese","main dishes","spicy","meat","recipes"]},{"title":"French Tart Tatin Recipe","blocks":[["p","When November comes, it's time to feel the Christmas spirit! Put some Christmas songs paying at your place and let's go to the kitchen make amazing dishes to be eaten near the fireplace!"],["p","Oh Lord, it's the most wonderful time of the year!"],["h4","Ingredients :"],["ul","4 Apples"],["ul","10 Ginger Zest"],["ul","3 Stars of Anise"],["ul","¾ Cup Granulated Sugar"],["ul","1 Sheet of Shortcrust Pastry"],["ul","Ice cream to serve"],["h4","Recipe:"],["p","1. Peel the apples and cut them into 4 slices each."],["p","2. In a frying pan, place the sugar, ginger slices, anise stars, and butter."],["p","3. Bring to medium heat and place the apples with the round faces down."],["p","4. Without stirring the preparation, leave it in the pan for 30 to 45 minutes - it depends on the amount of water released by the apples while cooking - until it reaches a caramel color."],["p","5. If the frying pan can go to the oven, cover it with the shortcrust pastry and bake at 180ºC | 356ºF."],["p","6. If the frying pan cannot go to the oven, like ours, put it in a tart pan and then cover it with the shortcrust pastry and put it in the oven at 180ºC | 356ºF."],["p","7. Leave in the oven for 30 minutes or until toasted."],["p","8. Allow to cool for 5 minutes and it's time to do the platting, be careful not to burn yourself on the hot caramel."],["p","9. Let it cool down a bit and plate it with two scoops of ice cream and enjoy this delicacy!"],["p","10. It's so delicious!"]],"date":"17 November 2020","tags":["recipes","french","cooking","desserts"]},{"title":"Fried Blue Whiting with Bean Salad Recipe","blocks":[["p","Fried Blue Whiting fish laden with lemon juice, will make your mouth water! It is a dish that can be accompanied by many delicacies, but nothing better than a good bean salad."],["h4","Ingredients :"],["ul","12 Blue Whiting"],["ul","6 Egg"],["ul","500g Baked Black Beans"],["ul","500g Green Beans / Pods"],["ul","200g Flour"],["ul","3 Eggs"],["ul","Oil to Fry"],["ul","Olive Oil"],["ul","Vinegar"],["ul","Salt"],["h4","Recipe:"],["p","1. Place 6 eggs to cook in a pan with water for 15min. After cooking, peel the eggs, slice them and add to the black beans and green beans (previously cooked in water and salt for about 25min)."],["p","2. Season with salt, olive oil, and vinegar and mix everything well. Take it to the fridge."],["p","3. Remove the head of the fish and pass them through 3 whisked eggs and then flour."],["p","4. With the oil very hot, fry the fish, and then while eating drizzle them with freshly squeezed lemon juice."]],"date":"3 October 2020","tags":["cooking","portuguese","main dishes","fish","recipes"]},{"title":"Fried Chicken Recipe","blocks":[["h4","Ingredients - Marinade :"],["ul","1Kg Chicken Pieces"],["ul","2 tsp Salt"],["ul","2 tbsp Soja"],["ul","2 tbsp Ginger Zest"],["ul","1 tsp Garlic Paste"],["ul","2 tsp Black Pepper"],["ul","½ Cup Milk"],["h4","Ingredients - Coating :"],["ul","3 Cups All-Purpose Flour"],["ul","½ Cup Cornstarch"],["ul","1 tsp Salt"],["ul","1 tsp Garlic Powder"],["ul","1 tbsp Paprika"],["ul","½ tsp Sweet Chili"],["ul","Water"],["ul","+ Vegetable Oil to Fry"],["h4","Recipe:"],["p","1. Cut the chicken into pieces. Cut the chicken breasts into small pieces, almost like nuggets."],["p","2. In a bowl place the chicken to marinate, add salt, soy sauce, ginger zest, garlic paste, black pepper, and milk."],["p","3. Let it marinate for 3-5 hours."],["p","4. Now is the time to coat the chicken."],["p","5. In a deep dish add the flour, cornstarch, salt, garlic powder, paprika, and sweet pepper. In another deep dish put water."],["p","6. Pass the chicken pieces through the flour mixture, then through the water, and again through the flour mixture."],["p","7. Fry in very hot oil for 7-10min per piece."],["p","8. Let it cool down a little and then just enjoy this delicacy!"],["p","9. Add some delicious sauces and it's time to lick yourself!"]],"date":"27 February 2021","tags":["main dishes","spicy","meat","cooking","american","recipes"]},{"title":"Golden Codfish Recipe","blocks":[["p","There is no color more beautiful than the yellow of the golden cod that comes from the homemade eggs of the chickens in the yard! With the freshness of the freshly picked parsley, there is a plate to eat and cry for more!"],["p","That's why it's called Golden Codfish! In Portugal is a very traditional recipe to do in a dinner for friends and family! Yes we eat a lot of Cod in Portugal, but it's part of our tradition 😊"],["h4","Ingredients :"],["ul","800g Desalted Shredded Cod"],["ul","500g Potatoes"],["ul","1 Carrot"],["ul","3 Eggs"],["ul","2 Bay Leaves"],["ul","Oregano"],["ul","Parsley"],["ul","Salt"],["ul","Olive oil"],["ul","Oil to fry"],["h4","Recipe:"],["p","1. Cut the potatoes into sticks and fry until golden."],["p","2. In a pan, place the cod to sauté with the oil, salt, bay leaves, and the chopped carrots."],["p","3. Add the potatoes to the cod mixture and add fresh parsley."],["p","4. In a bowl, whisk 3 eggs and add to the refuse to obtain the golden color and turn off the stove."],["p","5. Remove the bay leaves and serve on a platter or plate adding more freshly cut fresh parsley."],["p","6. Can you show me how beautiful yours look? 😍"]],"date":"1 September 2020","tags":["cooking","portuguese","main dishes","fish","recipes"]},{"title":"Homemade Peanut Butter and Hazelnut Butter Recipe","blocks":[["p","If you love nuts as much as we! This is your recipe! In Portugal this kind of butter is really expensive! So we make our own, and for me (Richie) it tastes even better! You can eat it with cookies, on bread, put it on a dessert! You name it! This is a super versatile recipe than anyone can make! Let's give it a try!"],["h4","Ingredients - Peanut Butter:"],["ul","2.5 Cups Peanuts (350g)"],["ul","¼ Cup Olive Oil"],["ul","Salt"],["h4","Ingredients - Hazelnut Butter :"],["ul","2.5 Cups Hazelnuts (350g)"],["ul","⅓ Cup Olive Oil"],["ul","Salt"],["h4","Recipe:"],["p","1. Turn on the oven at 180 Celsius degrees | 356 Fahrenheit degrees."],["p","2. Place the nuts in an oven tray and put them in the oven for about 20 minutes, until they start toasting!"],["p","3. After that, place the hazelnuts in a fabric towel and rub it, this process with easily pell all the hazelnut skin off in a second."],["p","4. After you remove the hazelnut skin, place them in a food processor and add olive oil, and turn it on at maximum speed for about 15min. Taste it and add a pinch of salt or not! 😉"],["p","5. Do the same thing to do the peanut butter ( or any kind of nuts) but notice that the olive oil amount is deferent, because when toasted the peanuts are more greasy that the hazelnuts, so they don't need as much olive oil."],["p","6. This is super simple and easy to make! I love eating these kinds of butter with Carob Bread! You should try it."],["h4","Ps- You can always add some chunks of nuts to your butter to make it crunchy!"]],"date":"30 August 2020","tags":["recipes","appetizers","breakfast","cooking","american","desserts"]},{"title":"Homemade Seasoned Rustic French Fries Recipe","blocks":[["h4","Ingredients :"],["ul","1Kg of Potatoes"],["ul","2 tbsp Paprika"],["ul","2 tbsp Black Pepper"],["ul","2 tbsp Oregano"],["ul","1 tbsp Salt"],["ul","Vegetable oil (for frying)"],["h4","Recipe:"],["p","1. Wash the potatoes very well."],["p","2. Cut the potatoes into sticks, keeping the potato skin."],["p","3. Place the potatoes in a bowl and start seasoning."],["p","4. Add salt, black pepper, paprika, and oregano."],["p","5. Stir everything well."],["p","6. Put vegetable oil to heat on a frying pan and when it's hot start frying your potatoes!"],["p","7. I promise they'll be the best french fries you've ever tasted!"]],"date":"14 January 2021","tags":["appetizers","cooking","american","recipes"]},{"title":"Italian Panna Cotta Recipe","blocks":[["p","We love fresh and consistent desserts! And a well-made Panna Cotta has each of those things!"],["p","Try our recipe and tell us what you thought!"],["h4","Ingredients :"],["ul","600mL Cream"],["ul","600mL Milk"],["ul","7 Gelatin Sheets"],["ul","150g Granulated Sugar"],["ul","1tbsp Vanilla Flavor"],["h4","Ingredients - Sauce :"],["ul","500g Red Fruits"],["ul","½ Lemon Juice"],["ul","100g sugar"],["h4","Recipe:"],["p","1. Place the gelatin sheets in cold water to hydrate."],["p","2. In a saucepan, mix the cream, milk, sugar, and vanilla flavor."],["p","3. Bring to medium heat."],["p","4. When it starts to bubble, remove from heat (do not let it cool)."],["p","5. Remove the water from the gelatin sheets, squeeze them, and incorporate them into the mixture while still hot. Moving."],["p","6. Serve on a platter or in individual portions."],["p","7. Let stand at least 6 hours in the refrigerator."],["h4","Recipe - Sauce:"],["p","1. Mix all ingredients in a saucepan and place over high heat."],["p","2. When it boils, put it on low heat and let it boil until it gets a consistency of jam."],["p","3. Allow to cool and when cold can be added to the panna cotta when serving!"],["p","4. Look, isn't it the most beautiful dessert you have ever seen? And it's so delicious! 🤤"]],"date":"3 November 2020","tags":["cooking","italian","desserts","recipes"]},{"title":"Italian Pizza Dough Recipe","blocks":[["h4","Ingredients :"],["ul","3 ½ Cups all-purpose flour (430g)"],["ul","½ tbsp Granulated Sugar"],["ul","½ tsp Salt"],["ul","1 Cup Warm Water (250mL)"],["ul","¼ Cup Olive Oil (60mL)"],["ul","1 tsp Instant Dry Yeast"],["h4","Recipe:"],["p","1. In a glass, mix the warm water with sugar, olive oil, and instant dry yeast."],["p","2. In a Stand Mixer place the dough hook and add the flour."],["p","3. Turn on the mixer and slowly add the previous water preparation."],["p","4. Let knead for 5 min until you get a nice, smooth dough."],["p","5. Add the salt and let it knead for another 1 min and let it rest for about 5 hours."],["p","!After Resting: Just stretch the dough with a rolling pin and add the toppings you like best! Bake for 30 minutes at 180ºC | 360ºF."]],"date":"25 February 2021","tags":["italian","cooking","main dishes","bread","recipes"]},{"title":"Key Lime Pie Recipe","blocks":[["h4","Ingredients - Dough :"],["ul","200g Wheat Flour"],["ul","100g Unsalted Butter (broken into pieces)"],["ul","1 Egg"],["ul","1 teaspoon salt"],["ul","3 tbsp Sugar"],["h4","Recipe - Dough :"],["p","1. Preheat the oven to 180ºC | 360ºF."],["p","2. Add the flour, sugar, and salt to the bowl of an electric mixer and mix everything together."],["p","3. Add the egg and butter, cold and cut into small pieces, and mix until uniform."],["p","4. Add the flour and continue to mix until a crumbly dough is left. Do not knead too much so that the dough is not hard."],["p","5. Make a ball with the dough, sprinkle the counter with flour, and roll out the dough."],["p","6. Put the dough in the shape of a pie, put it well, and remove the excess dough with a knife."],["p","7. Bake for 10 minutes at 165ºC | 330ºF."],["h4","Ingredients - Cream :"],["ul","200mL Condensed Milk"],["ul","5 Limes (squizzed juice)"],["ul","1 Lime (zest)"],["ul","5 Egg Yolks"],["ul","3 tbsp Sugar"],["h4","Recipe - Cream :"],["p","1. In a bowl, mix the condensed milk, egg yolks, sugar, and lime juice and zest very well."],["p","2. Pour the cream over the dough base, that you took from the oven."],["p","3. And bake again for 25 minutes at 180ºC | 360ºF.."],["p","4. Remove from the oven and allow it to cool down."],["p","5. Then, place in the refrigerator."],["h4","Ingredients - Whipped Cream :"],["ul","200mL Cream"],["ul","1½ tbsp Granulated Sugar"],["h4","Recipe - Whipped Cream :"],["p","1. Whip the whipped cream with the sugar."],["p","2. When serving, unmold the pie and place the cream on top."],["p","3. You are ready to eat."]],"date":"9 March 2021","tags":["cooking","american","desserts","recipes"]},{"title":"Lemon and Pepper Calamari Recipe","blocks":[["p","This Recipe is one of the most known dishes in Spain, and since we went to Picos de Europa, and we tried it there, we wanted to do it ourselves! As always! They normally use Paprika, we used black pepper! You can do it both ways, as it better suits you!"],["p","The recipe is super super easy to make, and with a good mayonnaise, it will be an amazing dish!"],["p","Don't forget about the fresh lemon, it will change everything!"],["h4","Ingredients :"],["ul","3 Large Squids"],["ul","½ Cup Wheat Flour"],["ul","½ Cup Corn Flour"],["ul","Salt"],["ul","Lemon Juice"],["ul","Black Pepper"],["ul","Oil to Fry"],["ul","Slices of Lemon"],["h4","Recipe:"],["p","1. Clean the squids and cut them into strips."],["p","2. Put them in a bowl and season with salt, black pepper, and lemon juice. Let it rest for 30min."],["p","3. In a bowl, place corn flour, wheat flour, salt, and black pepper, mix everything."],["p","4. Put the oil to heat to fry the squids."],["p","5. Pass the squids through the flour mixture and then fry them."],["p","6. As soon as the squids begin to look golden, they are ready!"],["p","7. To increase the flavor of this delicacy add lemon juice squeezed directly from freshly cut lemon pieces."]],"date":"31 October 2020","tags":["galicia","recipes","main dishes","seafood","fish","spanish","cooking","appetizers"]},{"title":"M&Ms and Salted Caramel Cake Recipe","blocks":[["h4","Ingredients :"],["ul","4 Cups Gluten-free Flour"],["ul","2 tsp Baking Powder"],["ul","1/2 tsp Salt"],["ul","4 Cups Granulated Sugar"],["ul","6 Eggs"],["ul","2 tsp Vanilla Scent"],["ul","4 tbsp Vegetable Oil"],["ul","250g M&Ms (180g for shredding and 70g for decorating)"],["ul","400g chocolate bar (53%)"],["ul","400mL Cream"],["ul","100mL Salted Caramel"],["h4","Recipe:"],["p","1. In a Blender add the eggs and sugar and mix everything well."],["p","2. Then add the milk, vanilla flavor, and vegetable oil until a homogeneous mixture is obtained."],["p","3. Add the flour, salt, and baking powder."],["p","4. After well mixed, divide the mixture into two bowls, and in one of them add the 180g of M&Ms, previously shredded."],["p","5. Grease two forms with butter and bake the two cakes for 35 minutes at a temperature of 180ºC | 356ºF."],["p","6. After removing the cakes from the oven, let them cool and cut the plain cake in half (the one without the M&Ms flour you made)."],["p","7. Time to prepare the filling and topping."],["p","8. Break the chocolate into small pieces and place them in a bowl."],["p","9. Bring the cream to boil and as soon as it starts to boil pour over the chocolate, stirring well until the chocolate is completely melted."],["p","10. Divide the melted chocolate into two bowls and take one to the refrigerator."],["p","11. Place half of the plain cake on a plate, brush with the melted chocolate, place the cake with the M&Ms flour, brush again with melted chocolate and then add the last half of the plain cake."],["p","12. After the chocolate that went to the refrigerator is cold, with the help of a mixer, beat the chocolate and add the salted caramel until you get a mousse."],["p","13. This mousse will be the topping for the whole cake!"],["p","14. In the end, just decorate with M&Ms as you like!"]],"date":"24 December 2020","tags":["desserts","cooking","cake","chocolate","recipes","gluten free"]},{"title":"M&Ms Cookies Recipe","blocks":[["p","Tonight we decided to make two trays of cookies for 2 friends of ours, that are dealing with some isolation time! 🤣 So it's time to feed the needy! Just joking, we love them and we love cooking cookies, so it's a win-win situation! 😍"],["p","We search for different recipes and different backgrounds, and now we present ours!"],["p","Hope you enjoy it!"],["h4","Ingredients :"],["ul","140gr Unsalted Butter"],["ul","120gr Granulated Sugar"],["ul","60gr Light Brown Sugar"],["ul","60gr Dark Brown Sugar"],["ul","1 Egg"],["ul","250gr Wheat Flour"],["ul","1/2 tsp Vanilla essence"],["ul","1 tsp Baking Powder"],["ul","½ tsp Baking Soda"],["ul","160gr Peanut M&Ms (more to decorate - optional)"],["h4","Recipe:"],["p","1. Put 160gr of M&Ms in a plastic bag and with the help of a hammer break them off roughly."],["p","2. In a mixer add softened butter with the sugars (the three types), mix them until a homogeneous mixture is created. Be careful to break all the brown sugar lumps during this process."],["p","3. Add the egg and the vanilla essence."],["p","4. Add the wheat flour, baking powder, baking soda and involve a few seconds until combined. Finally, add the crushed M&Ms and stir."],["p","5. After everything is roughly involved, it is time to create the cookie balls."],["p","6. Place a sheet of buttered parchment paper on a baking tray and place portions of the cookie dough."],["p","7. Place 3 whole M&Ms in each serving to decorate."],["p","8. Place in the oven, previously heated to 180ºC | 356ºF, for 12 minutes or until golden brown."],["p","9. These cookies will be super chewy thanks to the molasses in the dark brown sugar."],["p","10. Super easy to make and super delicious! Aren't they precious? 😍"]],"date":"17 December 2020","tags":["desserts","cooking","breakfast","holidays","chocolate","american","recipes","cookies"]},{"title":"MCDonald's McFlurry M&Ms Recipe","blocks":[["p","It tastes even better because we made it ourselves!"],["h4","Ingredients :"],["ul","250mL | 500g Milk/Cream Ice Cream"],["ul","½ Cup M&Ms"],["ul","1 tbsp Milk"],["ul","½ tsp Vanilla Flavor"],["h4","Recipe:"],["p","1. Let's crash the M&Ms roughly, save a few for the topping."],["p","2. Put the Ice Cream in a bowl or mug and add the vanilla flavor and the milk."],["p","3. Mix everything with the help of a mixer, this way the icecream will get soft and nice."],["p","4. Add the crushed M&Ms and mix again!"],["p","5. Isn't this the best copycat of the McFlurry? You can try with different toppings!"]],"date":"11 February 2021","tags":["american","desserts","cooking","ice cream","chocolate","recipes"]},{"title":"Meat and Potato Pie without Crust Recipe","blocks":[["p","This one is meat, but it could be tuna, hake, cod, spinach, etc., with a good puree, any pie is the salvation for a last minute dinner!"],["p","So yummy! 😍"],["h4","Ingredients :"],["ul","2Kg Potatoes"],["ul","800g Minced Meat"],["ul","300g Fresh Mushrooms"],["ul","250mL White Wine (1 Cup)"],["ul","1 tbsp Butter"],["ul","2 Bay Leaves"],["ul","3 Egg Yolks"],["ul","1 Onion"],["ul","50mL Milk (¼ Cup)"],["ul","4 Tomatoes"],["ul","Salt"],["ul","Black Pepper"],["ul","Olive Oil"],["h4","Recipe:"],["p","1. In a pan place the cutted potatoes to be cooked with salt."],["p","2. After boiling the potatoes, remove the water, and add butter and milk. To obtain a homogeneous mass, mix everything with a mixer and to give a yellowish color add one egg yolk."],["p","3. With the puree ready, let's sauté the meat."],["p","4. In a pan, place the chopped onion to sauté with olive oil, salt, bay leaf, black pepper and the fresh tomatoes."],["p","5. Then place the sliced mushrooms and then the minced meat with the white wine and let it cook for 20 minutes over medium heat."],["p","6. Place the puree on a platter, then the meat and then again puree. Brush everything with two egg yolks and take it to the oven for 10 minutes at 180 Celsius degrees | 356 Fahrenheit degrees."]],"date":"22 September 2020","tags":["recipes","cooking","portuguese","main dishes","meat"]},{"title":"Molotof - Portuguese Egg Whites Pudding Recipe","blocks":[["p","Some people get scared when they realize that they will be handling caramel, but once you get it right, you'll see how easy that is! And how versatile it can be when making desserts!"],["p","This recipe is super sweet and it feels like cotton candy in your mouth!"],["p","Try this with us! 🥰"],["h4","Ingredients :"],["ul","10 Egg Whites"],["ul","300g Granulated Sugar"],["h4","Ingredients - Liquid Caramel :"],["ul","100mL Cold Water"],["ul","300g Granulated Sugar"],["ul","100mL Hot Water (boiling hot water)"],["h4","Recipe:"],["p","1. Let's start by making liquid caramel."],["p","2. In a saucepan, add sugar and cold water and bring to a boil."],["p","3. Put 100mL of water to a boil and as soon as the sugar turns a caramel color, add the boiling water, stirring constantly."],["p","4. Leave on the stove over high heat for another 1 minute, and tour liquid caramel is ready!"],["p","5. Pour the liquid caramel into a cake pan, being careful not to burn yourself! The caramel will be very, very hot! Watch out!"],["p","6. With the help of an electric mixer, in a bowl, add the egg whites and start to whisk, as soon as they start to get firm, gradually, add the sugar."],["p","7. At the end pour everything into the cake pan and place a pan or a tray underneath with hot water. To bake it in a water bath."],["p","8. Bake at 180ºC | 356ºF for 10min. Then turn off the oven and leave it there for another 30 minutes."],["p","9. Unmold while it is warm to make it easier. Once the caramel solidifies it is almost an impossible task to do!"],["tip","Tip1: For each egg white add 30g of sugar (we made it with 10 whites, so we used 300g of sugar)."],["tip","Tip2: The preparation goes to the oven for the number of egg whites it takes. (Ours was 10 minutes in the oven because we use 10 egg whites)"]],"date":"2 January 2021","tags":["recipes","christmas","gluten free","portuguese","desserts","cooking","holidays"]},{"title":"Nuts and Apricot Cookies","blocks":[["h4","Ingredients :"],["ul","2 Cups All-Purpose Flour (220g)"],["ul","½ tsp Baking Soda"],["ul","¼ tsp Sea Salt"],["ul","½ Cup Melted Butter (125g)"],["ul","½ Cup Granulated Sugar (100g)"],["ul","½ Cup Dark Brown Sugar (100g)"],["ul","1 Large Egg"],["ul","1 tsp Vanilla Extract"],["ul","½ Cup Walnuts (60g)"],["ul","½ Cup Skinless Almonds (60g)"],["ul","½ Cup Appricot (70g)"],["h4","Recipe:"],["p","1. Preheat the oven to 180ºC | 360ºF."],["p","2. In a stand mixer add the two sugars and the melted butter and mix everything until you get a homogeneous dough."],["p","3. Then add the egg, slightly beaten, and the vanilla extract."],["p","4. Add the flour and baking soda and beat for 4 minutes."],["p","5. Meanwhile, chop the walnuts, almonds, and apricots roughly and finally add to the mixture."],["p","6. Add salt and beat again for another 1 min."],["p","7. In a tray with parchment paper, place portions of the dough well-spaced and bake in the oven for 15-20min."],["p","8. Let it cool down a bit and let’s attack these cookies!"]],"date":"16 March 2021","tags":["breakfast","cooking","desserts","cookies","recipes"]},{"title":"Passion Fruit Mousse Recipe","blocks":[["h4","Ingredients :"],["ul","400mL Cream (35%)"],["ul","300mL Condensed Milk"],["ul","565g Passion Fruit Pulp (with seeds)"],["ul","3 Passion Fruits (topping)"],["ul","5 Sheets of Gelatin"],["h4","Recipe:"],["p","1. Whisk the passion fruit pulp (juice and seeds) with the condensed milk for a few minutes."],["p","2. Pour the whipping cream into the mixing bowl and whisk at high speed until stiff peaks form."],["p","3. Add the passion fruit mixture to the cream and stir until well mixed."],["p","4. Hydrate the gelatin sheets in very cold water for 5 minutes. Drain excess water and microwave for about 10 seconds, until dissolved. Add to the previous mixture."],["p","5. Pour the mixture into a large ball or small glasses and refrigerate overnight or for at least 4 hours."],["p","6. Serve garnished with fresh passion fruit pulp."]],"date":"31 December 2020","tags":["cooking","desserts","gluten free","brazilian","recipes"]},{"title":"Pastel de Nata Pie Recipe","blocks":[["p","Milk and Eggs!"],["p","But for you, I will make a big one! 😊 You can also find this recipe under the name of Portuguese Custard Tart!"],["p","Under the image, you'll find the complete recipe and a funny video we made during the quarantine in Portugal! This Pie is super super easy to make, and I can tell you, it's so delicious, I love to cut a slice and sprinkle it with cinnamon powder! Give it a try! 😉"],["h4","Ingredients:"],["ul","500mL Milk"],["ul","50g Cornstarch Flour"],["ul","250g Granulated Sugar"],["ul","6 Egg Yolks"],["ul","1 Shortcrust Pastry"],["h4","Recipe:"],["p","1. Turn on the oven at 180 Celsius degrees | 356 Fahrenheit degrees."],["p","2. Pour the milk in a saucepan and when it becomes warm add the cornstarch flour so that it doesn't create lumps."],["p","3. Turn off the stove, let it cool a little, and add the sugar and 6 egg yolks. In this way, the egg yolks won't cook with heat."],["p","4. Stir well and return to the stove, stirring constantly until it thickens."],["p","5. Roll out the shortcrust pastry in a pie pan and pour the filling into the shortcrust pastry"],["p","6. Bake until dark spots are obtained, about 25 to 30 minutes."]],"date":"26 August 2020","tags":["portuguese","desserts","cooking","recipes"]},{"title":"Pavlova with Fresh Berries Recipe","blocks":[["h4","Ingredients - Pavlova :"],["ul","6 Egg Whites"],["ul","300g Granulated Sugar"],["ul","2 tbsp White Wine Vinegar"],["ul","2 tbsp Cornstarch"],["ul","1 tsp Vanilla"],["ul","500g Fresh Berries (strawberries, blackberries, blueberries, raspberry, and redcurrant)"],["h4","Ingredients - Whipped Cream :"],["ul","400mL Cream (to whip)"],["ul","3 tbsp Granulated Sugar"],["h4","Recipe:"],["p","1. Preheat oven to 150ºC | 300ºF."],["p","2. Using a pencil, mark out a circumference on parchment paper on an oven tray."],["p","3. In a large bowl, beat the egg whites for a few seconds. Gradually add the sugar, 1 tablespoon at a time, with the mixer on. Beat until thick and glossy, until the sugar is completely dissolved (it will take about 10-15min)."],["p","4. Whisk the white wine vinegar, with the cornflour and the vanilla extract."],["p","5. Add this mixture to the meringue, that you previously made."],["p","6. On the circumference that you made on the parchment paper, spread the meringue inside the circle, creating a crater by making the sides a little higher than the middle."],["p","7. Put the pavlova in the oven and reduce the temperature to 130ºC | 266ºF. Bake for 1 hour, then turn off the heat and let the Pavlova cool completely inside the oven (for at least 6 hours)."],["p","8. A few minutes before you serve, pour the cream into the mixing bowl, gradually add the sugar, and whisk at high speed until stiff peaks form."],["p","9. Add the whipped cream to the crater of the merengue"],["p","10. Put the fresh berries on top of the whipped cream and serve."]],"date":"5 January 2021","tags":["recipes","gluten free","desserts","cooking"]},{"title":"Pavlova with Sweet Egg Cream Recipe","blocks":[["p","This was heaven on earth! Sweet Egg Cream is a very traditional Portuguese delicacy! So we thought about combining it with this fresh Pavlova!"],["p","We made this recipe at Christmas, and it was the \"best-seller\" of the Christmas Desserts! 🤣 🤣 🤣"],["h4","Ingredients :"],["ul","6 Egg Whites"],["ul","300g Granulated Sugar"],["ul","2 tbsp White Wine Vinegar"],["ul","2 tbsp Cornstarch"],["ul","1 tsp Vanilla"],["h4","Ingredients - Whipped Cream :"],["ul","400mL cream (to whip)"],["ul","3 tbsp Sugar"],["h4","Ingredients - Sweet Egg Cream :"],["ul","6 Egg Yolks"],["ul","6 tbsp Sugar"],["ul","6 tbsp Water"],["h4","Recipe:"],["p","1. Preheat oven to 150ºC | 300ºF."],["p","2. Using a pencil, mark out a circumference on parchment paper on an oven tray."],["p","3. In a large bowl, beat the egg whites for a few seconds. Gradually add the sugar, 1 tablespoon at a time, with the mixer on. Beat until thick and glossy, until the sugar is completely dissolved (it will take about 10-15min)."],["p","4. Whisk the white wine vinegar, with the cornflour and the vanilla extract."],["p","5. Add this mixture to the meringue, that you previously made."],["p","6. On the circumference that you made on the parchment paper, spread the meringue inside the circle, creating a crater by making the sides a little higher than the middle."],["p","7. Put the pavlova in the oven and reduce the temperature to 130ºC | 266ºF. Bake for 1 hour, then turn off the heat and let the Pavlova cool completely inside the oven (for at least 6 hours)."],["h4","Topping - Sweet Egg Cream:"],["p","1. Combine the sugar with cold water in a saucepan set over medium-high heat. Cook, without stirring, until the sugar has turned 108ºC."],["p","2. Temper the eggs, by slowly adding a few tbsp of the sugar sauce to the egg yolks and mix until smooth."],["p","3. Transfer again to the saucepan over medium heat, until the eggs thicken."],["p","4. Remove from heat, let it cool, and reserve."],["h4","Topping - Whipped Cream:"],["p","1. A few minutes before you serve, pour the whipping cream into the mixing bowl, gradually add the sugar, and whisk at high speed until stiff peaks form."],["p","2. Add the whipped cream to the crater of the merengue"],["p","3. Put the sweet egg cream on top of the whipped cream."]],"date":"23 January 2021","tags":["cooking","desserts","gluten free","recipes"]},{"title":"Perfect Lemonade Recipe","blocks":[["p","If life gives you Lemons, make Lemonade 😍 🍋"],["h4","Ingredients :"],["ul","Ice"],["ul","200mL Lemon Juice (freshly squeezed)"],["ul","400mL Water"],["ul","3 Mint Leaves"],["ul","4 Lemon Slices"],["ul","1 tbsp Yellow Sugar"],["h4","Recipe:"],["p","1. First, let's squeeze the juice out of some lemons until you get 200mL of lemon juice."],["p","2. In a jar we add the lemon juice, freshly squeezed, with 400mL of water."],["p","3. We mix everything and add the yellow sugar and dissolve."],["p","4. Add the lemon slices, mint leaves, and ice!"],["p","5. It is ready to serve, to taste, and to refresh!"]],"date":"23 February 2021","tags":["recipes","drinks","portuguese","cooking"]},{"title":"Pesto Puff Pastry Recipe","blocks":[["p","We are fanatics about Pesto and everything we can do with it! Our Pesto is always homemade and we always like to innovate in flavor and always add something new! As we have to take advantage of all the basil leaves in our mini garden, we always have lots of Pesto here at home!"],["p","This recipe is super simple and is so good to eat, it is the perfect entry to a good Italian dinner with friends, and everyone will be amazed by its simplicity and flavor."],["h4","Ingredients:"],["ul","1 Puff Pastry (230 g)"],["ul","200mL Pesto Sauce - Recipe Here"],["ul","3 Egg Yolks"],["h4","Recipe:"],["p","1. Turn on the oven at 180 Celsius degrees | 356 Fahrenheit degrees."],["p","2. Roll out the puff pastry on a bench and cut the sides into strips."],["p","3. Fill the central rectangle with a lot of pesto sauce and start to cover the pesto with the strips, previously cut, in the shape of a braid."],["p","4. After completely closed, whisk two egg yolks and brush the puff pastry with it."],["p","5. Bake until golden/toasted, about 15 minutes in the oven."]],"date":"28 August 2020","tags":["appetizers","italian","cooking","recipes"]},{"title":"Portuguese Bifanas (Pork Steaks Sandwich) Recipe","blocks":[["tip","29 September 2020"],["p","In Portugal we love all kinds of bread, so we have to use it a lot in our recipes! This recipe is super traditional and you can give it a twist with the melted cheese! Try this at home and share your thoughts with us! ❤️"],["h4","Ingredients :"],["ul","1Kg Pork Steaks to Stew"],["ul","1 Onion"],["ul","2 Bay Leaves"],["ul","150mL White Wine"],["ul","4 tbsp Tomato Pulp"],["ul","Olive oil"],["ul","Salt"],["ul","Black Pepper"],["ul","Chili"],["h4","Recipe:"],["p","1. If the meat comes in very large pieces, cut at home into smaller, thinner strips."],["p","2. In a saucepan, place the sliced onion to sauté with the two bay leaves, olive oil, salt, black pepper, and chili."],["p","3. After the onion is browned put the white wine to boil and then add the meat and the spoons of tomato pulp."],["p","4. Let it boil for 15 minutes on high heat and after that time, leave it for another 10 minutes on low heat to thicken the sauce."],["p","5. You can eat on bread or with other accompaniment that you think is appropriate."]]},{"title":"Portuguese Biscuit Ice Cream Recipe","blocks":[["p","The traditional Portuguese Biscuit Ice Cream is super easy to make and even easier to eat! It will vanish from your freezer and the kids will love it! You have to try it!"],["h4","Ingredients:"],["ul","4 Egg Whites"],["ul","400mL Cream"],["ul","200mL Condensed Milk"],["ul","200g Portuguese Biscuit (or any kind you like)"],["ul","50g Portuguese Biscuit to Grate"],["h4","Recipe:"],["p","1. After separating the egg whites from the egg yolks, whisk the egg whites."],["p","2. Then, whip the cream until smooth, like whipped cream.*"],["p","3. Add the condensed milk and mix."],["p","4. Grate 200gr of Portuguese biscuits in a shredder or kitchen processor and add it to the previous preparation."],["p","5. Finally, add the egg whites, slowly wrapping to avoid losing the lightness."],["p","6. Lie down on a platter and sprinkle on top with more grated crackers (50gr of Portuguese biscuit)."],["p","7. Store in the freezer overnight."],["p","* Tip: In order for the cream to develop well, it must be as fresh as possible. To do this, place them 1 hour in the freezer before whipping them."]],"date":"21 August 2020","tags":["ice cream","cooking","portuguese","desserts","cookies","recipes"]},{"title":"Portuguese Chicken Soup Recipe","blocks":[["p","For those cold, rainy days, we love to make soup, in the summer not so much, but when the winter comes we love to feel cozy! Nothing better than a beautiful bowl of chicken soup, this recipe is very simple but so yummy!"],["p","Try the recipe and tell us your thoughts!"],["h4","Ingredients :"],["ul","1 Chicken with Giblets"],["ul","250g Pasta Risone"],["ul","Olive oil"],["ul","Salt"],["h4","Recipe:"],["p","1. In the first stage, it is necessary to break the chicken into pieces and remove possible eggs inside the chicken and the giblets."],["p","2. In a pan, place the chicken pieces in water with salt and oil and cook."],["p","3. After cooking the chicken, remove it from the pan and shred completely. Then pour back into the pan, together with the egg yolks previously removed from the chicken."],["p","4. As soon as the water comes to a boil, add the pasta and wait for it to cook."],["p","5. Before serving, check if you need salt."]],"date":"1 October 2020","tags":["recipes","soup","main dishes","portuguese","appetizers","cooking","meat"]},{"title":"Portuguese Chorizo and Mozzarella Stuffed Bread Recipe","blocks":[["p","If you love cheese as much as we do, this recipe is so right for you! You can eat this at any time, but we prefer it when is still hot, this way the cheese will melt in your mouth, and the chorizo works perfectly here!"],["p","If you love species as much as we do, you can put some chili or add some spicy sausage as well."],["p","Be delighted with this traditional recipe!"],["p","You can do a big one or small portions as we did! This recipe will make 6 portions."],["h4","Ingredients :"],["ul","2 Chorizo (100g)"],["ul","2 Spicy Sausages (50g)"],["ul","150g Mozzarella Cheese"],["ul","250g Wheat Flour"],["ul","5g Bakers Yeast (or 15g fresh bakers yeast)"],["ul","100ml Warm Water (not hot)"],["ul","1 tbsp Vegetable Oil"],["ul","½ tsp Coarse Salt"],["ul","½ tsp Granulated Sugar"],["ul","Flour for Kneading"],["h4","Recipe:"],["p","1. Dissolve the yeast in the warm water, allowing to stand for 5min. Then add the vegetable oil."],["p","2. On a bench or in a bowl, place the flour and add the water with the yeast and oil, slowly."],["p","3. Knead everything very well for 2min."],["p","4. Add salt and sugar and knead for another 5min."],["p","5. Place the dough in a bowl and cover with a cloth, allowing the dough to rise for 1h in a warm place, about 30ºC | 86ºF."],["p","6. Knead the bread again and with the help of a rolling pin, roll out the dough to fill the bread."],["p","7. Cut portions of the dough and fill with chorizo, spicy sausage, and cheese."],["p","8. To make it easier, you can wet the ends of the dough with water to better close the stuffed bread."],["p","9. Place everything on a baking tray and let it rise for another 1h in a warm place, around 30ºC | 86ºF."],["p","10. Bake for 20 minutes at about 180ºC | 356ºF."]],"date":"30 October 2020","tags":["meat","cooking","appetizers","portuguese","main dishes","recipes","bread"]},{"title":"Portuguese Christmas Doughnuts - Sonhos de Natal - Recipe","blocks":[["p","Portuguese Christmas Doughnuts can be eaten plain, with sugar and cinnamon, or with syrup! At Christmas, it will warm any soul!"],["p","Try this recipe to give an even bright color to your Christmas table!"],["p","Have a Warm and Beautiful Christmas!"],["h4","Ingredients :"],["ul","250mL Water"],["ul","7 tbsp Olive Oil"],["ul","150g Flour"],["ul","4 eggs"],["ul","Lemon Zest"],["ul","1 tsp Salt"],["ul","Oil to Fry"],["h4","Ingredients - Syrup :"],["ul","200mL Water"],["ul","200g Sugar"],["ul","1 Cinnamon Stick"],["ul","Lemon zest"],["h4","Recipe - Syrup:"],["p","1. Put the water to boil in a pot."],["p","2. Then add the sugar, cinnamon stick, and lemon zest."],["p","3. Boil for 3 minutes until syrup is created."],["p","4. Then just pour over your Christmas Doughnuts or leave them aside to dip them."],["h4","Recipe:"],["p","1. Put water in a saucepan and bring to the heat, as soon as it gets warm, pour the sifted flour and stir well, always on low heat."],["p","2. Add the oil, beaten eggs, lemon zest, and salt."],["p","3. Continue to stir until a more consistent dough forms."],["p","4. Put the oil to heat in a frying pan and with your hands make small balls with the dough and fry them."],["p","5. When removing them from the oil you can use sugar and cinnamon or syrup."]],"date":"24 October 2020","tags":["recipes","christmas","desserts","portuguese","cooking"]},{"title":"Portuguese Codfish and Fries Recipe","blocks":[["p","In my hometown, Richie, this is a very known dish, this was the Sunday special in every home! And you knew that when this was served that that was a very special day! This brings very good memories!"],["p","Try to create your good memories while cooking with friends, family, or lover! 🥰"],["h4","Ingredients :"],["ul","4 Codfish Steaks"],["ul","1Kg Potatoes"],["ul","8 Onions"],["ul","2 Cups Flour"],["ul","4 Tomatoes"],["ul","Oil to Fry"],["ul","Chili"],["ul","Black Pepper"],["ul","Salt"],["h4","Recipe:"],["p","1. Pass the cod slices through the flour and fry them in very hot oil."],["p","2. Next, slice the potatoes and fry them until they are golden brown."],["p","3. In a pan, place the 8 onions, sliced thinly, with 4 tomatoes, olive oil, chili, black pepper, and salt."],["p","4. After the onions have been thoroughly refined, it's time to assemble the dish."],["p","5. Place a little sauce on a platter created by the onion, then put a layer of fried potatoes and then put the cod slices covered with the refined onions."],["p","6. Place in the oven for 10min at 180 Celsius degrees | 356 Fahrenheit degrees."]],"date":"6 October 2020","tags":["fish","recipes","cooking","portuguese","main dishes"]},{"title":"Portuguese Crème Brûlée Recipe","blocks":[["p","To make cream milk there are a thousand and one recipes, but the best is my mothers, it's simple, it's easy and it's very, very good! With sugar, cinnamon, or caramelized sugar, it's divine, so good!"],["p","Try to do this recipe and leave some feedback or even better a picture!"],["h4","Ingredients:"],["ul","750mL Milk"],["ul","100g Granulated Sugar"],["ul","50g Cornstarch"],["ul","3 Egg Yolk"],["ul","1tsp Vanilla Essence (optional; you can use 1 lemon zest)"],["h4","Recipe:"],["p","1. Add the egg yolks and the cornstarch and dissolve it very well in a few tbsp of milk, until there are no lumps."],["p","2. In a saucepan, pour the mixture with the remaining milk and let it warm up a little bit."],["p","3. Add sugar and vanilla essence. If you prefer, you can add one slice of lemon zest, instead of the vanilla."],["p","4. Stir well until it starts to thicken."],["p","5. Remove from heat and serve individually or on a large platter. And don't forget to remove the slice of lemon zest! 🙂"],["p","6. You can sprinkle it with sugar or cinnamon."]],"date":"2 August 2020","tags":["cooking","portuguese","desserts","christmas","recipes"]},{"title":"Portuguese Duck Rice Recipe","blocks":[["p","In the middle of the table, you'll create a splash of color with this platter! Beautiful golden rice, almost toasted and crunchy, to make your friends love duck!"],["h4","Ingredients :"],["ul","1Kg Rice"],["ul","1 Duck with Giblets"],["ul","1 Carrot"],["ul","1 Onion"],["ul","2 Garlic Cloves"],["ul","1 Pepperoni Sausage"],["ul","1 Piece of Bacon"],["ul","1 Bay Leaf"],["ul","2 Egg Yolks"],["ul","Salt"],["ul","Black Pepper"],["ul","Olive Oil"],["h4","Recipe:"],["p","1. Fill a pan with water and put the duck to cook with a carrot, an onion, two cloves of garlic, a pepperoni sausage, bacon, a bay leaf, salt, and olive oil. Until the duck is cooked."],["p","2. Once cooked, remove the duck and grind all the cooking until making a broth with a magic wand, previously removing the bay leaf."],["p","3. After cooling, you have to shred the duck and fry the giblets by breaking them into small pieces."],["p","4. Place the rice to be cooked in the duck broth and check that the seasoning is correct, if necessary, add salt."],["p","5. With the cooked rice, it is necessary to proceed to the assembly of the platter. Create a base of rice, stuff it with the shredded duck and the fried giblets, and add rice again."],["p","6. Before taking it to the oven, brush the rice with the egg yolks and cover with bacon and pepperoni sausage."],["p","7. Place in the oven at 180 Celsius degrees | 356 Fahrenheit degrees until it turns a golden color."],["p","8. Isn't it the most beautiful dish you've ever seen?"]],"date":"26 September 2020","tags":["recipes","cooking","portuguese","main dishes","meat"]},{"title":"Portuguese Fried Codfish with Purée Recipe","blocks":[["p","Codfish is very traditional in Portugal, so we do a lot of dishes with it! If you ever come to Portugal you can try it on almost every side of the country, in numerous ways!"],["h4","Ingredients :"],["ul","4 Codfish Slices"],["ul","4 Onions"],["ul","1Kg Potatoes"],["ul","1 Green Pepper"],["ul","1 Red Pepper"],["ul","4 Black Olives"],["ul","2 Bay Leaves"],["ul","2 Cups Flour"],["ul","1 Egg Yolk"],["ul","1 tbsp Butter"],["ul","Tomato pulp"],["ul","Piri-piri"],["ul","Oil to Fry"],["ul","Olive Oil"],["ul","Salt"],["h4","Recipe:"],["p","1. In a pan place the potatoes to be cooked with salt."],["p","2. After cooking, remove the water, add the butter, milk, and egg yolk, and beat everything with an electric mixer to form a purée."],["p","3. In a pan, place the four sliced onions to be sautéed with half the green and half the red pepper, diced, adding salt, olive oil, p, piri-piri, bay leaf, and tomato pulp."],["p","4. Pass the four pieces of cod for flour and fry in very hot oil."],["p","5. Next we are going to plate. On a platter, distribute the onion on the first base, followed by the cod slices and finally the puree."],["p","6. To mark the location of the slices, you can add slices of pepper and olives to decorate."],["p","7. Take to the oven for 15min at 180 Celsius degrees | 356 Fahrenheit degrees."]],"date":"15 October 2020","tags":["main dishes","portuguese","cooking","recipes","fish"]},{"title":"Portuguese Kale Soup Recipe","blocks":[["p","It is one of those soups that cannot be missing from any family's cookbook, for sure!"],["p","Whether for serving at family gatherings or just for a romantic dinner for two people, success is guaranteed and very easy to do."],["p","Here is the recipe, just for you and your family and friends!"],["h3","Ingredients:"],["ul","2L Water"],["ul","700g Potatoes"],["ul","350g Finely sliced Portuguese kale"],["ul","1 medium onion"],["ul","2dL Olive oil"],["ul","1 Chorizo"],["ul","Salt"],["h3","Recipe:"],["p","1. In a pan with 2L of boiling water, place the peeled potatoes, the onion, and the olive oil."],["p","2. Season with salt to taste."],["p","3. Let it cook for 40 to 50 minutes until the potatoes are cooked when crossed with a fork. Then wipe with a hand blender until you get a creamy consistency."],["p","4. Add the sliced Portuguese Kale and cook it for about 10 minutes."],["p","5. Finally, cut the chorizo into slices and add it to the soup before serving."]],"date":"31 July 2020","tags":["main dishes","portuguese","cooking","recipes","soup"]},{"title":"Portuguese Meat or Ham and Cheese Rissoles Recipe","blocks":[["h4","Ingredients - Dough :"],["p","1Kg Wheat Flour"],["p","1L Water"],["p","1 Pinch of Salt"],["p","1 Lemon Peel"],["p","150g Butter"],["h4","Recipe - Dough:"],["p","1. Put the water, salt, lemon peel, and butter in a large saucepan until boiling."],["p","2. After boiling the water, put the flour in one go and stir until it forms a dough that comes out of the pan and immediately disconnects from the stove."],["p","3. Form a ball with the dough and let it cool on a stone or fried bench and then, using a rolling pin, form small circles for the patties."],["h4","Ingredients - Meat Rissoles :"],["ul","700g Beef and Chicken"],["ul","1 Chouriço"],["ul","1 Onion"],["ul","50ml Olive Oil"],["ul","4 tbsp Tomato Pulp"],["ul","Parsley"],["ul","Salt"],["ul","Piri-piri"],["ul","Eggs"],["ul","Breadcrumbs"],["h4","Recipe - Meat Rissoles:"],["p","1. In a pan, stew the beef and chicken with the chorizo, onion, and other spices."],["p","2. After it is well cooked, put the meat in the chopper and grind everything and then fill the patties."],["p","3. Pass the risotto over egg and breadcrumbs, then just fry or freeze."],["h4","Ingredients - Ham and Cheese Rissoles :"],["ul","200g Cheese"],["ul","100g Ham"],["ul","Eggs"],["ul","Breadcrumbs"],["h4","Recipe - Ham and Cheese Rissoles:"],["p","1. Place the cheese and ham in a chopper and grind well to create a paste to fill the patties."],["p","2. Pass the risotto over egg and breadcrumbs, then just fry or freeze."],["h4","Recipe:"],["p","1. Place or the entire family around the table!"],["p","2. Distribute everyone's job!"],["p","3. Tell them not to complain that much!"],["p","4. In 1hour everything will be ready 😂 😂 😂."],["p","5. In the end, eat a few together and create memories! The others you can freeze!"],["p","6. Don't forget to have fun!"]],"date":"17 October 2020","tags":["recipes","meat","main dishes","portuguese","appetizers","cooking"]},{"title":"Portuguese Pumpkin Christmas Fritters Recipe","blocks":[["p","At our place, we like to feel and smell the Christmas Spirit! So the countdown starts now! We love the lights, setting up the Christmas tree, decorating the house! It's a magic time of the year, and we have to enjoy every moment of it!"],["p","So, here it goes another recipe that feels our spirit and our bellies ahahah 🤪 We hope you like as much as we do!"],["h4","Ingredients :"],["ul","2kg Pumpkin"],["ul","5 tbsp Sugar"],["ul","60g Wheat Flour"],["ul","5 Gems"],["ul","1 Shot of Port Wine"],["ul","1 Lemon Zest"],["ul","Cinnamon"],["ul","Sugar"],["ul","Oil to Fry"],["h4","Recipe:"],["p","1. Cook the pumpkin in water seasoned with a little salt."],["p","2. After the pumpkin is cooked, pass everything through a strainer and place the mixture on a cloth, forming a ball, hanging for a day or two, to remove the excess water."],["p","3. Add the flour, egg yolks, sugar, lemon zest, port wine, and a little cinnamon to the puree created above with a wooden spoon."],["p","4. After mixing the dough well, let it stand for 2 hours."],["p","5. Put oil to be heated to fry the dough, after reaching the ideal temperature, start by placing little amounts of the dough in the oil for frying."],["p","6. Let it get a golden color, remove from the oil, and then pass the cookies or sprinkle with sugar and cinnamon."]],"date":"1 November 2020","tags":["portuguese","desserts","cooking","recipes","christmas"]},{"title":"Portuguese Salt Codfish Fritters - Pataniscas de Bacalhau Recipe","blocks":[["p","When you don't have a lot of codfish, you can shred it and make some beautiful golden salt codfish fritters, or as we say in Portugal Pataniscas!"],["p","You can eat this delicacy as an appetizer or a main dish, with salad or tomato rice."],["h4","Ingredients :"],["ul","400g Shredded Codfish"],["ul","3 Eggs"],["ul","2 Cups Flour"],["ul","½ Cup Water"],["ul","Oil to Fry"],["ul","Chopped Parsley"],["ul","Salt"],["h4","Recipe:"],["p","1. Shred the 400g of cod already soaked in water overnight, having changed the water a few times."],["p","2. Add the 3 eggs to the shredded cod and mix until the mixture is combined."],["p","3. Add the chopped parsley and a pinch of salt to the mixture of cod and eggs."],["p","4. Then put a cup of flour and start creating a paste, add the second cup of flour, and seeing that the difficulty of stirring increases gradually add the water, creating a dough, neither too liquid nor too solid."],["p","5. Taste the mixture still raw and add salt, if needed."],["p","6. With the oil very hot, just create small portions with the help of two spoons and fry until they are golden brown."]],"date":"9 October 2020","tags":["fish","recipes","main dishes","appetizers","cooking","portuguese"]},{"title":"Portuguese Sausage Puffs with Honey-Mustard Sauce Recipe","blocks":[["h4","Ingredients :"],["ul","2 Sheets of Filo Pastry"],["ul","1 Portuguese Sausage (Alheira)"],["ul","Olive oil"],["ul","1 tbsp Dijon Mustard"],["ul","3 tbsp Honey"],["h4","Recipe:"],["p","1. Let's start with the sauce, super simple. Add the dijon mustard with the honey and mix well, taste and balance the flavor to your own taste."],["p","2. Place a sheet of filo pastry on a workbench and brush with olive oil and then place the second sheet of filo pastry on top."],["p","3. Cut the film that forms the sausage and create a tube to put in the dough."],["p","4. Roll the dough and at the end brush with olive oil to glue."],["p","5. Cut into slices and bake at 180ºC | 356ºF for +- 15min."],["p","6. Serve with Honey-Mustard sauce and enjoy this delicacy!"]],"date":"9 February 2021","tags":["recipes","appetizers","cooking","portuguese","meat"]},{"title":"Portuguese Seafood Rice Recipe","blocks":[["p","In a lovely Saturday night dinner, the best is to stay at home and make a delicious Portuguese Seafood Rice dish, this will warm up your soul!"],["h4","Ingredients:"],["ul","300g Shrimp"],["ul","300g Mussels"],["ul","300g Clams"],["ul","200g Rice"],["ul","0.5dL Water"],["ul","1 Onion"],["ul","6 Kani-kama"],["ul","2 tbsp Seafood Soup Powder"],["ul","Olive oil"],["ul","Chopped parsley"],["ul","Chili"],["ul","Salt"],["h4","Recipe:"],["p","1. In a pan place the whole seafood accompanied by a chopped onion, with a drizzle of olive oil, salt, parsley, and chili."],["p","2. After well-seasoned add the two tablespoons of Seafood Soup Powder and stir well to create a cream."],["p","3. Then, add water and wait 10 minutes."],["p","4. With the water boiling, add the rice and cook for 15 minutes, to be cooked perfectly."],["p","5. Pour the sliced Kani-kama and serve on a platter. I love to put lots of fresh parsley."]],"date":"25 August 2020","tags":["recipes","seafood","cooking","portuguese","main dishes","spicy"]},{"title":"Portuguese Steamed Clams Recipe","blocks":[["h4","Ingredients :"],["ul","1Kg Vietnamese Clams"],["ul","1 Large Onion"],["ul","150mL White Wine"],["ul","80g Tomato Paste"],["ul","2 Bay Leaves"],["ul","Chili (lots of it)"],["ul","Salt"],["ul","Olive Oil"],["h4","Recipe:"],["p","1. Place the clams, sliced onion, white wine, tomato paste, bay leaves, chili, salt, and olive oil in a pan, place on medium heat for 30 minutes."],["p","2. After these 30 minutes, turn off the stove and let the pan stand for another 5 minutes in the heat of the stove."],["p","3. Serve hot and accompanied by bread to enjoy the sauce that you made at the same time with the clams."],["p","4. Easy peasy! 🥰"]],"date":"24 September 2020","tags":["recipes","main dishes","seafood","portuguese","cooking","appetizers","spicy"]},{"title":"Potato Cake Recipe","blocks":[["p","Whenever we had to make a birthday cake to school, the Potato Cake reigned! Everyone asked for a recipe and everyone was amazed when they knew that the main ingredient was the potato!"],["h4","Ingredients:"],["ul","9 Egg Yolks"],["ul","5 Egg Whites"],["ul","500g Granulated Sugar"],["ul","250g Boiled Potatoes"],["ul","250g Flour"],["ul","1 tsp Baking Powder"],["ul","Butter to Grease the Pan"],["h4","Recipe:"],["p","1. Turn on the oven at 180 Celsius degrees."],["p","2. Cook the potato and then grate it with a fork."],["p","3. Separate the egg yolks from the whites, whisking them stiff and storing the remaining 4 egg whites."],["p","4. Wisk the egg yolks with the sugar until you get a creamy mixture and add the grated potatoes."],["p","5. Add the sifted flour, baking powder, and egg whites to the mixture."],["p","6. Grease a circular shape pan without a hole with butter and put the mixture previously made."],["p","7. Bake for about 40min."],["p","8. You can test the baking of the cake with a toothpick until it comes out dry."]],"date":"24 August 2020","tags":["cooking","desserts","portuguese","cake","recipes"]},{"title":"Rabanadas - Portuguese French Toast Christmas Recipe","blocks":[["p","They are beautiful to look at and delicious to eat! There is no Christmas table without french toast! So here it is the recipe you could not miss. Freshly made is a delight, the next day, perdition."],["h4","Ingredients :"],["ul","1 Loaf of Bread for French Toast"],["ul","4 Eggs"],["ul","1L Milk"],["ul","6 tbsp Spoons"],["ul","1 Lemon Peel"],["ul","1 Cinnamon Stick"],["ul","Sugar"],["ul","Cinnamon"],["ul","Oil to Fry"],["h4","Recipe:"],["p","1. Cut the bread into slices and let it dry overnight."],["p","2. In a saucepan, place the milk to be heated together with the sugar, the lemon peel, and the cinnamon stick."],["p","3. Prepare four deep dishes, one with four beaten eggs, one with the boiled seasoned milk, one with sugar and cinnamon, and one last with absorbent paper."],["p","4. Pass the bread through milk, allowing it to absorb a lot."],["p","5. Then pass through the egg and fry until the slices are golden brown."],["p","6. Remove the excess of oil placing it on the plate with absorbent paper and then pass through sugar and cinnamon."],["p","7. With a glass of port wine they are ready to be eaten!"]],"date":"14 October 2020","tags":["christmas","recipes","cooking","breakfast","desserts","portuguese"]},{"title":"Red Berry Cheesecake Recipe","blocks":[["h4","Ingredients - Cheesecake :"],["ul","150g Digestive Crackers"],["ul","70g Butter"],["ul","200g Cream Cheese (philadelphia)"],["ul","200g Fresh Cheese (spreadable)"],["ul","80g sugar"],["ul","200mL Cream"],["ul","3 Gelatin Sheets"],["ul","½ tsp Vanilla Flavor"],["h4","Ingredients - Red Berries Topping :"],["ul","400g Mixed Red Berries"],["ul","2 Gelatin Sheets"],["ul","2 - 3 tbsp Sugar"],["ul","Lemon Juice (half a lemon)"],["h4","Recipe - Red Berries Topping:"],["p","1. Combine the sugar with the red berries in a saucepan set over medium-high heat. Then, add the lemon juice."],["p","2. Cook until the berries have turned softened and use the spoon to roughly smash it. Remove from heat and let it cool."],["p","3. Reserve it."],["h4","Recipe:"],["p","1. First let's crush the crackers and then mix them with the melted butter. Place this in a removable ring cake pan by pressing with the help of a spoon. Let it rest in the cold."],["p","2. Beat the cream cheese and the fresh cheese with the sugar and vanilla flavor until it gets creamy. Add the cream to the mixture."],["p","3. Hydrate the gelatin sheets in very cold water for 5 minutes. Drain excess water and microwave it for about 10 seconds, until dissolved. Add to the mixture."],["p","4. Pour the cheesecake mix over the biscuit base and refrigerate for 4-6 hours."],["p","5. Add the topping previously made and be delighted! 😍"]],"date":"6 February 2021","tags":["gluten free","recipes","cooking","american","desserts","cake"]},{"title":"Red Velvet Cupcakes with Cream Cheese Frosting","blocks":[["p","There’s something truly magical about the rich, velvety texture of a red velvet cupcake topped with creamy, dreamy cream cheese frosting. Perfect for any occasion, these cupcakes are soft, sweet, and just the right amount of indulgence. Whether you're celebrating or just treating yourself, these little bites of joy will make your day a whole lot sweeter!"],["h4","Ingredients - Cake Batter :"],["ul","160g flour"],["ul","8g unsweetened cocoa powder"],["ul","½ tsp baking soda"],["ul","½ tsp salt"],["ul","¼ unsalted butter, room temperature"],["ul","150g sugar"],["ul","1 egg"],["ul","70g vegetable oil"],["ul","½ tsp white vinegar"],["ul","1 tsp vanilla extract"],["ul","½ cup buttermilk, room temperature (pro tip: 200mL milk + 1 tbsp lemon juice = quick buttermilk!)"],["ul","Red food coloring gel (because red velvet should really be red)"],["ul","Ingredients - Cream Cheese Frosting:"],["ul","400g cream cheese"],["ul","200g heavy whipping cream"],["ul","1 tsp vanilla extract"],["ul","100-200g powdered sugar (adjust to your sweetness level, you sweet thing)"],["h3","Instructions:"],["p","1. Preheat your oven to 180°C (350°F) and line an 8-10 cupcake tray with cases. If you're using a different tray, it’s okay."],["p","2. In a large bowl, whisk together the cake flour, cocoa powder, baking soda, and salt. Then, sift the dry ingredients to remove any rogue lumps of cocoa powder."],["p","3. In the bowl of a stand mixer (or any mixing device that makes you feel fancy), cream together the butter and sugar on medium speed for about 2 minutes. This is the moment to channel your inner pastry chef. Add the egg and mix until fully combined, then throw in the oil, vanilla extract, and vinegar like you own the place."],["p","4. Now, add the buttermilk (yes,
