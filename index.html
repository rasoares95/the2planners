<meta property="og:title" content="The 2 Planners">
<meta property="og:description" content="Recipes, city guides and daily life from Richie and Andrew in Porto.">

<body>
<title>The 2 Planners</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Italianno&display=swap">
<style>
/* Layout: a postcard album. Sticky header with the stamp, a banner hero, then grids of
   stamp-framed cards, each franked with a postmark showing the post's date. */
:root{
  --coffee:#F6D365;--coffee-ink:#3A2E12;
  --paper:#F7F4EC;      /* page ground, warm like the banner damask */
  --card:#FFFDF8;       /* card surface */
  --stamp:#EAE5D4;      /* the brand stamp beige */
  --stamp-edge:#CFC6A8; /* stamp inner frame */
  --ink:#3F3D38;        /* body text */
  --grey:#8A8A8A;       /* the wordmark grey */
  --muted:#6E6A60;      /* secondary text */
  --script:#7A6A45;     /* tagline brown-gold */
  --red:#B8312B;        /* the anniversary ribbon red, used sparingly */
  --teal:#2E9C95;       /* the couple illustration's teal */
  --line:#E2DCCB;
  --shadow:0 1px 2px rgba(63,61,56,.06),0 6px 18px rgba(63,61,56,.07);
  --f-display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-script:"Italianno","Brush Script MT",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1E1D1A;--card:#282622;--stamp:#3A372E;--stamp-edge:#5A5442;--ink:#E9E4D6;--grey:#B5B1A7;--muted:#A8A293;--script:#CDB98A;--red:#E0625A;--teal:#5CC4BC;--line:#3A372F;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1E1D1A;--card:#282622;--stamp:#3A372E;--stamp-edge:#5A5442;--ink:#E9E4D6;--grey:#B5B1A7;--muted:#A8A293;--script:#CDB98A;--red:#E0625A;--teal:#5CC4BC;--line:#3A372F;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;color:var(--ink)}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:4px}

/* header */
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;align-items:center;gap:24px;min-height:68px;flex-wrap:wrap;position:relative}
.search-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex-shrink:0;margin-left:-12px}
.search-btn:hover{background:var(--stamp)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand img{height:36px;width:auto}
nav.main{display:flex;gap:4px;overflow-x:auto;margin-left:auto;scrollbar-width:none;min-width:0}
nav.main::-webkit-scrollbar{display:none}
nav.main a{font-family:var(--f-display);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--muted);padding:10px 12px;border-radius:999px;white-space:nowrap}
nav.main a:hover{color:var(--ink)}
nav.main a[aria-current="page"]{color:var(--ink);background:var(--stamp)}
@media (max-width:760px){header.site .wrap{gap:0;padding-block:10px 4px}.brand{width:100%;justify-content:center}nav.main{margin:0 -8px;width:calc(100% + 16px)}.search-btn{position:absolute;top:10px;right:max(16px,env(safe-area-inset-right,0px));margin:0;width:36px;height:36px}}

/* hero */
.hero{position:relative;background:var(--stamp)}
.hero img{display:block;width:100%;height:auto;aspect-ratio:2000/870;object-fit:cover;max-width:100%}
.lede{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding-block:44px 8px}
.lede .script{font-family:var(--f-script);font-size:clamp(44px,6vw,64px);line-height:.9;color:var(--script)}
.lede p{margin:0;max-width:58ch;color:var(--muted);font-size:18px}
.lede .pillars{font-family:var(--f-display);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--grey);margin-top:10px}
@media (max-width:700px){.lede{grid-template-columns:1fr;gap:10px;padding-top:28px}}

/* section heads */
section.block{padding-block:40px}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:12px;flex-wrap:wrap}
.shead h2{font-size:clamp(24px,3vw,32px);font-weight:300;letter-spacing:.01em}
.shead h2 em{font-family:var(--f-script);font-style:normal;color:var(--script);font-size:1.45em;font-weight:400;margin-left:4px}
.shead a{font-family:var(--f-display);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--red);text-decoration:none}
.shead a:hover{text-decoration:underline}

/* cards: stamp-framed placeholders */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:28px 22px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
@media (max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:22px 14px}.grid.wide{grid-template-columns:1fr}.card h3{font-size:15px}.stampin .mono{font-size:44px}.postmark{width:52px;height:52px;font-size:7px;right:10px;top:10px}.postmark::after{display:none}.stampin .soon{font-size:8px}}
.card{display:flex;flex-direction:column;gap:12px;text-decoration:none;min-width:0}
.stampbox{position:relative;aspect-ratio:4/3;max-width:100%;padding:9px;background:var(--card);box-shadow:var(--shadow);
  -webkit-mask:radial-gradient(circle 5px at 50% 0,transparent 98%,#000) 0 0/16px 100% repeat-x,radial-gradient(circle 5px at 50% 100%,transparent 98%,#000) 0 0/16px 100% repeat-x;
  mask:radial-gradient(circle 5px at 50% 0,transparent 98%,#000) 0 0/16px 100% repeat-x,radial-gradient(circle 5px at 50% 100%,transparent 98%,#000) 0 0/16px 100% repeat-x;
  transition:transform .25s ease}
.card:hover .stampbox{transform:translateY(-3px) rotate(-.6deg)}
.stampin{height:100%;border:1px solid var(--stamp-edge);background:var(--tint,var(--stamp));display:grid;place-items:center;position:relative;overflow:hidden}
.stampin .mono{font-family:var(--f-script);font-size:64px;line-height:1;color:var(--card);opacity:.95;text-align:center;padding:0 12px}
.stampin .soon{position:absolute;left:10px;bottom:8px;font-family:var(--f-display);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--card);opacity:.9}
.postmark{position:absolute;right:16px;top:14px;width:70px;height:70px;border-radius:50%;border:1.5px solid rgba(63,61,56,.45);display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-size:9px;font-weight:600;letter-spacing:.08em;line-height:1.25;color:rgba(63,61,56,.6);transform:rotate(12deg);font-variant-numeric:tabular-nums;background:transparent}
.postmark::after{content:"";position:absolute;right:-46px;top:20px;width:44px;height:26px;background:repeating-linear-gradient(transparent 0 4px,rgba(63,61,56,.35) 4px 5.5px)}
.card .meta{font-family:var(--f-display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.card h3{font-size:18px;font-weight:500;line-height:1.3}
.card .sub{font-size:15px;color:var(--muted);margin:-4px 0 0;line-height:1.45}
.stars{color:var(--red);letter-spacing:.1em;font-size:14px}

/* recipes toolbar */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:26px}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:12px 16px 12px 42px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--f-display);font-size:12px;font-weight:500;letter-spacing:.06em;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--muted)}
.chip:hover{color:var(--ink);border-color:var(--stamp-edge)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.count{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:-8px 0 20px}
.empty{padding:40px 0;color:var(--muted);text-align:center}

/* page title band */
.pagehead{padding-block:44px 28px;display:grid;gap:8px}
.pagehead .kicker{font-family:var(--f-script);font-size:40px;line-height:1;color:var(--script)}
.pagehead h1{font-size:clamp(30px,5vw,48px);font-weight:300;letter-spacing:.01em}
.pagehead p{margin:4px 0 0;max-width:62ch;color:var(--muted)}

/* single post */
.post{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:56px;padding-block:20px 60px}
@media (max-width:900px){.post{grid-template-columns:1fr;gap:28px}}
.back{font-family:var(--f-display);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none;display:inline-block;margin-top:28px}
.back:hover{color:var(--ink)}
.post h1{font-size:clamp(28px,4.4vw,44px);font-weight:300;line-height:1.15;margin:12px 0 8px}
.post .dateline{font-family:var(--f-display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tag{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;padding:4px 10px;border-radius:999px;background:var(--stamp);color:var(--ink);text-decoration:none}
.body{max-width:68ch}
.body .feature{margin:26px 0 30px}
.body .feature .stampbox{aspect-ratio:3/2}
.stampin img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;max-width:100%}
.stampin.photo .postmark{color:rgba(255,255,255,.95);border-color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.45);box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.stampin.photo .postmark::after{background:repeating-linear-gradient(transparent 0 4px,rgba(255,255,255,.75) 4px 5.5px)}
.inpics{display:grid;gap:10px;margin:22px 0 26px;grid-template-columns:1fr 1fr}
.inpics button{padding:0;border:0;background:var(--stamp);border-radius:6px;overflow:hidden;cursor:zoom-in;max-width:100%;aspect-ratio:4/3;display:block}
.inpics.n1{grid-template-columns:1fr}.inpics.n1 button{aspect-ratio:3/2}
.inpics.n3 button:first-child{grid-column:1/-1;aspect-ratio:16/9}
.inpics img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
.inpics button:hover img{transform:scale(1.03)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:30px 0 10px}
.gallery button{padding:0;border:0;background:var(--stamp);border-radius:6px;overflow:hidden;cursor:zoom-in;aspect-ratio:1;max-width:100%}
.gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
.gallery button:hover img{transform:scale(1.04)}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(20,19,17,.92);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
.lightbox img{cursor:pointer}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer}
.lb-nav:hover{background:rgba(255,255,255,.28)}
.lb-prev{left:calc(14px + env(safe-area-inset-left,0px))}
.lb-next{right:calc(14px + env(safe-area-inset-right,0px))}
.lb-count{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);color:#fff;font-family:var(--f-display);font-size:12px;letter-spacing:.14em;background:rgba(0,0,0,.35);padding:6px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.lightbox button.lb-close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-family:var(--f-display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.side .mini img{width:46px;height:46px;object-fit:cover;border-radius:4px;display:block}
.body p{margin:0 0 1em}
.body h3{font-size:22px;font-weight:500;margin:1.6em 0 .5em}
.body h4{font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin:1.8em 0 .7em}
.body .tip{font-style:italic;background:var(--card);border-left:3px solid var(--teal);padding:12px 16px;margin:0 0 1em;border-radius:0 6px 6px 0}
.body ul.ingr{list-style:none;padding:0;margin:0 0 1em;display:grid;gap:2px}
.body ul.ingr li label{display:flex;gap:12px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer}
.body ul.ingr li label:hover{background:var(--card)}
.body ul.ingr input{margin-top:6px;accent-color:var(--teal);width:16px;height:16px;flex-shrink:0}
.body ul.ingr input:checked+span{text-decoration:line-through;color:var(--muted)}
.body ul.plain{margin:0 0 1em;padding-left:1.2em}
.body ol.steps{list-style:none;counter-reset:s;padding:0;margin:0 0 1em;display:grid;gap:14px}
.body ol.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:12px}
.body ol.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:300;font-size:24px;line-height:1.2;color:var(--grey);font-variant-numeric:tabular-nums}
.temp{white-space:nowrap;background:var(--stamp);padding:0 6px;border-radius:4px;font-family:var(--f-display);font-size:.82em;font-weight:500}
.source{font-family:var(--f-display);font-size:12px;color:var(--muted);margin-top:30px;word-break:break-all}
.source a{color:var(--muted)}
aside.side{display:grid;gap:28px;align-content:start}
.side .box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.side h4{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.side .mini{display:grid;gap:12px}
.side .mini a{text-decoration:none;display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center;font-size:15px;line-height:1.35}
.side .mini a:hover span{text-decoration:underline}
.side .mini i{display:grid;place-items:center;aspect-ratio:1;background:var(--tint,var(--stamp));border-radius:4px;font-family:var(--f-script);font-style:normal;font-size:26px;color:var(--card)}
.side .couple{width:120px;height:auto;display:block;margin:0 auto 10px}
.side .box p{margin:0;font-size:15px;color:var(--muted)}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:48px;align-items:center;padding-block:20px 60px}
@media (max-width:820px){.about{grid-template-columns:1fr}}
.about img{width:100%;max-width:440px;height:auto;margin:0 auto;display:block}
.people{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0}
@media (max-width:460px){.people{grid-template-columns:1fr}}
.person{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.person h3{font-family:var(--f-script);font-size:42px;line-height:1;color:var(--script)}
.person .role{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin:6px 0}
.person p{margin:0;font-size:15px}
.person .warn{color:var(--red);font-size:14px;margin-top:6px}
.email{display:inline-flex;gap:10px;align-items:center;flex-wrap:wrap}
.email code{font-family:var(--f-display);font-size:15px;background:var(--stamp);padding:6px 12px;border-radius:6px;user-select:all}
.btn{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:9px 16px;border-radius:999px;border:1px solid var(--ink);background:transparent;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--card)}

/* home about strip */
.since{display:grid;grid-template-columns:200px 1fr;gap:32px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 28px}
.since img{width:100%;height:auto;max-width:200px}
.since p{margin:0 0 12px;max-width:60ch}
@media (max-width:620px){.since{grid-template-columns:1fr;text-align:center}.since img{margin:0 auto;max-width:160px}}

/* countries */
.countries{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}

.aboutpic{padding:0;border:0;background:var(--stamp);border-radius:10px;overflow:hidden;cursor:zoom-in;display:block;max-width:100%;box-shadow:var(--shadow)}
.aboutpic img{display:block;width:100%;height:auto;max-width:100%;margin:0}
.person{display:flex;flex-direction:column;gap:6px}
.person .phead{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.body .person h3{margin:0;line-height:1}
.person .role{margin:0}
.person p{margin:0}
.person .avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--stamp);display:block;max-width:none;margin:0;flex-shrink:0}
.mosaic{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:620px){.mosaic{grid-template-columns:1fr 1fr}}
.mosaic figure{margin:0;display:grid;gap:6px;min-width:0}
.mosaic button{padding:0;border:0;background:var(--stamp);border-radius:8px;overflow:hidden;cursor:zoom-in;aspect-ratio:1;max-width:100%;display:block}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
.mosaic button:hover img{transform:scale(1.03)}
.mosaic figcaption{font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.srch{position:fixed;inset:0;z-index:40;background:rgba(30,29,26,.45);display:flex;justify-content:center;align-items:flex-start;padding:calc(70px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.srch[hidden]{display:none!important}
.srch-box{width:100%;max-width:640px;max-height:calc(100vh - 110px);display:flex;flex-direction:column;background:var(--card);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.srch-in{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.srch-in svg{flex-shrink:0;color:var(--muted)}
.srch-in input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-family:var(--f-display);font-size:18px;color:var(--ink)}
.srch-in button{border:0;background:var(--stamp);color:var(--ink);font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:7px 11px;border-radius:999px;cursor:pointer}
.srch-res{overflow-y:auto;padding:8px;display:grid;gap:2px}
.srch-res a{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;padding:8px;border-radius:10px;text-decoration:none}
.srch-res a:hover,.srch-res a.on{background:var(--paper)}
.srch-res img,.srch-res i{width:56px;height:56px;border-radius:8px;object-fit:cover;display:grid;place-items:center;background:var(--tint,var(--stamp));font-family:var(--f-script);font-style:normal;font-size:26px;color:var(--card)}
.srch-res b{font-family:var(--f-display);font-weight:500;font-size:15px;line-height:1.3;display:block}
.srch-res small{font-family:var(--f-display);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.srch-res mark{background:var(--stamp);color:inherit;border-radius:3px;padding:0 2px}
.srch-msg{padding:22px 16px;color:var(--muted);font-size:15px;text-align:center}
.srch-hints{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}

/* ===== dynamic layer ===== */
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#view{animation:viewIn .45s ease both}
.pre{opacity:.12;transform:translateY(28px)}
.rv{transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.stampin img{transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.card:hover .stampin img{transform:scale(1.07)}
.card h3{transition:color .2s ease}
.card:hover h3{color:var(--red)}
nav.main a{position:relative;transition:color .2s ease,background .2s ease}
/* carousel */
.car{position:relative;background:var(--stamp);overflow:hidden;aspect-ratio:2000/870;max-width:100%}
@media (max-width:700px){.car{aspect-ratio:4/3}}
.car .sl{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s .9s}
.car .sl.on{opacity:1;visibility:visible;transition:opacity .9s ease}
.car .sl img{width:100%;height:100%;object-fit:cover;display:block;max-width:100%}
.car .sl.on img{animation:kb 9s ease-out both}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.car .sl.banner img{animation:none}
.car .cap{position:absolute;left:0;right:0;bottom:0;padding:48px max(24px,env(safe-area-inset-left,0px)) 34px;background:linear-gradient(transparent,rgba(20,18,14,.72));color:#fff;display:grid;gap:8px}
.car .cap .in{max-width:1160px;margin:0 auto;width:100%;display:grid;gap:8px}
.car .cap .k{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;opacity:.9}
.car .cap h2{color:#fff;font-size:clamp(26px,4.4vw,52px);font-weight:300;line-height:1.05;max-width:18ch}
.car .cap p{margin:0;max-width:52ch;font-size:clamp(15px,1.6vw,18px);opacity:.92}
.car .cap a{justify-self:start;margin-top:6px;font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#1e1d1a;background:#fff;padding:11px 18px;border-radius:999px;text-decoration:none;transition:transform .2s ease}
.car .cap a:hover{transform:translateX(4px)}
.car .sl.on .cap .in>*{animation:capIn .8s cubic-bezier(.2,.7,.2,1) both}
.car .sl.on .cap .in>*:nth-child(2){animation-delay:.08s}.car .sl.on .cap .in>*:nth-child(3){animation-delay:.16s}.car .sl.on .cap .in>*:nth-child(4){animation-delay:.24s}
@keyframes capIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (max-width:700px){.car .cap{padding:40px 18px 44px}.car .cap p{display:none}}
.car .ar{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.82);color:#1e1d1a;display:grid;place-items:center;cursor:pointer;z-index:2;opacity:0;transition:opacity .25s ease}
.car:hover .ar,.car .ar:focus-visible{opacity:1}
.car .ar.p{left:max(16px,env(safe-area-inset-left,0px))}.car .ar.n{right:max(16px,env(safe-area-inset-right,0px))}
@media (hover:none){.car .ar{display:none}}
.car .dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:2}
.car .dots button{width:28px;height:4px;border-radius:2px;border:0;padding:0;background:rgba(255,255,255,.45);cursor:pointer;overflow:hidden;position:relative}
.car .dots button.on::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:dot 6.5s linear both}
.car.paused .dots button.on::after,.car.still .dots button.on::after{animation:none;transform:none}
.car .sl.banner~.dots button{background:rgba(63,61,56,.25)}
@keyframes dot{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* bento */
.bento{display:grid;grid-template-columns:1.6fr 1fr;grid-template-rows:1fr 1fr;gap:18px;min-height:520px}
.bento a{position:relative;border-radius:16px;overflow:hidden;text-decoration:none;color:#fff;background:var(--stamp);display:block;min-height:220px;box-shadow:var(--shadow)}
.bento a:first-child{grid-row:1/3}
.bento img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.7,.2,1);max-width:100%}
.bento a:hover img{transform:scale(1.06)}
.bento .bc{position:absolute;left:0;right:0;bottom:0;padding:40px 20px 18px;background:linear-gradient(transparent,rgba(20,18,14,.75));display:grid;gap:4px}
.bento .bc small{font-family:var(--f-display);font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;opacity:.9}
.bento .bc b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.2}
.bento a:first-child .bc b{font-size:clamp(24px,3vw,34px);font-weight:300}
@media (max-width:760px){.bento{grid-template-columns:1fr;grid-template-rows:none;min-height:0}.bento a:first-child{grid-row:auto;min-height:320px}}
/* surprise */
.surprise{display:grid;grid-template-columns:1fr 1.1fr;gap:36px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px}
@media (max-width:760px){.surprise{grid-template-columns:1fr;padding:20px;gap:20px}}
.surprise h2{font-size:clamp(26px,3.4vw,38px);font-weight:300;line-height:1.1}
.surprise h2 em{font-family:var(--f-script);font-style:normal;color:var(--script);font-size:1.35em}
.surprise p{color:var(--muted);margin:10px 0 18px}
.dice{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;background:var(--red);color:#fff;border:0;border-radius:999px;padding:14px 22px;cursor:pointer;transition:transform .15s ease,box-shadow .2s ease;box-shadow:0 6px 18px rgba(184,49,43,.28)}
.dice:hover{transform:translateY(-2px)}
.dice:active{transform:scale(.97)}
.dice svg{transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.dice.spin svg{transform:rotate(360deg)}
.pick{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;text-decoration:none;min-height:150px}
@media (max-width:460px){.pick{grid-template-columns:110px 1fr}}
.pick .ph{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--stamp);box-shadow:var(--shadow);max-width:100%}
.pick img{width:100%;height:100%;object-fit:cover;display:block}
.pick small{font-family:var(--f-display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.pick b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(20px,2.4vw,26px);line-height:1.2;margin:4px 0}
.pick span.go{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.pick.rolling .ph img{filter:blur(1.5px)}
.pick.landed .ph{animation:land .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{from{transform:scale(.88) rotate(-4deg)}to{transform:none}}
/* map */
.tmap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:860px){.tmap{grid-template-columns:1fr}}
.tmap .mbox{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative}
.tmap svg{display:block;width:100%;height:auto;max-width:100%}
.tmap .sea{fill:var(--paper)}
.tmap .land{fill:var(--stamp);stroke:var(--card);stroke-width:.8}
.tmap .vis{fill:var(--stamp-edge);stroke:var(--card);stroke-width:.8}
.tmap .route{fill:none;stroke:var(--red);stroke-width:1.4;stroke-dasharray:3 5;opacity:.55}
.tmap .pin{cursor:pointer}
.tmap .pin circle.dot{fill:var(--red);stroke:var(--card);stroke-width:2.5;transition:r .2s ease}
.tmap .pin.home circle.dot{fill:var(--teal)}
.tmap .pin circle.ring{fill:none;stroke:var(--red);stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center}
.tmap .pin.home circle.ring{stroke:var(--teal)}
.tmap .pin:hover circle.dot,.tmap .pin.on circle.dot{r:9}
.tmap .pin.on circle.ring,.tmap .pin:hover circle.ring{animation:ring 1.6s ease-out infinite}
@keyframes ring{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(3)}}
.tmap .pin text{font-family:var(--f-display);font-size:12.5px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.tmap .pin:focus{outline:none}.tmap .pin:focus-visible circle.dot{stroke:var(--ink)}
.tmap .legend{position:absolute;left:14px;bottom:12px;display:flex;gap:14px;font-family:var(--f-display);font-size:11px;color:var(--muted);background:var(--card);padding:6px 10px;border-radius:999px;border:1px solid var(--line)}
.tmap .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:-1px}
.tmap .legend i.h{background:var(--teal)}
.mpanel{display:grid;gap:14px}
.mpanel .stat{display:flex;gap:22px}
.mpanel .stat div{display:grid}
.mpanel .stat b{font-family:var(--f-display);font-weight:300;font-size:40px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.mpanel .stat span{font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mpanel h3{font-size:24px;font-weight:300}
.mpanel h3 small{display:block;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.mpanel .hint{color:var(--muted);font-size:15px;margin:0}
.mlist{display:grid;gap:10px}
.mlist a{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px;transition:border-color .2s ease,transform .2s ease}

.mpanel.swap{animation:viewIn .35s ease both}
/* scaler + timers */
.scaler{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:22px 0 4px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}

.ingr .q{transition:background .4s ease;border-radius:4px}
.ingr .q.bump{background:var(--stamp)}
.tmr{display:inline-flex;align-items:center;gap:5px;font:inherit;font-family:var(--f-display);font-size:.84em;font-weight:600;color:var(--teal);background:transparent;border:1px solid currentColor;border-radius:999px;padding:0 9px 0 7px;line-height:1.7;cursor:pointer;vertical-align:baseline;white-space:nowrap}
.tmr:hover{background:var(--teal);color:var(--card)}

.tbox{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--card);border-radius:999px;padding:8px 8px 8px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:var(--f-display);animation:viewIn .3s ease both}

const DATA={"About the blog":[{"title":"About Us","blocks":[["h3","Richie"],["h4","CONTENT CREATOR"],["p","Cheerful, Adventurous, and Romantic"],["p","⚠️ Not a Morning Person"],["h3","Andrew"],["h4","RADIATION ONCOLOGIST"],["p","Funny, Crazy, and Sweet"],["p","⚠️ Cleaning Maniac"],["p","Thanks for stopping by!"],["p","We are The2Planners, a couple located in Porto, Portugal, that loves to do everything by themselves!"],["p","Everything started with a Christmas presents for Richie's mom, for an entire year we recreate her recipes and design her own cookbook! \"Maria Alice's Homemade Recipes!\" 🥰 this was such an adventure that we couldn't stop anymore! Now we share our life with you, in the best way possible 😊"],["h4","Have Fun With US!❣️"],["p","geral.the2planners@gmail.com"]],"date":"30 July 2020","tags":["about us"]},{"title":"Search by Country","blocks":[["h3","Austria"],["h3","Czech Republic"],["h3","Hungary"],["h3","Italy"],["h3","Portugal"],["h3","Spain"]],"date":"29 July 2020","tags":["search by countries"]}],"Recipes":[{"title":"3 Cheese Fondue Recipe","blocks":[["h4","Ingredients :"],["ul","140g Mozzarella Cheese"],["ul","110g Gruyere Cheese"],["ul","250g Emmental Cheese"],["ul","1 tbsp Garlic Powder"],["ul","1 tsp Black Pepper"],["ul","1 tsp Nutmeg"],["ul","1 tbsp Corn Starch"],["ul","200mL White Wine"],["ul","400g Potatoes (+ salt)"],["ul","3 slices of bread"],["ul","2 Steaks (+ salt)"],["h4","Recipe:"],["p","1. First we have to grate the cheeses."],["p","2. Season the potatoes, already cut and washed, with salt, and put in the oven for 20min at 180ºC | 356ºF."],["p","3. In a pan add the garlic powder, black pepper, nutmeg, and wine until boiling."],["p","4. When it starts to boil, add the cheeses gradually, letting them melt."],["p","5. Put the stove on low heat and add the cornstarch and stir for 3 minutes."],["p","6. Meanwhile season the steaks with salt and grill them, then dice them into cubs."],["p","7. Toast slices of bread and break them into pieces."],["p","8. Arrange the potatoes, steaks, and bread on a platter."],["p","9. You can pour the cheese into a fondue machine to keep it warm or eat from the pan, heating every 10 minutes."],["p","10. A great appetizer to start a night with friends at home! 🥰"]],"date":"28 January 2021","tags":["appetizers","cooking","swiss","meat","recipes","bread"]},{"title":"40min Burguer Buns Recipe","blocks":[["h4","Ingredients :"],["ul","3 Cups All-Purpose Flour"],["ul","⅓ Cup Vegetable Oil"],["ul","1 Cup Warm Water"],["ul","1 Large Egg"],["ul","2 tbsp Active Dry Yeast"],["ul","1 tsp Salt"],["ul","1 Pinch Granulated Sugar"],["ul","Parchment Paper"],["ul","1 Egg Yolk (topping)"],["ul","1 tbsp Water (topping)"],["ul","2 tbsp Sesame Seeds (topping)"],["h4","Recipe:"],["p","1. Add active dry yeast to the water and let it stand for 5min. Then add the vegetable oil and the granulated sugar."],["p","2. Wish the large egg slightly."],["p","3. In a mixer with the dough hook, add the flour and start to beat, gradually adding the water mixture."],["p","5. Add the egg and beat again for 3 min."],["p","6. Place the dough on a floured bench and add the salt and knead for 3-5 min until the dough is soft."],["p","7. Cut the dough into 6 portions (we cut into 8 but we shouldn't - very small buns)."],["p","8. Place the loaves on a tray lined with parchment paper and cover with a cloth, allowing them to rise for 10 minutes."],["p","9. Heat the oven to 200ºC | 392ºF."],["p","10. In a bowl, whisk the yolk with the water."],["p","11. After 10 minutes, brush the loaves with the yolk and water and sprinkle them with sesame seeds."],["p","12. Bake for 8-12min, until you get a nice golden set of burger buns."],["p","13. Super fast, super easy, and mega delicious!"]],"date":"2 February 2021","tags":["main dishes","cooking","american","bread","recipes"]},{"title":"Aletria - Portuguese Capellini Pudding - Recipe","blocks":[["p","There are those who do it in many ways, this one is egg-free, simple, and delicious! Just bake the dough with a few bibbidi-bobbidi-boos of magic and puff! You'll get a Sweet Vermicelli!"],["p","🎄 In our Christmas dinner table, we always have this recipe! you can eat it stray out of the pan or wait until it gets firm like a pudding."],["h4","Ingredients :"],["ul","1L Water"],["ul","250g Pasta Capellini"],["ul","250g Granulated Sugar"],["ul","2 Cinnamon Sticks"],["ul","2 Lemon Peels"],["ul","Cinnamon"],["h4","Recipe:"],["p","1. Put the water to a boil in a pan."],["p","2. Add the cinnamon sticks, sugar, and lemon peels, let it boil for 3 minutes."],["p","3. Place the dough in the boiling water while roughly breaking it with your hands."],["p","4. Let it cook for about 5min and remove the pan from the heat."],["p","5. Serve on individual plates or on a platter."],["p","6. It can be eaten hot or cold, when cold it gets a pudding texture."],["p","7. Have fun writing something or drawing with cinnamon to garnish."]],"date":"4 October 2020","tags":["cooking","breakfast","portuguese","desserts","recipes","christmas"]},{"title":"Aperol Spritz Recipe","blocks":[["h4","Ingredients :"],["ul","Half the Glass Size of Aperol Spritz"],["ul","Half the Glass Size of Sparkling Wine Cinzano Pro Spiritz"],["ul","1 tbsp Sparkling Water"],["ul","1 Orange Slice"],["ul","2 Green Olives (Our little twist)"],["ul","3 Ice Cubes"],["h4","Recipe:"],["p","1. In a glass, add ice, half the glass of Aperol, and then the Sparkling Wine."],["p","2. Add a splash of sparkling water."],["p","3. Add the orange slice and the 2 green olives."],["p","4. You are ready to go! Feel the Italian energy!"]],"date":"19 October 2020","tags":["recipes","drinks","cooking","italian"]},{"title":"Apple Crumble Recipe","blocks":[["p","If we can describe Christmas in one recipe, THIS IS IT! Every bite you'll take will transport you to your own childhood memories! The flavor is amazing, the sweetness of the apple, with the cinnamon and the lemon juice!"],["p","It looks like it has a lot of steps to make, but no, we break it down for you in three very easy steps, crust, filling, and crumble!"],["p","This is the one to impress and to be delighted! We are always making this recipe! Is amazing, give it a try!"],["h4","Ingredients - Crust :"],["ul","300g All-Purpose Flour"],["ul","30g Granulated Sugar"],["ul","1 tsp Salt"],["ul","120g Butter, room temperature and cut into cubes"],["ul","8-10 tbsp Ice Water"],["h4","Ingredients - Filling :"],["ul","7-8 Apples, peeled and grated"],["ul","120g Light Brown Sugar"],["ul","26g All-Purpose Flour"],["ul","2 tsp Cinnamon Powder"],["ul","¼ tsp Nutmeg Powder"],["ul","1 tbsp Lemon Juice"],["h4","Ingredients - Crumble :"],["ul","155g All-Purpose Flour"],["ul","150g Light Brown Sugar"],["ul","100g Butter, melted and cooled"],["h4","Recipe:"],["p","1. You'll have to do this recipe in three steps, super easy ones, the crust, the filling, and the crumble!"],["h4","Crust:"],["p","1. In a large bowl, place the flour, sugar, and salt."],["p","2. Add the butter and incorporate everything with your hands, pay attention to the butter - it must be at room temperature."],["p","3. Knead and add the water until you get a smooth and consistent dough."],["p","4. Place the dough on a flat surface and with the help of a kitchen roll, roll out the dough."],["p","5. After it is stretched, place it on a tray and cut the remaining ends."],["h4","Filling:"],["p","1. Peel 7-8 apples and grate them."],["p","2. In a large bowl, add the grated apples, light brown sugar, flour, cinnamon, nutmeg, and lemon juice."],["p","3. Stir everything well."],["p","4. Place over the crust on the tray."],["h4","Crumble:"],["p","1. Melt the butter and place it in a bowl to cool."],["p","2. In another bowl, add the sugar and flour, and when the butter has cooled add to the mixture."],["p","3. Incorporate everything until you create enough crumbs."],["p","4. Pour the crumbs over the filling on the tray."],["p","2. Place the tray in the oven for 40 min at 180ºC | 356ºF or until the crumble starts to brown."],["p","3. Let it cool a little bit and then add a spoon of vanilla ice cream and enjoy this amazing recipe!"]],"date":"21 November 2020","tags":["desserts","cooking","british","recipes","christmas"]},{"title":"Baba de Camelo - Portuguese Camel Drool Recipe","blocks":[["h4","Ingredients :"],["ul","Cooked Condensed Milk"],["ul","6 Eggs"],["ul","100g Portuguese Biscuits (or any kind of biscuit/cookies you like)"],["h4","Recipe:"],["p","1. Start by heating the cooked condensed milk in a water bath, put the can of cooked condensed milk in boiling water for about 15-20 minutes."],["p","2. After this time, transfer the condensed milk to a container and whisk until the mixture is silky and free of clumps."],["p","3. Separate the egg whites from the yolks. Add the egg yolks to the condensed milk and mix."],["p","4. Whisk the egg whites stiff."],["p","5. Wrap the egg whites carefully with the mixture of egg yolks and condensed milk, do not remove the air from the egg whites (do it 3 times, to make it easier to incorporate, very slowly)."],["p","6. Grate half a packet of Portuguese biscuits (or another kind you like) and place on top of the mixture. Take to the refrigerator for at least 6 hours, and serve very cold."],["p","7. This is so good! 🥰"]],"date":"2 March 2021","tags":["cooking","portuguese","desserts","cookies","recipes"]},{"title":"Banana Pancakes Recipe","blocks":[["p","This recipe is super fun to make and super easy as well! You will love eating this at breakfast, you can add any topping, and go a little crazy and make a pancake mountain!"],["p","You can change de bananas for other kinds of fruit, for example, berries! Don't worry about the exact amount of ingredients! Always remember you can balance things with milk or flour!"],["p","Please, don't forget to have fun!"],["h4","Ingredients :"],["ul","2 Bananas (or another kind of fruit)"],["ul","2 Eggs"],["ul","1 tsp Sugar"],["ul","10 tbsp Wheat Flour"],["ul","½ Cup Milk"],["ul","1 tsp Vanilla Flavor"],["h4","Recipe:"],["p","1. Put the two bananas in a tall glass and crush everything with the help of a kitchen magic wand."],["p","2. Add eggs, sugar, milk, and vanilla flavor. Always mixing everything with the kitchen magic wand."],["p","3. Add the flour gradually and the mixture is ready!"],["p","4. In a frying pan over medium heat pour a portion and turn after 3 min and wait another 3 min."],["p","5. This recipe gives 6 pancakes ready to be stuffed!"]],"date":"10 November 2020","tags":["recipes","desserts","american","cooking","breakfast"]},{"title":"Basic Fresh Basil Pesto Recipe","blocks":[["p","This recipe can be saved in the fridge for up to 6 months, so its a great way to store your basil, this way it won't get ruin in the garden! I always like to have some pesto in the house! You can do lots of things with it, some salad, pasta or even pastries! Let's give it a try!"],["h4","Ingredients:"],["ul","80g Peanuts (½ Cup) - or any kind of nuts that you enjoy"],["ul","34g Basil Leaves (2 Cups)"],["ul","1 Clove of Garlic"],["ul","60mL Olive Oil (¼ Cup)"],["ul","70g Pecorino or Parmigiano cheese (1 Cup)"],["ul","Salt"],["h4","Recipe:"],["p","1. In a food processor place the peanuts and basil leaves."],["p","2. Then, add olive oil, garlic, and cheese."],["p","3. Taste it and add salt if you like."],["p","4. Say with me: This was super easy!"]],"date":"27 August 2020","tags":["italian","cooking","appetizers","main dishes","recipes"]},{"title":"Biscoito Teixeira - Lemon and Cinnamon Biscuit Recipe","blocks":[["h4","Ingredients :"],["ul","500g Granulated Sugar"],["ul","500g Flour"],["ul","2 Eggs"],["ul","2 Cups Warm Water"],["ul","1 tsp Baking Soda"],["ul","1 Lemon Zest"],["ul","2 tbsp Cinnamon"],["ul","Parchment Paper"],["h4","Recipe:"],["p","1. Turn on the oven at 180ºC | 356ºF."],["p","2. Add the sugar and the two eggs and beat until a paste is created."],["p","3. Then add the warm water and the sifted flour to the mixture, alternating gradually."],["p","4. Complete the mixture by adding the remaining ingredients to the preparation."],["p","5. Put the parchment paper in a rectangular pan and pour the mixture into it."],["p","6. Bake for about 40min."],["p","7. Unmold and slice the cake into cubs."]],"date":"30 January 2021","tags":["cake","portuguese","desserts","cooking","recipes"]},{"title":"Bolo do Caco - Madeira Island Typical Bread Recipe","blocks":[["p","This is a very traditional recipe from Madeira Island, Portugal. This is an amazing recipe of bread, but if you ever go to Madeira Island you have to try the traditional one with sweet potato and with Poncha Cocktail!"],["h4","Ingredients :"],["ul","1Kg Wheat Flour"],["ul","5g Bakers Yeast (or 15g Fresh Bakers Yeast)"],["ul","1 tbsp Sugar"],["ul","1L Warm Water"],["ul","1 tbsp Salt"],["h4","Recipe:"],["p","1. In a large bowl, place the sugar and flour."],["p","2. In a cup, place the baker's yeast and hydrate it with 100ml of warm water (do not add hot water)."],["p","3. In the bowl with the sugar and flour preparation, add the yeast and half of the remaining water from the liter of warm water."],["p","4. Knead the dough and add warm water until you get a lump-free consistency."],["p","5. The dough has to be sticky and has to create air bubbles, only then will you know that it is perfectly kneaded."],["p","6. Then add a light layer of flour over the dough, cover the bowl with a cloth and let it rise for 1 hour."],["p","7. After 1h, put flour on a marble board or on a counter and start to divide the dough into small balls of dough, adding flour whenever necessary to stop gluing to your hands and the marble board or counter. Kneading for about 7 / 10min."],["p","8. After making the balls, flatten them with the back of your hand and let them rise for another 30 minutes."],["p","9. In a frying pan over medium heat, place a loaf of bread for 5 minutes and turn it over after gaining a color. Repeating the process on the other side."],["p","10. And they are ready! 🥰 Delicious loaves of bread to eat with a good garlic butter or a big juicy burger!"]],"date":"16 October 2020","tags":["portuguese","breakfast","appetizers","cooking","main dishes","recipes","bread"]},{"title":"Brazilian Cheese Bread Recipe","blocks":[["p","After baking this, your house will smell wonders, 😅 , the smell of Sour Starch is really intense and acid/sour and it will be impregnated in your kitchen through the day! But the flavor will be the reward that you need!"],["p","These are amazing for eating on a Sunday afternoon with a lovely lemonade!"],["p","Do you wanna be cheesy with us?"],["h4","Ingredients :"],["ul","120g Grated Island Cheese"],["ul","200mL Milk"],["ul","100mL Vegetable Oil"],["ul","1 tsp Salt"],["ul","300g Sour Starch"],["ul","1 Egg (large)"],["h4","Recipe:"],["p","1. Mix the oil with the milk and bring to the heat, do not let it boil. It's just to warm it up."],["p","2. In a bowl, mix the grated cheese with the sour starch and add the previous preparation (oil with milk)."],["p","3. Wrap everything very well with the help of a wooden spoon."],["p","4. Season with salt and add the slightly beaten egg."],["p","5. Stir everything very well and if necessary add an extra 50g of sour starch."],["p","6. In a deep dish, add a little vegetable oil to wet your fingers and start forming small balls of cheese bread."],["p","7. Place the cheese bread balls on a baking tray and bake at 180ºC | 356ºF for 15-20min, until it gains a slight yellow color."],["p","8. Eat these while hot, otherwise, they lost their meaning of cheesiness!"],["p","9. They are delicious but they really will fill up your belly a lot! 😁"]],"date":"10 December 2020","tags":["brazilian","bread","recipes","gluten free","appetizers","cooking"]},{"title":"Bread crumb Cake Recipe","blocks":[["p","We know it may not look like a conventional recipe, but it breaks the rule of using flour and reuses an asset that sometimes expires. The bread!"],["h4","Ingredients :"],["ul","8 Eggs"],["ul","350g Granulated Sugar (1 and a half Cups)"],["ul","250g Breadcrumbs (2 and a quarter Cups)"],["ul","1 tbsp Cinnamon"],["ul","1 Shot Port Wine"],["ul","1 tsp Baking Powder"],["ul","Butter to Grease"],["ul","Granulated Sugar to Sprinkle"],["h4","Recipe:"],["p","1. Turn on the oven at 180 Celsius degrees | 356 Fahrenheit degrees."],["p","2. Separate the egg yolks from the egg whites and whisk the egg whites."],["p","3. Whisk the egg yolks with the granulated sugar until a creamy mixture is obtained."],["p","4. Add port wine, baking powder, cinnamon, and breadcrumbs."],["p","5. With the help of a wooden spoon, add the egg whites until the dough is fluffy."],["p","6. Grease with butter a circular pan with a hole in the center and pour the cake mixture."],["p","7. Bake for + -40min."],["p","8. Unmold the cake and sprinkle with granulated sugar while it is hot to adhere to the cake."]],"date":"28 September 2020","tags":["cake","cooking","breakfast","portuguese","desserts","recipes"]},{"title":"Broa de Milho - Portuguese Corn Bread Recipe","blocks":[["h4","Ingredients :"],["ul","250g Corn Flour"],["ul","250g Wheat Flour"],["ul","300mL Boiling Water"],["ul","100mL Warm Water (50mL + 50mL)"],["ul","6g Active Dry Yeast"],["ul","1 tbsp Salt"],["ul","2 tbsp Granulated Sugar"],["h4","Recipe:"],["p","1. Scald the corn flour in the boiling water, kneading well. Let it rest for 1 hour."],["p","2. In a bowl, dilute the yeast in 50mL of warm water and 1tbsp of sugar. Let stand for 15 minutes to activate the yeast. In another bowl, dilute the salt with the others 50mL of water."],["p","3. Add wheat flour to the corn flour preparation, and add the water with yeast and the water with salt. Knead very well for a few minutes with the help of an electric mixer (5min), or by hand for about 10-12min."],["p","4. Cover the dough with a damp cloth and let it rise for 45 min in a warm place."],["p","5. Transfer the ball-shaped dough to the oven tray. Sprinkle it with flour and make a cross in the center. Bake in a preheated hot oven for about 1 hour at 220ºC | 430ºF."],["p","6. After that time, remove the bread from the oven and you are ready!"],["tip","TIP: If you want to eat it while still hot break the bread with your hands! If you want to slice it with a knife let it rest for 15-20min. Spread some butter on it and be happy! 🧈 🥰"]],"date":"18 February 2021","tags":["recipes","bread","portuguese","appetizers","cooking","cake"]},{"title":"Brownie Strawberry Trifle Recipe","blocks":[["h4","Ingredients - Brownie :"],["ul","110g Butter"],["ul","2 Small Eggs"],["ul","100g White Sugar"],["ul","100g Brown Sugar"],["ul","40g Cocoa Powder"],["ul","60g Flour"],["ul","1 tsp Vanilla Flavor"],["ul","1tsp Expresso Coffee"],["ul","125g Chocolate Chunks"],["ul","Pinch of Salt"],["h4","Recipe - Brownie :"],["p","1. Add the melted butter, eggs, coffee, and vanilla to a large bowl and whisk them together."],["p","2. Add the white and brown sugars to the mixture and whisk the mixture together until it’s smooth."],["p","3. Sift in the flour, salt, and cocoa powder, and stir until everything is incorporated."],["p","4. Chop the chocolate tablet into medium-sized chunks."],["p","5. Fold in the chocolate chunks."],["p","6. Transfer the batter to a parchment-lined baking dish."],["p","7. Bake at 180ºC | 356ºF for about 30 minutes."],["h4","Ingredients - Creamcheese :"],["ul","175g Philadelphia"],["ul","200mL Cream"],["ul","1tsp Vanilla Flavor"],["ul","5tbsp Powdered Sugar"],["h4","Recipe - Creamcheese :"],["p","1. Add the cream cheese, sugar, vanilla flavor, and cream (it should be cold) in a large bowl."],["p","2. Whisk until it gets creamy."],["p","3. Reserve in the cold."],["h4","Ingredients - Strawberries :"],["ul","10 Strawberries"],["ul","2 tbsp Granulated Sugar"],["h4","Recipe - Strawberries :"],["p","1. Cut the 10 strawberries into coarse pieces."],["p","2. Add 2 tbsp of granulated sugar and let it stand for 30 minutes."],["p","3. It is time to install the parfait. The recipe should be served in individual glasses."],["p","4. Start by roughly undoing pieces of chocolate brownie with your hands until they cover the bottom of the glass."],["p","5. Add the strawberries until you have a new, well-composed layer."],["p","6. Finally, add the cream cheese and garnish with two pieces of strawberry."],["p","7. Reserve in the cold and you're ready to eat."]],"date":"4 March 2021","tags":["cooking","desserts","american","chocolate","cake","recipes"]},{"title":"Caipirinha Recipe","blocks":[["h4","Ingredients - 2 Drinks :"],["ul","Crushed Ice"],["ul","1 Lime"],["ul","2 Shots Cachaça (60mL)"],["ul","1 tsp Light Brown Sugar"],["ul","2 Mint Leaves"],["h4","Recipe:"],["p","1. First, let's break the ice. 🤣 If possible you can buy already crushed ice."],["p","2. In a shaker add the tsp of light brown sugar, the cachaça, and the lime (sliced into 8 pieces)."],["p","3. With a pestle, crush the lime slices, mixing everything very well."],["p","4. Add the mint leaves and then the crushed ice."],["p","5. Shake everything very well in the shaker and there you go! You now have 2 caipirinhas ready to serve!"],["p","6. Aren't they great?"]],"date":"13 March 2021","tags":["brazilian","recipes","cooking","drinks"]},{"title":"Caramel Egg Pudding Recipe","blocks":[["p","A freshly made pudding on the weekend can save an entire week of crazy work! 😅 We love to eat it very fresh, so if you want to as well take it to the fridge for about 4 hours, or make it the night before!"],["h4","Ingredients :"],["ul","4 Egg Yolks"],["ul","4 Eggs"],["ul","12 tbsp Granulated Sugar"],["ul","1L Milk"],["ul","¼ Cup Port Wine"],["ul","2 tbsp Cornstarch"],["ul","4 tbsp Granulated Sugar"],["ul","Lemon zest"],["h4","Recipe:"],["p","1. Place the 4 eggs and 4 yolks in a bowl and wishk lightly."],["p","2. Add the sugar and wishk again."],["p","3. In a glass pour 200mL of milk and dissolve the cornstarch."],["p","4. Then add the glass of milk with cornstarch, the 800mL of milk left, the port wine and lemon zest."],["p","5. In a saucepan put sugar to make caramel. After obtaining that point, pour the preparation in a pudding pan and grease the sides with the caramel."],["p","6. Pour the pudding mixture into the pan and close the pan."],["p","7. Fill a pan with water and place the pan with the pudding filling inside to bake the pudding in a water bath."],["p","8. Leave the pudding to cook for 45 minutes in a water bath in the stove."],["p","9. After boiling, let it cool slightly and unmold in a deep dish, due to the caramel of the pudding."]],"date":"25 September 2020","tags":["cooking","desserts","portuguese","recipes"]},{"title":"Caramelized Almond Tart Recipe","blocks":[["p","In bakeries you'll find this dessert in small portions, but for you, we made a big one! As always this is super easy, and the ingredients are already in your home, maybe you'll have to buy just the almonds!"],["p","We prefer to use shredded almonds, but you can use sliced ones too!"],["p","Be careful with the filling, don't let it get too dark brown on the stove! Otherwise, it will burn in the oven!"],["p","And don't forget to have fun!"],["h4","Ingredients - Crust :"],["ul","150g Unsalted Butter"],["ul","1 Egg"],["ul","125g Granulated Sugar"],["ul","250g Wheat Flour"],["ul","30mL Milk"],["h4","Ingredients - Filling :"],["ul","100g Unsalted Butter"],["ul","100g Granulated Sugar"],["ul","50mL Milk"],["ul","200g Almond"],["ul","Butter (to grease the pan)"],["h4","Recipe:"],["p","1. First we will make the crust, put the melted butter in a bowl mixing it with sugar, then add the egg, milk and mix everything very well."],["p","2. Add the wheat flour until you get a very consistent dough, but very moist as well."],["p","3. Take a tart pan and butter it and then pour the dough. With your fingers form the shape of the tart crust."],["p","4. Bake in the oven at 180ºC | 356ºF for 15-20min."],["p","5. After removing the crust from the oven, it is time to make the filling, in a saucepan, put the sugar, milk, butter, and almonds, for 10 minutes until it gains a slight brown color, very very light brown color."],["p","6. Remove the filling from the stove and pour it over the pie crust."],["p","7. Spread the almonds very well and take it to the oven again."],["p","8. For 20-25min at 180ºC | 356ºF or until the edges start to turn dark brown."]],"date":"3 December 2020","tags":["recipes","cooking","portuguese","desserts"]},{"title":"Caramelized Popcorn with M&Ms Recipe","blocks":[["p","Here we love some French Comedy movies (Richie) and Suspense/Thriller (Andrew) 😍 And sometimes it even takes a game of Rock, Paper, Scissors to decide! But a date is always a good thing to do in a relationship! It keeps the flame alive!"],["h4","Ingredients :"],["ul","½ Cup Popping Corn"],["ul","2 tbsp Vegetable Oil"],["ul","2 tbsp Water"],["ul","4 tbsp Granulated Sugar"],["ul","1 Cup M&Ms"],["h4","Recipe:"],["p","1. In a pan add oil, sugar, and corn."],["p","2. Bring the pan to high heat and stir slowly until the liquid evaporates and the popping corn starts to caramelize."],["p","3. As soon as the first popping corn starts popping turn the heat to medium and cover the pan."],["p","4. Shake the pan vigorously every 10 seconds, and put it back on the fire, so that the caramel does not roast. Until there is no more corn to burst."],["p","5. Place the popcorn in a glass or ceramic bowl and eat! I love to add M&Ms, chocolate and popcorn create a wonderful fusion!"],["p","6. Enjoy your movie and share it with us!"]],"date":"7 September 2020","tags":["recipes","chocolate","cooking","desserts"]},{"title":"Cheese Sticks Recipe","blocks":[["p","Yes, it's true! We are addicted to cheese! ahaha and we love to eat it at any time!"],["p","So this time we made a very delicious appetizer, that you can make with three types of cheese! We only say these three because are the ones that we tried!"],["p","The Emmental ones are our favorites and you can add some dipping sauce to enjoy them even more!"],["p","Hope you love them as much as we do! 🥰"],["h4","Ingredients :"],["ul","250g Emmental Cheese (mozzarella or gouda)"],["ul","2 Eggs"],["ul","200g breadcrumbs"],["ul","1 tsp salt"],["ul","1 tbsp parsley"],["ul","1 tbsp 5 peppercorns mill"],["ul","Vegetable Oil to fry"],["h4","Recipe:"],["p","1. Take the cheese bar and slice it into strips."],["p","2. Beat the eggs in a bowl."],["p","3. In another bowl add the breadcrumbs, salt, parsley, and the 5 peppercorns mill."],["p","4. Pass the cheese strips through the eggs and then through the breadcrumbs, and then again through the eggs and then through the breadcrumbs."],["p","6. After breading all the cheese strips, place them in the freezer for 1h."],["p","7. Time to fry them! Put vegetable oil in a frying pan and wait for it to be very hot."],["p","8. Fry the cheese strips until golden brown!"],["p","9. Eat them warm, while the cheese is still well melted!"]],"date":"5 December 2020","tags":["cooking","appetizers","american","recipes"]},{"title":"Cheesy Nachos Recipe","blocks":[["p","Can you handle a spicy dish? We love spicy food, and if you add cheese you will conquer our hearts! this Nachos recipe is very very simple, but will be your favorite comfort food! We promise! 🥰"],["h4","Ingredients :"],["ul","200g Tortilla Chips"],["ul","Cheese Sauce (ingredients below)"],["ul","1 Jalapeño"],["ul","1 Chilli"],["ul","2 Slices of Leek"],["h4","Ingredients - Cheese Sauce :"],["ul","180g grated cheese (cheddar, gouda, emmental, cured cheese)"],["ul","2 tbsp Butter"],["ul","2 tbsp All-purpose Flour"],["ul","1 Cup Milk"],["ul","Salt"],["ul","Paprika"],["h4","Recipe:"],["p","1. Let's start with the cheese sauce!"],["p","2. In a pan place the butter to melt, as soon as it is melted, add the flour and stir well to form a paste."],["p","3. Then add the milk and stir until it thickens."],["p","4. As soon as the milk thickens, add the grated cheese, stirring well to melt and season with salt and paprika."],["p","5. If you want a more liquid sauce, just add a little more milk and season again."],["p","6. On a plate, place the tortillas chips with cheese, slices of leek, jalapeño and chili, more tortillas chips, and again the same ingredients."],["p","7. If you like you can eat your dish or if you prefer you can take it to the oven."],["p","8. In the oven at 180ºC | 356ºF for about 10min, this away the species will be more strong and the cheese will obtain a more crunch texture!"],["p","9. From 1 to 10, how much spicy do you love? 🌶"]],"date":"5 November 2020","tags":["recipes","spicy","appetizers","mexican","cooking"]},{"title":"Chicken Quiche Recipe","blocks":[["p","If you have a lot of leftovers and don't like to waste your food (and money) doing a quiche is the best thing you can do!"],["p","You can do it with tuna, chicken, beef, spinach, everything goes well with this! Give it a try!"],["h4","Ingredients :"],["ul","1 Shortcrust Pastry"],["ul","5 Eggs"],["ul","200mL Cream"],["ul","200g Chicken Breast Leftovers"],["ul","150g Mozzarella Cheese"],["ul","5 Mushrooms"],["ul","Black Pepper"],["ul","Salt"],["ul","Oregano"],["h4","Recipe:"],["p","1. First, shred the chicken breast leftovers with the help of two forks."],["p","2. In a round tart pan, place the shortcrust pastry and pinche the bottom with a fork."],["p","3. Place the shredded chicken and the sliced mushrooms."],["p","4. In a bowl, mix the eggs with the cream and season it at taste with oregano, salt, and black pepper."],["p","5. Distribute the mixture on top of the filling and cover everything with mozzarella cheese."],["p","6. Take it to the oven at 180 Celsius degrees | 356 Fahrenheit degrees for about 20-25minutos."]],"date":"8 October 2020","tags":["recipes","meat","main dishes","cooking"]},{"title":"Chicken Stroganoff Recipe","blocks":[["p","A dish that allows a little creativity, with cream, without cream, with broccoli, with carrot, everything is possible to create! If you don't know what to cook but you have a little of everything, try this recipe! I promise it will taste like home! 😊"],["h4","Ingredients :"],["ul","3 Chicken Breasts"],["ul","300gFresh Mushrooms"],["ul","200mL Cream"],["ul","300g Rice"],["ul","1 tsp Nutmeg"],["ul","Lemon Juice"],["ul","Salt"],["ul","Black Pepper"],["ul","Olive Oil"],["h4","Recipe:"],["p","1. In a pan, place rice with salt and olive oil to fry over low heat, then add boiling water. Increase the heat and stir 3 in 3 minutes so that the rice does not stick."],["p","2. When the water starts to disappear, set the heat to a minimum and close the pan for 15 minutes. The rice will get dry and is ready to eat."],["p","3. In a large skillet, add olive oil, salt, black pepper, and lemon juice to sauté the chicken, cut into strips or cubes."],["p","4. Then add the freshly sliced mushrooms and let it sauté."],["p","5. When ready, add the cream and nutmeg. It can serve!"]],"date":"23 September 2020","tags":["recipes","cooking","main dishes","meat"]},{"title":"Chinese Almond Chicken with Yangzhou Fried Rice Recipe","blocks":[["p","This is the main dish of our homemade Chinese dinner! The almonds with this chicken sauce are so unbelievable! I could eat this for the rest of my entire life! 🤤 As I'm writing this posting I'm getting hungry for some more! Check below the full menu! 😅 Hope you love it as much as we did! ❣️"],["p","Appetizer - Chinese Dumplings - Gyoza"],["p","Main Dish - Chinese Almond Chicken with Yangzhou Fried Rice"],["p","Dessert - Chinese Mango Pudim"],["h4","Ingredients :"],["ul","750g Chicken Breast"],["ul","50mL White Wine"],["ul","200g Carrots"],["ul","200g Canned Bamboo Shoots"],["ul","130g Leek"],["ul","1 Purple Onion"],["ul","150g Roasted Almonds"],["ul","3 tbsp Soy Sauce"],["ul","½ tsp Glutamate Powder"],["ul","½ tsp Sesame Oil"],["ul","1 tbsp Rice Flour"],["ul","¼ Cup Vegetable Oil"],["ul","Water"],["ul","Salt"],["ul","1 Cup Rice"],["ul","2 Cups Water"],["ul","50g Peas"],["ul","50g Diced Ham"],["ul","2 Eggs"],["ul","Salt"],["h4","Recipe:"],["p","1. To start, and to make it easier, we have to prepare the \"Mise en Place\" - the setup required before cooking."],["p","2. First cut the chicken into cubes and put them in a bowl to season with white wine, soy sauce, glutamate, sesame oil, and rice flour."],["p","3. Then let's slice the vegetable, the carrots into cubes and the onion and peek into very thin slices."],["p","4. If you don't have roasted almonds, it's okay, you can put them in the oven for about 15min until they get a very nice golden/light brown color."],["p","5. Reserve the almonds and chicken aside. In a pan put the sliced vegetables and cover them with water and season them with salt until they start boiling."],["p","6. In a big wok pan (or big frying pan) add vegetable oil and wait until it gets hot, then add the seasoned chicken to fast fry them."],["p","7. Drain the water from the boiled vegetables (but save the water for later, it contains flavor) and add the vegetables in the wok pan and stir the vegetables and the fried chicken for 5min. And if you need more sauce add slowly the vegetable water that you saved."],["p","8. While the sauce thickens a little in low heat you can start the rice!"],["p","9. In a pan add olive oil, salt, and rice and fry it for 2min until adding water. After the water disappears cover the pan and reduce the heat to medium for 10min!"],["p","10. In a frying pan add diced ham, peas, and 2 roughly scramble eggs and stir. Then add the cooked rice and stir again until it gets dry."],["p","11. You are now ready to taste this marvelous dinner! The chicken sauce is so good! ❤️ 😊"]],"date":"9 September 2020","tags":["recipes","cooking","main dishes","chinese","meat"]},{"title":"Chinese Dumplings - Gyoza Recipe","blocks":[["p","We love to go out to dinner, but we love more to try to recreate the dishes we try when we go out! So this time we had an entire Chinese Dinner, from Appetizer to Desser! And we love so much to cook with different ingredients than the Portuguese ones, we think gastronomy is one of the best ways to travel, through flavors! 😍😍😍"],["p","Appetizer - Chinese Dumplings - Gyoza"],["p","Main Dish - Chinese Almond Chicken with Yangzhou Fried Rice"],["p","Dessert - Chinese Mango Pudim"],["h4","Ingredients - Dough :"],["ul","400g Wheat Flour (2.5 Cups)"],["ul","1g Salt (¼ tsp)"],["ul","250mL Water (1 Cup)"],["h4","Recipe - Dough:"],["p","1. In a glass bowl add flour, salt and start adding water slowly."],["p","2. With your hands, start kneading the dough until it gets a soft texture."],["p","3. Let it rest for 1 hour in a warm place covered with a kitchen cloth."],["p","4. After 1 hour, make a few strips of dough and cut them into small pieces to start stretching with a rolling pin, into small circles."],["h4","Ingredients - Filling :"],["ul","500g Minced Beef"],["ul","40g Coriander"],["ul","1 tbsp Soy Sauce (15mL)"],["ul","¼ Cup Vegetable Oil (60mL)"],["ul","¼ tsp Black Pepper (1g)"],["ul","¼ tsp 5 Spice Powder (1g)"],["ul","½ tsp Salt (4g)"],["ul","1 tsp Sesame Oil"],["h4","Recipe - Filling:"],["p","1. In a glass bowl add beef, chopped coriander, soy sauce, black pepper, 5 spice powder, salt, and sesame oil. Mix them all very well."],["p","2. In a pan put the vegetable oil and when it starts almost boiling add it to the glass bowl with the prepared beef and stir to fry the filling."],["p","3. Filling ready, the next step is to make the dumplings and cook them!"],["h4","Ingredients :"],["ul","1 tbsp Vegetable Oil to fry (15mL)"],["ul","¼ Cup Warm Water to boil (60mL)"],["h4","Recipe:"],["p","1. With a slice of dough put a tablespoon of the filling and start closing it with your fingers, if the dough is to dry you can add some water in the tip of your fingers."],["p","2. In a frying pan put vegetable oil and place the dumplings to fry the bottom for about 1-2min and then add the warm water and cover the pan for about 5-6min."],["p","3. You are ready to enjoy this delicacy! But don't forget to dip them in soy sauce!"]],"date":"8 September 2020","tags":["meat","chinese","cooking","appetizers","recipes"]},{"title":"Chinese Fried Chicken with Sticky Sauce Recipe","blocks":[["p","We love all kinds of food, but Italian and Chinese are definitely our favorites! Not considering Portuguese of course! This dish looks much more complicated than it actually is!"],["p","Is a combination of very easy steps that you can make in the blink of an eye!"],["p","Promise! Show us how yours look like!"],["h4","Ingredients :"],["ul","3 Chicken Breasts"],["ul","4 tbsp Cornstarch"],["ul","2 Eggs"],["ul","10 tbsp All-Purpose flour"],["ul","1 tsp Salt"],["ul","1 tsp Black Pepper"],["ul","4 tsp Paprika"],["ul","5 tbsp Vegetable Oil"],["ul","Ingredients - Sauce:"],["ul","1 tbsp Sesame Oil"],["ul","1 tbsp Rice Vinegar"],["ul","2 tbsp Honey"],["ul","3 tbsp Ketchup"],["ul","2 tbsp Brown Sugar"],["ul","4 tbsp Soy Sauce"],["ul","Ingredients - To Serve:"],["ul","1 Cup White Rice"],["ul","Olive Oil"],["ul","Salt"],["ul","Sesame Seeds"],["ul","Sliced Chives"],["h4","Recipe:"],["p","1. First, let's make white rice. In a pan place the rice, a pinch of salt, and a drizzle of olive oil. With the heat to the maximum add 2 cups of hot water and go stirring from time to time."],["p","2. When the water starts to disappear, cover the rice and place the stove on medium-low heat for 15 minutes. And the rice is ready."],["p","3. In a bowl add sesame oil, rice vinegar, honey, ketchup, brown sugar, and soy sauce. This preparation will be used at the end to create the sticky sauce."],["p","4. In another bowl place the flour, salt, black pepper, and paprika."],["p","5. Cut the chicken breasts into cubes and pass them through cornstarch, then egg, and finally in the previously seasoned flour."],["p","6. After that, is time to fry the chicken."],["p","7. In a wok pan or ordinary pan, place the 5 tbsp of vegetable oil and let it get very hot."],["p","8. After checking that the vegetable oil is ready to fry, place the breaded chicken for frying. Depending on the dimensions of your utensils, you can fry everything at once or twice. Fry the chicken for 15 to 20 minutes."],["p","9. Then remove the chicken to a plate with a paper towel to absorb the fat. Taking advantage of the flavor left in the frying wok pan let's add the sauce preparation to it."],["p","10. Let the sauce start to boil and thicken. After thickening it is ready and you can add the fried chicken back to the wok pan to wrap."],["p","11. And that's it, now it's time to plate!"],["p","12. On a plate, place the white rice with the fried chicken on top and full of sauce, add sesame seeds, and cut some chives."]],"date":"23 October 2020","tags":["cooking","main dishes","chinese","meat","recipes"]},{"title":"Chinese Mango Pudim Recipe","blocks":[["p","Every good dinner has to end with a nice dessert, since the dinner had a lot of flavors we decide to make a fresh and kind of sweet dessert, to balance the entire meal! Hope you enjoyed the recipes as much as we did!"],["p","Appetizer - Chinese Dumplings - Gyoza"],["p","Main Dish - Chinese Almond Chicken with Yangzhou Fried Rice"],["p","Dessert - Chinese Mango Pudim"],["h4","Ingredients :"],["ul","300mL Mango Pulp"],["ul","1 Cup Mango Cubes"],["ul","2 tsp Neutral Gelatin"],["ul","100mL Cold Water"],["ul","100mL Warm Water (NOT HOT)"],["ul","⅓ Cup Coconut Milk"],["ul","⅓ Cup Coconut Milk to Garnish"],["ul","Lemon or Honey to balance"],["h4","Recipe:"],["p","1. First, we have to hydrate the gelatin, put it in a glass with 100mL of cold water for 10min."],["p","2. In a pan add the mango pulp and let it boil for 2min."],["p","3. In the glass of hydrated gelatin add 100mL of warm water to dissolve it, be careful, the water cannot be very hot, or it will deactivate the properties of the gelatin."],["p","4. Add the gelatin to the mango pulp, add coconut milk and the mango cubes."],["p","5. Before dividing into cups or bowls, taste it and add lemon or honey to balance the sweetness of the mango, and let it sit on the fridge for at least 4 hours. Then you can garnish it with coconut milk and let it rest for another 20min on the fridge before \"service\". 😂"]],"date":"10 September 2020","tags":["recipes","cooking","desserts","chinese"]},{"title":"Chocolate Cake with Shavers Recipe","blocks":[["p","Chocolate is Life! And a chocolate cake cannot be missing from any blog! It works anytime, even in the middle of the week when we are craving and we don't know what fatness to eat!"],["h4","Ingredients:"],["ul","6 Eggs"],["ul","2 Cups Flour"],["ul","2 Cups Granulated Sugar"],["ul","1 Cup Milk"],["ul","6 tbsp Chocolate Powder"],["ul","1 tsp Baking Powder"],["ul","Butter to Grease"],["ul","4 tbsp Chocolate Powder"],["ul","1 tbsp Butter"],["ul","1 Cup Milk"],["ul","1 Chocolate Bar (200g)"],["h4","Recipe:"],["p","1. Turn the oven on at 180 Celsius degrees | 356 Fahrenheit degrees."],["p","2. Separate the egg yolks from the whites and beat the egg whites."],["p","3. Mix the egg yolks with the sugar until a uniform mixture is obtained."],["p","4. In the mixture, add the flour, milk, chocolate powder, and the baking powder."],["p","5. Then, whisk the egg whites together with a wooden spoon."],["p","6. Grease a circular shape cake pan with butter and bake it for 40min."],["p","7. For the topping, put the melting butter in a pan and add the milk and chocolate powder, stirring until it starts to thicken."],["p","8. After unmolding the cake, fill with the icing and let it cool."],["p","9. After chilling, with the help of a peeler, create shavings from the chocolate bar on the cake."],["p","This is a very pretty and delicious cake to eat at home or take it to a dinner party with friends! Everyone will get impressed!"]],"date":"13 August 2020","tags":["recipes","cake","chocolate","desserts","cooking"]},{"title":"Chocolate Chip Cookies Recipe","blocks":[["p","There is nothing better than chocolate, cookies, and milk. These Chocolate Chip Cookies are loved by kids and adults, it's a party for everyone. This recipe is the meaning of love! And I love to do it, it's very simple and can be done in just one second! I love to do it on Sundays afternoon, to watch a movie or to read a book.... and a good thing is that it doesn't leave any crumbs! So it's perfect for children!"],["h4","Ingredients:"],["ul","Oven at 180 Celsius degrees | 356 Fahrenheat degrees"],["ul","200g Brown Sugar"],["ul","180g Melted Butter"],["ul","2 tsp Vanilla"],["ul","2 Eggs"],["ul","2 tbsp Milk"],["ul","400g Flour"],["ul","2 tsp Baking Soda or Baking Powder"],["ul","340g Dark Chocolate"],["ul","15-20 minutes in the oven"],["h4","Recipe:"],["p","1. First, preheat the oven to the indicated temperature."],["p","2. In the mixer, add the brown sugar and the melted butter. Mix them until a lump-free consistency is obtained."],["p","3. Add the vanilla, the eggs, and the milk, and mix again."],["p","4. Then, sift the flour and the baking powder and add it to the dough."],["p","5. Add the shredded chocolate, and the dough is ready!"],["p","6. In a tray place, a sheet of buttered parchment paper and with the help of 2tablespoons start forming small portions of the dough."],["p","7. Take it to the oven for about 15-20 minutes until they reach a golden crispy color!"],["p","8. And you are done! Enjoy!"]],"date":"4 August 2020","tags":["american","recipes","cookies","cooking","breakfast","desserts","chocolate"]},{"title":"Chocolate Marble Cake Recipe","blocks":[["p","There is no cake more beautiful than the slice of a Marble Cake! A design that never looks the same, unique every time it is cooked!"],["p","It's fun to make and even funnier to look at! And every bite is a mix of flavors! Very nice to drink on a rainy afternoon with tea!"],["h4","Ingredients :"],["ul","500g Granulated Sugar"],["ul","500g Flour"],["ul","6 Eggs"],["ul","1 Cup Milk"],["ul","1 tsp Baking Powder"],["ul","50g Chocolate Powder"],["ul","150g Butter"],["ul","Butter to Grease"],["h4","Recipe:"],["p","1. Turn on the oven at 180 Celsius degrees | 356 Fahrenheit degrees."],["p","2. Separate the egg yolks from the whites and whisk the egg whites."],["p","3. Mix the sugar with the butter, at room temperature, and then add the egg yolks until a homogeneous mixture is obtained."],["p","4. Add milk, flour, and baking powder to the mixture. Once well wrapped, add the egg whites very gently."],["p","5. Divide the cake mixture into two bowls and add chocolate powder to one of them and stir well to break up chocolate lumps."],["p","6. Butter a circular shape pan with a hole in the center and distribute the two doughs irregularly, after placing the dough you can mix then nicely with a toothpick to create a marble-like texture inside."],["p","7. Bake in the oven for 40min or until the toothpick comes out dry, without any evidence of cake to be baked."]],"date":"21 September 2020","tags":["recipes","chocolate","cake","cooking","breakfast","desserts"]},{"title":"Chocolate Salami with Portuguese Biscuit Recipe","blocks":[["p","A classic of any Portuguese house, which brings together two of the favorite ingredients here at home: chocolate and the Portuguese biscuit. It is done in 15 minutes and eaten in a few hours, so delicious it is."],["h4","Ingredients:"],["ul","2 Eggs"],["ul","50g Butter"],["ul","125g Chocolate Powder"],["ul","1 Packet and Half of Portuguese Biscuit (300 gr)"],["ul","5 tbsp Granulated Sugar"],["ul","Aluminum Foil"],["h4","Recipe:"],["p","1. Mix the two eggs with a fork and add the melted butter."],["p","2. Add the chocolate powder and the sugar to the previous preparation."],["p","3. Place the biscuit in a plastic bag and break the biscuit into small and rough pieces with a kitchen hammer."],["p","4. Add the biscuit to the preparation, wrapping very well."],["p","5. Prepare the aluminum foil and pour the preparation to create a roll."],["p","6. Let it sit in the fridge overnight and it's ready to serve."]],"date":"20 August 2020","tags":["chocolate","portuguese","desserts","cooking","cookies","recipes"]},{"title":"Chocolate Zucchini Cake Recipe","blocks":[["p","This recipe is the one to impress! Everyone is going to make side-eyes to your cake! But let them try it! Just let them!"],["p","This is the moistest chocolate cake we ever tried! It's super-rich in flavor and will win everyone at the table!"],["p","Trust and Believe!"],["h4","Ingredients :"],["ul","4 Eggs"],["ul","650g Zucchini"],["ul","350g Granulated Sugar"],["ul","30g Light Brown Sugar"],["ul","⅓ Cup Coconut Oil"],["ul","1 tsp Vanilla Flavor"],["ul","250g Flour"],["ul","2 tsp Baking Soda"],["ul","1tsp Baking Powder"],["ul","75g Cocoa Powder (+ to grease the pan)"],["ul","½ tbsp Espresso Powder"],["ul","Butter (to grease the pan)"],["h4","Recipe:"],["p","1. Preheat the oven at 180ºC | 356ºF."],["p","2. Grate the Zucchini."],["p","3. Place the Zucchini in a wide bowl, and add the sugars, eggs and beat well. Add the vanilla, coffee, coconut oil and beat well for a few minutes."],["p","4. Add the sifted flour, cocoa powder, baking soda, baking powder and mix well until a homogeneous mixture is obtained."],["p","5. Grease a cake pan with butter and then with cocoa powder."],["p","6. Bake for about 50 min."]],"date":"26 January 2021","tags":["recipes","cooking","desserts","chocolate","cake"]},{"title":"Christmas Morning Cinnamon Rolls Recipe","blocks":[["h4","Ingredients - Dough :"],["ul","450g Flour"],["ul","1 tsp Salt"],["ul","1 tsp Cinnamon"],["ul","1 Pinch Grounded Nutmeg"],["ul","50g Light Brown Sugar"],["ul","5g Dry Bakers Yeast (or 15g fresh bakers yeast)"],["ul","120g Sour Cream"],["ul","120mL Milk"],["ul","1tbsp Vanilla"],["ul","1 Large Egg"],["ul","90g Butter"],["ul","50g Granulated Sugar"],["h4","Ingredients - Filling :"],["ul","4 tbsp Light Brown Sugar"],["ul","4 tbsp Cinnamon"],["ul","80g Butter (at room temperature)"],["h4","Ingredients - Topping :"],["ul","30g Butter"],["ul","100g Cream Cheese"],["ul","1 Pinch Salt"],["ul","1 tsp Lemon Juice"],["ul","1 t
