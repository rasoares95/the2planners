violet, like diluted wine.”"],["p","Henry James"],["p","Where to go? What to see? What to eat? In this city guide, we present you the route we did in the Summer of 2019, a trip we absolutely loved and think its a must for young couples."],["p","We only dedicated one and a half days to visit this magnificent city, as one of the mornings was spent exploring Pisa. From all the cities we visited on our trip, this is the one you should make an effort to expand the time as much as you can, so you can take advantage of all the things the city as to offer. Here you'll find a quite extensive city guide you can use to visit Florence in 2 days (or in one and a half-day)."],["tip","Tip 1: Keep in mind that some of the biggest museums in Florence, including the Uffizi, Galleria dell’Accademia, and the Palazzo Pitti are closed on Monday, so manage your days according to this information."],["h3","Day 1 - Half a Day Activities"],["p","🔺 Day 1 🔸Day 2"],["h3","1. Piazza and Church of Santa Maria Novella"],["h4","€: Paid Entrance | Time: 30 min | ★★★✩✩"],["p","The square and church of Santa Maria Novella are located right in front of the main railway station. During our stay, it was probably the monument we “visited” the most, as our hotel was only a few minutes away."],["p","The Church has a similar design to both the Duomo and the Basilica of Santa Croce, with polychrome and white marble that create a striking and mesmerizing front facade, in a typically renaissance architecture style. Don’t simply admire the exterior space, but take look a the interior too, with some of the city's finest frescoes. In our visit, we decided not to spend our time visiting the inside space of the church, as we had a pretty narrow schedule."],["h3","2. Piazza San Lorenzo, Basilica San Lorenzo & Medici Chapels"],["p","All rights reserved to Stefan Bauer (left) and Wikipedia (right)"],["h4","€: Paid Entrance | Time: 60 min | ★★★★✩"],["p","The Basilica di San Lorenzo (or Basilica of St Lawrence) is one of the largest churches in Florence, located at the center of the city, in the square with the same name, and not far away from the dome. The church is the home to many important “firsts” in the world of art and architecture. The Medici family, probably the world's greatest patrons of the arts that ruled Florence for many years during the Renaissance, brought together the masters of their age to build a church complex for their own worship. There is so much to see and explore at the Basilica, you can enjoy a pretty good though the prestigious works of art and architecture. As you tour the church (the Old Sacristy, the New Sacristy, the Princes' Chapel and the Laurenziana Library), you'll find the works of other Renaissance masters"],["p","San Lorenzo is the burial place of the Medici family, in what is called the Medici Chapels, where you'll find beautiful marble statues by Michelangelo in the New Sacristy."],["h3","3. San Lorenzo Market"],["h4","€: Free| Time: 60 min | ★★★★✩"],["p","The market is constituted of two separate markets: an indoor market, known at the Mercato Centrale, where you can taste some delicious Tuscany food; and the outdoor section, where you can find leather products, clothing, and many souvenirs. Both markets are a great addition to your sightseeing, and we recommend you to try some of the delicious food they sell there. We ate some of the most memorable Italian food (pasta, obviously, as we are addicted to it…) in one of the numerous stands in the central market (the one that sells pasta to cook at home also sells ready to eat pasta - super cheap and delicious), so we recommend you to take some rest doing the same."],["h3","4. Galleria dell'Accademia"],["h4","€: Paid Entrance | Time: 30 min | ★★✩✩✩"],["p","Accademia Gallery houses Michelangelo's original marble statue called David, standing tall at its center. The Gallery is fairly small, and you will spend no more than an hour inside unless you’re an enormous art buff."],["p","We have to say, we were a little disappointed with the gallery, but the enormous and wonderful statue of David turn it into an experience you won’t forget."],["p","The gallery is one of the most visited places in Florence, so we highly recommend you to buy your tikes in advance. You can save time waiting in the long lines at both these outstanding art museums with a Skip the Line tickets."],["h3","5. Piazza di Santa Croce & Church of Santa Croce"],["p","All rights reserved to Carlo Di Pasquale"],["h4","€: Paid Entrance | Time: 60 min | ★★★✩✩"],["p","Sitting in the Piazza di Santa Croce, the church takes the center position and frames the square perfectly. The church of Santa Croce features a front facade that includes pink, green, and red marble polychrome panels contrasted with polished white stone."],["p","Santa Croce actually has a more ornate interior than the Duomo, home to the tombs of some of the most influential Renaissance artists, including those of Dante and Galileo."],["h3","6. Piazzale Michelangelo"],["p","€: Free | Time: Sunset | ★★★★★"],["p","Do you want to finish your day in a place that offers you the best view of Florence (and of the Cathedral)? Then this is the place. Located on the South banks of the River Arno, the Piazzale sits high on a hill, his terrace above the city is an obligatory stop for any visitor. The best time to enjoy it in relative peace in the late afternoon, especially at sunset. Only from this terrace can you fully appreciate the city center and how the monuments are disposed of."],["p","The view from the Piazza is unique and you can truly see Florence in all its glory. We highly recommend you to finish your day here, while you eat a piece of bread with pesto and some wine (as we did), a pure 5-star meal with the most beautiful vision of Florence you can imagine."],["h3","7. Other places if you have time"],["p","Have you finished the first day but have free time to explore some more? Here are some options for places and monuments you can to try!"],["h3","Palazzo Pitti"],["p","All rights reserved to BeatMyPath"],["h4","€: Paid Entrance"],["p","This fine example of Renaissance architecture houses some of the most important museums in Florence: the Palatine Gallery, the Royal Apartments, the Silver Museum or Museo degli Argenti, the Gallery of Modern Art, the Porcelain Museum, and the Museum of Costume and Fashion. You can spend an entire day seeing all Pitti Palace."],["p","Note: The museums have created a single ticket and made opening times the same for all museums, to simplify the itineraries of all visitors."],["h3","Boboli Gardens"],["p","All rights reserved to Musement"],["h4","€: Paid Entrance"],["p","Behind and connected to the palace are the Boboli Gardens. Covering an area of 45,000 square meters, the gardens are some of the largest in Florence and are a true delight to walk through. This is the perfect place to escape the city, though all the myriad of different sections, fountains, obelisks, and worldly trees, plants, and flowers."],["h3","Day 2 - One day full of experiences..."],["h3","1 . Piazza del Duomo & Cathedral of Santa Maria del Fiore"],["h4","€: Paid Entrance | Time: 120 min | ★★★★★"],["p","The duomo is possibly (most certainly, we dare to say) the most celebrated cathedral in the world! It is simply the jewel of the city. It is impossible to miss it! Literally, as it is so enormous and located in the center of the old city. The exterior and front facade of the Cathedral, covered in white marble and red, pink, and green polychrome designs, is breathtaking, and the perfect background for a picture of the city."],["p","The Duomo complex is formed out of the Piazza Duomo and a group of buildings:"],["ul","the Duomo (or Cathedral of Santa Maria del Fiore , with its famous cupola )"],["ul","he Baptistery"],["ul","the Giotto’s bell tower (when you climb the bell tower, you have an amazing view of the cupola itself!)"],["ul","the Church of Santa Reparata"],["ul","the Museo dell’Opera del Duomo"],["p","Begin by walking around the square to admire the intricately inlaid marble exteriors, then step inside each one of the buildings we describe to look more closely at the stained glass works of art that greet you wherever you look."],["p","To avoid waiting in long lines buy a ticket, consider buying the tickets online."],["tip","Tip: Visit the piazza at night. The square is almost empty, and it’s the best time to admire the artwork!"],["h3","2 . Piazza della Repubblica"],["h4","€: Free | Time: 120 min | ★★★✩✩"],["p","This piazza is home to Florence’s beautiful carousel. Be sure to stop and take a photo."],["h3","3 . Via dei Calzaiuoli & Church of Orsanmichele"],["h4","€: Paid Entrance | Time: 60 min | ★★★✩✩"],["p","Next, continue your tour by walking via dei Calzaiuoli (the street by the bell tower). On your way along this classic street, you can admire the square architectural structure of the church of Orsanmichele and the many statues that adorn its sides by great artists."],["h3","4 . Fontana del Porcellino"],["p","€: Free | Time: 10 min | ★★✩✩✩"],["p","The Fontana del Porcellino consists of a large bronze boar. Don’t be surprised with the extra shiny nose: the legend says that if you rub his nose, you’ll be guaranteed to come back to Florence one day!"],["h3","5 . Piazza della Signoria & Palazzo Vecchio"],["p","All rights reserved to Travel Notes"],["p","€: Free | Time: 30 min | ★★★★✩"],["p","Secondly, only to the Piazza del Duomo, the Piazza della Signoria is just as important and contains a myriad of buildings and classical art."],["p","Piazza della Signoria, the 2nd most important square of Florence, represented the center of Florence's political power for centuries. It reunites a myriad of buildings and classical art:"],["ul","the main structure of the Piazza is the magnificent Palazzo Vecchio , with its huge clock tower and fantastic statues of David and Hercules."],["ul","the wonderful fountain of Neptune , on the left of the palace;"],["ul","the Loggia dei Lanzi , on the right of the palace, which contains some beautiful Renaissance sculptures;"],["ul","the grand statue of Cosimo Medici, near the fountain of Neptune."],["p","All rights reserved to Luís Boucalt"],["p","Palazzo Vecchio: €: Paid entrance | Time: 80 min | ★★★★✩"],["p","You can visit the interior of the Palace Vecchio and see the originally decorated rooms, such as The Hercules Room and The Room of Cybele. To the right of Palazzo Vecchio, you can admire the Loggia dei Lanzi, where wonderful statues are on display."],["h3","6 . The Uffizi Gallery"],["p","All rights reserved to exclusiveflorencetours"],["p","€: Paid entrance | Time: 80 min | ★★★★✩"],["p","Right next door to the Piazza della Signoria, you have the Uffizi Palace and Gallery, considered one of the most important Italian museums in the world. If you don’t have time to visit the museum (or simply can’t waste de money on the ticket), enjoy the exterior view as the vast building, stretching along with the river building, is a marvel for itself. If you decide to take a look inside, there you can find an immense collection of Renaissance Art from several artists such as Da Vinci, Titian, and Raphael."],["h3","7. Ponte Vecchio"],["p","€: Free | Time: 40 min | ★★★★★"],["p","The Ponte Vecchio is another recognized icon of Florence you can't miss. It is certainly one of the city's prettiest scenes. Walk onto this fantastic structure and look at the various shops and vendors. You will find jewelers, art dealers, and souvenir shops."],["tip","Tip: when coming back, cross the river via the Ponte Santa Trinita to get an amazing view of the Ponte Vecchio itself!"],["h3","Where to Sleep?"],["p","In Florence, we stayed at a very nice 2 Stars Hotel called Hotel Elite. The women that received us, Nadia, was amazing, super helpful, and spent time telling us what to visit and at what time to do it. She also recommended a super cheap and amazing restaurant!"],["h3","Where to Eat?"],["p","Following the suggestion of Nadia, we went to Trattoria il Contadino: we paid 15€ per person, which included wine, 2 main dishes, and dessert! Oh boy, this is your local homemade food for Italians, they were simple people, but very nice and the food was marvellous, one of the best places to eat!"],["p","If you want to know more about the complete trip, click here."]],"date":"3 September 2020","tags":["holidays","italy","florence","city guide","traveling","2 days trip","vacation","travel"]},{"title":"VENICE | City Guide - 1 day in Venice 🇮🇹","blocks":[["p","If you want to know more about the complete trip, click here."],["p","I will start this post with a conflict of interest statement: Venice is my absolute city in Europe I have visited so far! If you are visiting this fantastic city, hope you have such an amazing experience as I have in the few moments I had the opportunity to go there and learn something new between the channels."],["p","“It is the city of mirrors, the city of mirages, at once solid and liquid, at once air and stone.”"],["p","Erica Jon"],["p","As the capital of the Veneto Region of Northern Italy, Venice lies on 117 small islands that are connected by a series of bridges and separated by a network of canals. It is one of the most visited tourist destinations in Italy. Venice is a city surrounded by beauty and historical buildings. You have so much to see and walk when visiting Venice, you can have a hard time choosing what to see: from the wide variety of museums, churches, palaces and villas, to the famous islands of Murano and Burano, you can have a day full of experiences without any doubt."],["p","Where to go? What to see? What to eat? In this city guide, we present you the route we did in the Summer of 2019, a trip we absolutely loved and think its a must for young couples."],["tip","Tip 1: Transportation around Venice can be very expensive. This way, arriving in Venice, start your day buying the Vaporetto travel card ticket, the easiest and simplest way to travel between stops and islands. From the Chanel boats, you can also get a pretty stunning view of the city."],["h3","1. Ponte degli Scalzi & Grand Canal"],["h4","Time: 30 min | ★★★★✩"],["p","Venice has hundreds of canals (literally!), that connect the various islands that make up the city. The largest of those is the Grand Canal, that resembles a river and passes from one side of Venice to the other in a large S bend shape."],["p","Only four bridges span the grand canal. The Ponte degli Scalzi (literally, \"bridge of the barefoot\"), is one of only those four bridges, and will give you the best view to the Grand Canal."],["h3","2. Ponte di Rialto"],["h4","Time: 30 min | ★★★★ ★"],["p","This is the most iconic and breathtaking bridge you will find walking through Venice. Crossing the Ponte di Rialto, you will feel like you’re in a Hollywood movie."],["tip","Tip 2: On your way between places, you will find so many beautiful places to take some pictures you won't have enought poses to strike."],["h3","3. Piazza di San Marco"],["p","Three of Venice’s major sites are located in this undoubtedly most famous and visited square:"],["ul","the Basilica di San Marco;"],["ul","the Torre dell’Orologio;"],["ul","the Doge’s Palace."],["h4","Time: 90 min | ★★★★★"],["p","Take your tome to visit all the three monuments and maybe have a coffee or lunch in the few stores located around the piazza. Here, you can also enjoy to buy some souvenirs."],["h3","4. Basilica di Santa Maria della Salute"],["h4","Time: 60 min | ★★★★✩"],["p","Get ready to have a nice and long walk to the next destination: the Basilica di Santa Maria della Salute. This Basilica sits on the opposite side of the grand canal, but gives you a quite remarkable view of Venice."],["h3","5. Ride a Vaporetto through the Grand Canal"],["h4","Time: 60 min | ★★★★★"],["p","It’s time for you to take advantage of the Vaporetto ticket you bought. Take one of the boats that heads thought the grand canal to the Ponte degli Scalzi: you will love the trip!"],["h3","6. Venetian Islands (Murano, Burano and Torcello)"],["h4","Time: 60 min | ★★★✩✩"],["p","Get ready for a long journey sailing as you take the long trip to visit Murano, Burano and Torcello. You can visit all of the three, as all of them are connected by Vapporeto, however I you are on a narrow schedule, we recommend you to visit Murano, famous for its glass blowing factories that are established here, and Burano, that resembles a cute mini-replica of Venice."],["h3","7. The Bridge of Sighs"],["h4","Time: 15 min | ★★★★✩"],["p","The Bridge of Sighs, known as the Ponte dei Sospiri in Italian, passes over the Rio di Palazzo and connects the Dogi's Palace to the Prigioni, the prisons that were built across the canal in the late 16th century. It is one of the most famous bridges in the world. It is interesting to know where it’s name comes from: once convicts received their sentence, they had to cross this bridge to go from the interrogation rooms to the prison, so this was the last thing they saw before their incarceration, and many sighs could be heard as they walked through the bridge."],["h3","8. Venetian Ghetto ( Cannaregio)"],["h4","Time: 60 min | ★★★✩✩"],["p","Filled with numerous Jewish restaurants, a museum and synagogues, this area remains a fascinating source of culture and history, as it was the world’s first ghetto."],["p","If you want to know more about the complete trip, click here."]],"date":"5 October 2020","tags":["italy","holidays","city guide","traveling","venice","vacation","travel","1 day trip"]},{"title":"VERONA | City Guide - 1 day in Verona 🇮🇹","blocks":[["p","If you want to know more about the complete trip, click here."],["p","Located in northern Italy, the beautiful city of Verona is the second-largest city in the region (behind Venice), and attracts a huge number of tourists, attracted to the rich history and diversity of its ancient buildings, such as the Arena and the Ponte Scaligero. Verona may not be as opulent as other cities, like Florence and Venice, but it’s definitely worth the discovery, at least for one relaxed day."],["p","We had more than a full day to visit the town of Verona, as we decided to stay in the city to sleep as we traveled from Florence to Venice, and we think it’s quite enough to visit the main attractions."],["p","“There is no world without Verona walls (…)”"],["p","Romeo feat W.S."],["p","Where to go? What to see? What to eat? In this city guide, we present you the route we did in the Summer of 2019, a trip we absolutely loved and think it's a must for young couples."],["h3","1. Piazza Bra"],["h4","€: Free| Time: 60 min | ★★★★★"],["p","The Piazza Bra is definitely one of the best places to start your tour of Verona! It is the largest piazza in Verona, right on the edge of Centro Storico. The square contains a fair amount of historic buildings and eateries that are painted in various colors. Some of the buildings you can find there is the Gran Guardia and the Palazzo Beriberi."],["h3","2. Arena di Verona"],["h4","€: Paid Entrance | Time: 120 min | ★★★★✩"],["p","No trip to Verona would be complete without visiting this iconic monument, the ancient Roman Arena. Located in the middle of the Piazza Bra, this Roman amphitheater hosts the biggest names in the music and opera. You can walk inside the Arena and admire its architecture."],["tip","Tip 1: Try to admire the Arena when the sun is setting."],["h3","3. Castle Vecchio & Ponte di Castle Vecchio"],["p","All rights reserved to itVerona"],["h4","€: Paid Entrance | Time: 120 min | ★★★★✩"],["p","Located on the banks of the River Adige, just outside of the city walls, you have a square-shaped fort, the Castle Vecchio. It was built in 1354, but today is the home to the Castelvecchio Museum and Gallery. You can visit the castle (but remember it is not a particularly decorative place, as it was designed to be functional), and enjoy the excellent views of the city and river from the two guard towers."],["p","Extending out from the fort is the Castelvecchio bridge (or Ponte Scaligero). At the time of its construction, it was the longest of its kind in the world. When crossing the bridge, you have a view of the Adige River."],["h3","4. Arco dei Gavi"],["p","All rights reserved to stanmansurrey"],["h4","€: Free| Time: 15 min | ★★★✩✩"],["p","Next to the Vecchio Castle, you have this white limestone monument, that was built in the 1 century A.D."],["h3","5. Piazza Delle Erbe"],["h4","€: Free| Time: 60 min | ★★★★✩"],["p","There is almost no need to talk about this square: right at the heart of Verona's historic center, there is absolutely no excuse not to wander through. This is the home of several shops, café, restaurants, and the city market. Today, Piazza delle Erbe is surrounded by important buildings, so take your time to walk around the square to investigate all the wonders it has to offer. The masterpiece of the square is its fountain, called Madonna Verona, dating back to 380 AD."],["h3","6. Torre dei Lamberti"],["h4","€: Paid Entrance | Time: 120 min | ★★★★✩"],["p","The Torre dei Lamberti is the tallest tower in Verona, standing at 84 meters high. It offers gorgeous panoramic views from its bell tower."],["h3","7. Piazza dei Signori"],["p","All rights reserved to ilturista.info"],["h4","€: Free | Time: 30 min | ★★★✩✩"],["p","Piazza dei Signori sits in close proximity to the Piazza delle Erbe. Although considerably small, it is just popular and interesting. This square is also known as Piazza Dante because of the statue of Dante, standing at its center."],["h3","8. Scaliger Tombs"],["h4","€: Free | Time: 30 min | ★★★★✩"],["p","Scaliger Tombs is a Gothic style monumental funerary complex dedicated to the influential Scaliger family, where five Lords of Verona that ruled over the territory of Verona until 1387 rest: Cangrande I, Mastino II, Cansignorio, Alberto II, and Giovanni. The tombs are located outside the church of Santa Maria Antica."],["h3","9. Casa di Giulietta"],["h4","€: Paid Entrance | Time: 120 min | ★★★★✩"],["p","Verona is the home to Shakespear's legendary love story, Romeo and Juliet. Although Shakespeare's play wasn't based on a true story, The Casa di Giulietta is the supposed building from the famous scene in where Romeo Hails Juliet and she speaks to him from the balcony."],["p","One of the ex-libris tourists like to see (and toca) is Juliet’s statue. Take your time in the long lines to get the photo everybody wants. You can also take a visit to the Casa di Giulietta museum, which includes Juliet’s balcony where you can pose dramatically."],["h3","10. Verona Cathedral"],["h4","€: Paid Entrance | Time: 30 min | ★★★✩✩"],["p","Verona Cathedral, or Cattedrale di Santa Maria Matricolare, is the most decorative (and beautiful) of all the religious buildings in Verona it is also one of the oldest religious buildings in Verona. The complex is made up of the Chapter Library, the Cloister of the Canons, the Baptistery, the Church St Helena, and the Bishop’s Palace."],["h3","11. Castel San Pietro"],["p","All rights reserved roteiroeviagem"],["h4","€: Free | Time: 30 min | ★★★★★"],["p","There are no excuses for missing the arguably the best view in Verona the Castle San Pietro offers."],["p","Although no longer open to the public, you can still walk through its grounds and experience the fantastic views of the enchanting city of Verona. This will be your final place to visit, so make sure you grab some wine, cheese, and bread and enjoy our dinner while sited o the walls of the castle with your legs standing a few meters high, with a magnificent and romantic view across Verona."],["p","If you want to know more about the complete trip, click here."]],"date":"12 November 2020","tags":["travel","vacation","city guide","traveling","1 day trip","italy","verona","holidays"]},{"title":"BUDAPEST | City Guide - 2 days in Budapest 🇭🇺","blocks":[["p","In 2019 we decided to make a Christmas Trip around three European capitals, and it was the best decision we could make since in 2020 Coronavirus strike the world and we didn't plan any vacations, to be safe and to keep our families safe as well."],["p","But this blog came out of a very long quarantine, so can we say that a good thing came up through this pandemic?"],["p","Budapest was very magical. It was our first stop. Everywhere we went you could just smell Christmas in the air! In every corner, you would find a Christmas Market and a Big Christmas Tree, but really big ones!"],["p","This city is full of history and its landmarks are memorable. You'll find adorable places, peaceful gardens and very different architecture in Buda and in Pest (Budapest is divided by a beautiful river). The people are not the warmest, since they went through big wars and lived for years in misery, but now you can start seeing a new Budapest, growing and investing in their country and with a new way of living."],["p","This city was the most magical of our Christmas Trip. So, if you can, don't blink and just book your trip to Budapest during Christmas Time!"],["p","Day 1 - 🔴 | Day 2 - 🟠"],["h3","Day 1"],["h3","1. Széchenyi Thermal Baths"],["h4","€: Paid Entrance | Time: 180 min | ★★★★★"],["p","The Széchenyi Baths complex is the largest “medicinal” bath center in Europe. The two outdoor pools are fantastic places to visit on a cold, dark night, as the steam rising from the hot water makes the whole place seem wonderfully mysterious. Inside you'll find amazing tiles and the most dashing thermal baths. You need to see it for yourself and enjoy your time in Budapest in Szechenyi Spa Baths, in a beautiful, richly decorated palace."],["p","Szechenyi Spa Baths is in the biggest green park of Budapest, in the City Park, close to a bunch of Budapest attractions. The beautiful building of the spa baths is the design of Gyozo Czigler (Győző Czigler) who started to build Szechenyi Furdo in May 1909."],["h3","2. Budapest City Park (Budapest Municipal Zoo + Botanical Gardens + Budapest Circus + Vajdahunyad Castle)"],["h4","€: Free | Paid Entrance | Time: 60 min | ★★★★✩"],["p","The best way to explore the park is to take walk from its one end, Vajdahunyad Castle, to the other end, the Zoo!"],["p","The City Park is a wonderful leisure facility for the citizens of Budapest and includes sports facilities, swimming baths, and a boating lake. During the winter months, the boating lake is transformed into one of Europe’s largest ice rinks (Day2). The park is also home to the Budapest Municipal Zoo and Botanical Gardens, the Budapest Circus, and the Vajdahunyad Castle (housing the Museum of Hungarian Agriculture)."],["h3","3. Heroes’ Square"],["h4","€: Free | Time: 20 min | ★★★✩✩"],["p","The iconic monument features depictions of the Seven Chieftains of the Magyars, who are believed to have led the Hungarian people from central Asia to the Carpathian Basin. Atop the central pillar is the Archangel Gabriel, who is holding the Hungarian crown. At either side of the central column are two matching colonnades, which depict a variety of other historical Hungarian figures."],["h3","4. Andrássy Avenue"],["h4","€: Free | Time: 60 min | ★★★✩✩"],["p","This wonderful boulevard takes visitors from Erzsébet Square in central Pest, out to the City Park. Due to its interesting cultural heritage, it was declared a World Heritage Site in 2002. Taking a walk down Andrássy is a great way to see a number of Budapest’s different architectural styles, including the Hungarian National Opera House, neo-renaissance townhouses and mansions, and a number of different national embassies."],["h3","5. House of Terror"],["h4","€: Paid Entrance"],["p","Unfortunately, it was closed so we couldn't enter. This house, on Number 60, Andrássy Avenue, once inspired fear as the headquarters of the secret police, but since 2002 this ominous townhouse has housed a poignant museum commemorating the victims of the fascist and communist regimes. A very important stop on this beautiful avenue!"],["h3","6. New York Café"],["h4","€: Free | Time: 30 min | ★★★★✩"],["p","Budapest is home to some historically grand cafés, and the New York Café is one of the most opulent. In its heyday, the café was frequented by writers, artists, and intellectuals; today, it’s more popular with visitors to the city. Prices match the ultra-luxurious setting, so visit for a coffee and soak up the fresco adorned gold-plated surroundings. Now imagine this café during Christmas! It's amazing!"],["h3","7. Jewish Quarter (+Szimpla Kert)"],["h4","€: Free | Time: 120 min | ★★★★★"],["p","Budapest’s buzzy Jewish Quarter (also known as the seventh district) is the city’s epicenter of cool, packed with all the edgiest bars, cafés, and restaurants."],["p","Your nights out will start and end here, with popular clubbing spots like Szimpla Kert, the eight-bar Instant, which recently merged with party wonderland Fogas Ház and offers takeaway treats and techno till 6am."],["h3","Szimpla Kert"],["h4","€: Free | Time: 30 min | ★★★★★"],["p","The city’s most famous (and most atmospheric) ruin bar. Be sure to order a shot of Unicum when you’re there – it’s a traditional Hungarian herbal liqueur that your tastebuds won’t forget in a hurry. (Andrew loved it, Richie couldn't finish his)."],["h3","8. City Center (Christmas Markets)"],["h4","€: Free | Time: 180 min | ★★★★★"],["p","Head over to the city center, during winter the night comes really early and the Christmas markets are ready for you! You'll find 5 or 6 of them spread through the city, which one of them has its own Christmas Tree and stands that sell amazing, traditional Hungarian crafts and food! The food in these markets are amazing and don't forget about the warm apple cider and hot wine! The smell of Christmas will be in the air!"],["h3","Day 2"],["h3","1. City Park Ice Rink"],["h4","€: Paid Entrance | Time: 120 min | ★★★★★"],["p","There are many fun winter things to do in Budapest, but one of the best ones is surely the popular Budapest Outdoor Ice Rink in the City Park, aka Varosligeti Mujegpalya. If you want to feel the space in a breathtaking place, the Ice Rink Palace in the City Park with its enormous open-air Skating Rink is a must-see, must do."],["p","It was so funny to do this, and an amazing experience! This is the one thing that we'll never forget!"],["h3","2. Parliament Building"],["h4","€: Paid Entrance | Time: 60 min | ★★★★✩"],["p","Designed and built in the Gothic Revival style, is one of the largest buildings in Hungary, and is home to hundreds of parliamentary offices."],["p","To see the whole building in its full glory, it is worth viewing it from the other side of the Danube. A 45 minutes tour of Budapest’s national Parliament Building – one of the city’s most famous landmarks."],["h3","3. Danube Promenade (extends between Elizabeth Bridge and Chain Bridge in Pest)"],["h4","€: Free | Time: 30 min | ★★★★✩"],["p","Perfect for those who want a short, but interesting walk. Promenading along the Danube is a great way to see many of the most famous sights in the capital. Looking over towards to Buda side of the river, you will see the Buda Castle, the Liberty Statue on Gellert Hill, and the Fisherman’s Bastion."],["p","The shoes on the Danube Bank are a heartbreaking memorial to 3,500 people killed by fascists in Budapest during the Second World War."],["h3","4. The Chain Bridge"],["h4","€: Free | Time: 20 min | ★★★★✩"],["p","Opened in 1849, Budapest’s magnificent suspension bridge connects the Buda (West) and Pest (Eastern) sides of the city, arching over the River Danube."],["h3","5. St. Stephen’s Basilica"],["h4","€: Paid Entrance | Time: 60 min | ★★★★✩"],["p","This basilica is one of the most important religious buildings in Hungary. The largest church in Budapest, which can hold up to 8,500 people and is one of Hungary’s most iconic structures."],["p","Visitors to the reliquary can see the (reported) right hand of Stephen, first King of Hungary: The mummified right hand of the patron saint of the church and first king of Hungary, St Stephen, is kept in a glass case to the left of the main altar. Those with a head for heights can travel up to the base of the dome and look out over the city. On a clear day, this is a great vantage point from which to survey Budapest from the air."],["h3","6. Hungarian State Opera House"],["h4","€: Paid Entrance | Time: 60 min | ★★★★✩"],["p","Neo-Renaissance building first opened in 1884. Outside of the building, you can see statues to Ferenc Erkel (composer of the Hungarian National Anthem) and Ferenc Liszt (Hungarian composer)."],["p","The 1200 seat auditorium is considered to be one of the best in the world for operatic performances, guided tours of the Opera House are available during the day, although these usually need to be booked in advance."],["h3","7. Central Market Hall (Great Market Hall)"],["h4","€: Free | Time: 120 min | ★★★★✩"],["p","The Great Market Hall in central Budapest is Budapest’s most famous marketplace. to source some one-of-a-kind souvenirs and sample unfamiliar Hungarian delicacies. Whilst many locals still use the market hall as a place to buy their groceries, the market is incredibly popular with the tourists too."],["p","As well as individual ingredients, it is possible to pick up homemade local delicacies like goulash and langos from the food stall upstairs. You can have lunch here"],["h3","8. Géllert Hill: Liberty Statue + Citadella"],["h4","€: Free | Time: 120 min | ★★★★✩"],["p","Prepare yourself for a nice and big walk! 😆 The Liberty Statue on Gellert Hill is one of the few prominent Communist statues which remained in situ after the transition to democracy."],["p","The statue was first erected in 1947 to commemorate the Soviet troops who lost their lives liberating the country, however, the engraving was later changed so that it commemorated “all who sacrificed their lives for the independence, freedom, and prosperity of Hungary”."],["h3","9. Buda Castle Hill"],["h4","€: Free | Paid Entrance | Time: 180 min | ★★★★★"],["p","Today, Buda Castle is home to the Hungarian National Gallery, the Budapest History Museum, and the National Library. The castle courtyards remain open 24 hours a day: The Buda Castle district itself is open all day and night, at least regarding its streets, courts, and even some of its attractions, like the Fisherman’s Bastion. It can be explored either on your own or as part of an informative walking tour."],["p","Places you can't miss in Buda Castle Hill:"],["p","1 - Buda Castle"],["p","2 - Hungarian National Gallery"],["p","3 - Budapest History Museum"],["p","4 - Fisherman's Bastion"],["p","5 - Matthias Church: The Church of Our Lady"],["p","6 - The Labyrinth: Caves beneath Castle Hill"],["p","7 - Hospital in the Rock Nuclear Bunker Museum"],["h3","10. Margaret Island"],["h4","€: Free | Time: 60 min | ★★★★✩"],["p","A very small island, 2.5km, which sits in the middle of the Danube, which is covered in parkland and recreational facilities. Surely Budapest’s most impressive green space, linked to Buda and Pest by bridges at either end. Very peaceful and beautiful to see and appreciate the landscaping of Budapest."],["p","Visit the Rose and Japanese Gardens as well as the Margaret Island’s ruins, not forgetting about one of the most famous features of the island, the “music fountain”, from which water regularly “dances” in time to classical music."],["h3","Where to Leave your Luggage?"],["p","In Budapest you can find several places, very secure, to leave your luggage, we used the Luggage Store Budapest. If you need to leave something in Budapest while you travel around the city give this a look and find the nearest one."],["h3","Where to Sleep?"],["p","We stayed at a nice and cheap 3 Stars Hotel called City Hotel Ring. Is near the city center and the subway, they let us leave the luggage there as well and we booked it with breakfast included. A very nice option!"],["h3","Where to Eat?"],["p","From all the places you have to eat in Budapest, first, try the Christmas Markets, but then try Paprika! But you'll have to make a reservation, otherwise, you'll end up like us, eating at 6pm! But it was delicious and they have the most amazing cheese sauce! Please try it! For me (Richie)."]],"date":"28 November 2020","tags":["christmas","market","holidays","traveling","city guide","2 days trip","vacation","travel","hungary","budapest"]},{"title":"PRAGUE | City Guide - 3 days in Prague 🇨🇿","blocks":[["p","Can you start earing the Christmas Carols??? We can. Prague is like magic when the business is Christmas! Every single one is in the holiday spirit! This is the second city that we are visiting searching for Christmas Markets, and it's no disappointment!"],["p","Watch the video, see our pictures, and enjoy our tips throughout these three days in Prague!"],["p","Find the Christmas Magic and share it with us! 😍"],["p","Already starting to feel excited? You should, on this trip, we were able to connect the enjoyment of this European city with the magic of Christmas! The most wonderful time of the year!"],["p","Get ready to start you discovering a new world!"],["p","Day 1 - 🔴 | Day 2 - 🟠 | Day 3 - 🟢"],["h3","Day 1"],["h3","1. Charles Bridge (watch the sunrise or the Sunset)"],["h4","€: Free | Time: 60 min | ★★★★★"],["p","This is one of the most known bridges in Europe, so you can't miss it! This bridge is full of sounds and history that you can see through the statues that will be by your side in your walks. Take your time and enjoy it!"],["p","Without question, this is the most iconic landmark in Prague. Bookended by two great towers and featuring saintly statues along either side of the bridge, this landmark is truly a sight to behold. It’s also possible to climb up into the Old Town Bridge Tower on its eastern end."],["h3","2 . Prague Castle"],["h4","€: Free | Paid Entrance | Time: 180 min | ★★★★★"],["p","Free to walk around the grounds, but you do have to purchase tickets for St. Vitus, Golden Lane, St. George's Basilica, etc. Prague Castle sits high on a promontory overlooking the Vltava River. The complex is made up of the Castle, the Gothic Saint Vitus Cathedral, the Romanesque Basilica of St. George, the Spanish Hall, the St. Vitus Cathedral, the Golden Lane, and the Stag moat (closed in 2019)."],["p","On a slightly different note, the castle is also home to the rather cutesy attraction, the Golden Lane: a small-scale street that features houses that almost look like miniatures of the size they ought to be. Its name comes from the goldsmiths that used to live there."],["p","Also situated within Prague Castle, St. Vitus Cathedral deserves special mention. This tremendous gothic cathedral is the most visible part of Prague Castle, thanks to its large frame and elaborate design."],["p","Although a ticket is required to see the full cathedral, it is possible to visit the entrance for free."],["h3","3 . Malá Strana"],["h4","€: Free | Time: 120 min | ★★★★✩"],["p","Across the river from the Old Town and New Town lies the equally important district of Malá Strana. This neighborhood is one of Prague’s oldest, sitting directly beneath the city castle."],["p","Malá Strana is home to plenty of noteworthy landmarks, in part because of its splendid Baroque architecture. There’s plenty to see, such as St. Nicholas Church, Wallenstein Garden, and the John Lennon Wall."],["h3","Day 2"],["h3","1. Jewish Quarter – Josefov neighborhood"],["h4","€: Free | Time: 180 min | ★★★✩✩"],["p","Not far from Old Town Square. There are six synagogues within the quarter and one of the most important Jewish cemeteries in Europe. (The Maisel Synagogue, the Pinkas Synagogue, the Spanish Synagogue, the Old Jewish Cemetery, the Klaus Synagogue, and the Ceremonial Hall), The Old-New Synagogue is the oldest working synagogue in Central Europe."],["p","The most well-known probably being the Pinkas Synagogue which is a memorial to the holocaust victims, and the Old-New Synagogue."],["h3","2 . Statue of Franz Kafka"],["h4","€: Free | Time: 30 min | ★★★★✩"],["p","Only a couple blocks away if you cut through the peaceful Franciscan Gardens, you’ll find one of Prague’s most curious recent additions. This statue features rotating segments that come together to form the man’s head. It’s an intriguing mix of engineering and art that is quite mesmerizing."],["h3","3 . Riverfront Stroll"],["h4","€: Free | Time: 60 min | ★★★✩✩"],["p","Prague’s majestic Vltava riverfront. No matter the season, this part of the city always boasts splendid views across and along the river. As you head south by the river you’ll pass impressive architectural landmarks like the Rudolfinum and the St. Francis of Assisi Church."],["h3","4 . National Theatre"],["h4","€: Paid Entrance | Time: 60 min | ★★★★★"],["p","Prague’s home to the best opera, drama, and ballet, this 19th-century marvel is worth a visit – and even more worthy if you can get tickets to one of the performances hosted here."],["h3","5 . The Dancing House"],["h4","€: Free | Time: 30 min | ★★★★✩"],["p","Designed by famed architect Frank Gehry, this asymmetrical building is a firm favorite of visiting photographers."],["h3","6 . Christmas Market in Old Town Square"],["h4","€: Free | Time: 180 min | ★★★★★"],["p","This is the biggest Christmas Market in Prague! The one where everything happens, you'll find live concerts, lots of street food, Christmas food, traditional food and people caroling through the street! You'll get the meaning of Christmas here! 🎄"],["h3","Day 3"],["h3","1. Old Town Square"],["h4","€: Free | Time: 30 min | ★★★★★"],["p","The large square at the heart of the old town is known as Old Town Square, and many visitors come to see the famous Astronomical Clock located in the Old Town Hall Tower."],["p","Around every side of the square you’re presented with eye-catching attractions that will keep you snapping photos for quite some time."],["h3","2 . Astronomical Clock"],["h4","€: Free | Time: 15 min | ★★★★★"],["p","Sitting on the southern wall of the Old Town Hall is one of the square’s best-known attractions, the Prague Astronomical Clock. The Astronomical Clock delights watchers every hour from 9am to 11pm, when the twelve apostles appear on the hour."],["h3","3 . Old Town Hall Tower"],["h4","€: Paid Entrance | Time: 60 min | ★★★★✩"],["p","For a stunning 360-degree panoramic view over Prague, head up the Tower at Old Town Hall (the same building that houses the Astronomical Clock). You will not regret a climb to the top of the Old Town Hall tower."],["h3","4 . Church of Our Lady before Týn"],["p","€: Free | Time: 30 min | ★★★★✩"],["p","You will find the Gothic spires of the Týn Church towering over the square. With its twin spires, this is one impressive landmark, despite being oddly positioned behind a row of houses."],["h3","5 . Jan Hus Memorial + St. Nicholas Church"],["h4","€: Free | Time: 30 min | ★★✩✩✩"],["p","Other notable landmarks here include the Jan Hus Memorial and St. Nicholas Church."],["h3","6 . Powder Tower"],["p","€: Paid Entrance | Time: 45 min | ★★★✩✩"],["p","One of the original city gates to Prague, the Powder Tower today stands in the heart of the city separating Old Town from New Town. It was once the start of the Royal Route to Prague castle, as well as a storage place for gun powder. Today you can climb to the 44m observation deck for a view of the city."],["h3","7 . Wenceslas Square + The National Museum"],["p","€: Free | Paid Entrance | Time: 180 min | ★★★★★"],["p","More a broad avenue than a square, you’ll find plenty of beautiful buildings along its sides as it leads up to a statue of Saint Wenceslas in front of the stately National Museum."],["h3","8 . Christmas Market in Wenceslas Square"],["h4","€: Free | Time: 120 min | ★★★★★"],["p","While being in Wenceslas Square try to enjoy their Christmas Market, you'll get two different types of markets, during the day and during the night, full of music, smells, and Christmas Spirit! Don't forget to be holly, la la la, la la la la 🎅"],["h3","Where to Leave your Luggage?"],["p","You can find two places, right in the city center, where you can leave your luggage. The Masarykovo Nadrazi Train Station and at Prague Central Station. Leaving here your luggage is super secure and it has surveillance. For a suitcase you'll pay €2.50 (60CZK) and for locker you'll pay €2 (50CZK)."],["h3","Where to Sleep?"],["p","We stayed in a nice and cheap 3 Stars Hotel called Central Hotel Prague. Right in the heart of Prague, this hotel is very continental and has a 24hours open reception. We loved the breakfast and the bedroom was really nice and warm. A lovely choice, we loved it!"]],"date":"1 December 2020","tags":["holidays","market","prague","christmas","czech republic","2 days trip","vacation","travel","traveling"]},{"title":"VIENNA | City Guide - 3 days in Vienna 🇦🇹","blocks":[["p","Vienna was the last city we visited before coming home so spend Christmas with our family! At this moment we were full of Christmas In our soul and in our eyes! Austria is beautiful, and the Christmas lights, ornaments merge very well with the architectural features of the city!"],["p","With a very good transportation system (subway and buses) you'll find your way pretty easy in Vienna, jumping around from one point to another!"],["p","Here you'll find what to visit, whether if it's free or paid, and the right order. This way you'll save up some time to get more relaxed nights! If you have any question you can leave it in the comments :) we look forward to hearing from you!"],["p","Day 1 - 🔴 | Day 2 - 🟠 | Day 3 - 🟢"],["h3","Day 1"],["h3","1. St Charles Church (Karlskirche)"],["h4","€: Free | Time: 60 min | ★★★✩✩"],["p","Dedicated to St. Charles Borromeo, a saint invoked during times of plague, Karlskirche was built in 1737 and remains Vienna's most important Baroque religious building. This vast building is crowned by a magnificent 72-meter dome and is famous for its twin 33-meter Triumphal Pillars"],["h3","2. Albertina"],["h4","€: Paid Entrance | Time: 90 min | ★★★✩✩"],["p","The Albertina is a museum, It houses one of the largest and most important print rooms in the world with approximately 65,000 drawings and approximately 1 million old master prints, as well as more modern graphic works, photographs, and architectural drawings. Apart from the graphics collection the museum has recently acquired on permanent loan two significant collections of Impressionist and early 20th-century art, some of which will be on permanent display. The museum also houses temporary exhibitions."],["p","And from their balcony you can take a foto of the Opera House!"],["h3","3. Volksgarten + Vienna Natural History Museum"],["h4","€: Free | Time: 60 min | ★★★★✩"],["p","Best known for its huge Dinosaur Hall and for the world's largest exhibit of meteorites, which includes the Tissint meteorite from Mars that fell in Morocco in 2011, Vienna's Natural History Museum is a fascinating place to visit. This fascinating venue also has a digital planetarium where you can see intriguing films about the earth and its development."],["h3","4. Hofburg Palace"],["h4","€: Free - Paid Entrance | Time: 120 min | ★★★✩✩"],["p","The Hofburg Palace is a huge palatial complex that pays tribute to the power and influence of the Habsburg dynasty and served as the main winter palace for the rulers of the Austro-Hungarian Empire for hundreds of years. Today the complex is home to the offices of the president of Austria and serves as a presidential base. Visitors can admire the beauty and style of the baroque architecture, take a tour through the imperial apartments or visit one of the detailed museums in the complex."],["p","Its main attractions are:"],["ul","The Imperial Apartments"],["ul","the Sisi Museum"],["ul","the Silver Collection"],["ul","other notable sites within the complex (Imperial Chapel - Burgkapelle - and the Hofburg Treasury)"],["h3","5. The Sacher Café"],["h4","€: Free | Time: 40 min | ★★★★★"],["p","The Café Sacher offers the perfect setting to sample the typical Viennese coffeehouse atmosphere – complete with a slice of Original Sacher-Torte. One of the most known cakes of austria. Take some time out of your day to make room for a moment of indulgence with their delicious classics. Whatever the time of day, the Café Sacher will offer you a tasteful retreat and a culinary safe haven. Traditional Viennese dishes and coffee selections await you with a smile."],["h3","6. Christmas Markets"],["h4","€: Free | Time: 120 min | ★★★★★"],["p","Around the city you'll find amazing Christmas Markets, there you can try delicious food, connect with local people, and find some of the Austrian Christmas spirit! You'll be able to discover small Christmas markets, and then big ones, with everything you can imagine!"],["h3","Day 2"],["h3","1. Belvedere Palace"],["h4","€: Free | Time: 120 min | ★★★★★"],["p","Belvedere Palace is really two splendid Baroque buildings: the Lower (Unteres) Belvedere and the Upper (Oberes) Belvedere."],["p","Highlights of the Upper Palace include:"],["ul","the Ground Floor Hall, with its statues"],["ul","Ceremonial Staircase, with its rich stucco relief and frescoes"],["ul","the Marble Hall, a stunning two-story hall with numerous period sculptures, paintings, and ceiling frescoes."],["p","The Lower Palace also boasts:"],["ul","a Marble Hall, this one noted for its oval plaster medallions and rich ceiling fresco"],["ul","a Marble Gallery built to house a collection of historic statues"],["ul","the Winter Palace, a Baroque building that once housed the Court Treasury"],["ul","Orangery"],["ul","the Palace Stables (home to the Medieval Treasury) Belvedere Gardens and Fountains linking the two palaces."],["h3","2. Wiener Musikverein"],["h4","€: Paid Entrance | Time: 60 min | ★★✩✩✩"],["p","The Wiener Musikverein (Viennese Music Association), commonly shortened to Musikverein, is a concert hall in the Innere Stadt borough of Vienna. It is the home of the Vienna Philharmonic orchestra. The \"Great Hall\" (Großer Saal), due to its highly regarded acoustics, is considered one of the finest concert halls in the world, along with Berlin's Konzerthaus, the Concertgebouw in Amsterdam, and Boston's Symphony Hall."],["h3","3. Vienna State Opera"],["h4","€: Paid Entrance | Time: 60 min | ★★★★✩"],["p","Opera and fine architecture are synonymous with Vienna, and the Vienna State Opera provides both in abundance."],["p","This outstanding building is located centrally in the Innere Stadt district and is considered one of the finest Opera Houses in the world. Daily guided tours are available which last around 40 minutes and give a good overview of the building."],["h3","4. Rathaus - Vienna City Hall"],["h4","€: Free - Paid Entrance | Time: 60 min | ★★★✩✩"],["p","The Rathaus was constructed in the 1800s in a Neo-Gothic style to accommodate the offices of the mayor for an ever-increasing city population (serves as the city's administrative center)."],["p","Guided tours are available on the inside of the Town Hall on certain days, and this is well worthwhile just to see the extravagant style of the rooms and what it must be like to work inside such a wonderful building."],["h3","5. Café Central"],["h4","€: Free | Time: 30 min | ★★★★✩"],["p","Vienna’s most venerable cafe commands a queue to rival any London hotspot. Opened in 1876, it’s always been a favorite with brainy locals."],["p","Tuck into fluffy pancakes or warm apfelstrudel dusted with icing sugar and pick up some custard-filled cremeschnitte slices."],["h3","6. Collegial and Parish Church of St. Peter - Peterskirche"],["h4","€: Free | Time: 60 min | ★★★✩✩"],["p","The Peterskirche (English: St. Peter's Church) is a Baroque Roman Catholic parish church in Vienna, Austria. It was transferred in 1970 by the Archbishop of Vienna Franz Cardinal König to the priests of the Opus Dei."],["h3","7. St Stephen’s Cathedral"],["h4","€: Paid Entrance | Time: 60 min | ★★★✩✩"],["p","This monolithic structure stands proud in the Stephensplatz and has been the most important church in Vienna and Austria since its construction. The beauty of this building is undeniable and its huge tower dominates the Vienna skyline and stands as the tallest church tower in Austria. Inside the church, there are a total of 18 altars, several smaller chapels, and even some tombs and catacombs."],["h3","Day 3"],["h3","1. Prater Amusement Park"],["h4","€: Free - Paid Entrance | Time: 120 min | ★★★★★"],["p","It's free to enter the Park, then you pay to go on the rides."],["p","Inside the park is a multitude of rides and stalls including a huge Ferris wheel, bumper cars, carousels, and hair-raising rollercoasters."],["h3","2. Schönbrunn Palace"],["h4","€: Free - Paid Entrance | Time: 120 min | ★★★★★"],["p","The gardens are free, but if you want to enter you'll have to pay."],["p","Standing since the 1600’s and holding a major role of cultural importance in Austria, the Schonbrunn Palace is a colossal 1441 room structure and complex that is the main tourist attraction in Vienna."],["p","The Habsburgs have held residence here for many years and indeed emperors of Austria have been born in the palace too. Inside the palace are an assortment of rooms all fully furnished and decorated in the original style – You can enjoy a tour through the rooms and admire the sumptuous furnishings and see how Austrian royalty lived."],["h3","3. The End"],["p","Time to go to the airport and find our way home, to our lovely city, Porto - Portugal 😍"],["h3","Where to Sleep?"],["p","We stayed in a nice 3 Stars Motel called Motel One Wien-Prater. This time we didn't have breakfast... a beginner's mistake. This Motel is really really good, and Motel is only in the name, cuz is a normal 3 stars hotel! This is near Prater Park (near is like your windows are above the Park 🤣 ), but you won't hear a thing. This motel is near the subway and is super good considering the price/quality. A good option for sure, a new breaking of the stigma of Motels. Next time, include breakfast!"]],"date":"8 December 2020","tags":["vienna","austria","vacation","travel","2 days trip","city guide","traveling","holidays","market","christmas"]},{"title":"Christmas Markets | City Guide - 8 days finding European Christmas Markets 🇭🇺🇨🇿🇦🇹","blocks":[["p","Welcome to one of the most beautiful trips that we made so far! 😍"],["p","We never thought that a trip could be as magical, as this was! All around the people were joyful and always smiling, you could hear people singing and the streets smelled like your grandma's house on Christmas Eve!"],["p","The only thing missing was the Snow! Oh dear Lord, if we got snow!!! But with snow or not this was an amazing trip! Be prepared and take good shoes and warm clothes! Because these countries are a little bit windy and they are really cold!"],["p","Right below you can find the way we organized our trip through these amazing three Cities!"],["h4","Day 1 & 2 - Budapest"],["h4","Day 3, 4 & 5 - Prague"],["h4","Day 6, 7 & 8 - Vienna"],["p","Connections:"],["p","Porto - Budapest = Airplane (Budapest Airport)"],["p","Budapest - Prague = Bus (During Night)"],["p","Prague - Vienna = Bus (During Night)"],["p","Vienna - Porto = Airplane (Porto Airport)"]],"date":"15 December 2020","tags":["budapest","hungary","vienna","travel","austria","vacation","traveling","city guide","czech republic","prague","christmas","1 week trip","holidays","market"]}],"Restaurant and hotel reviews":[{"title":"Aveiro | Montebelo Vista Alegre Hotel 🇵🇹","blocks":[["p","Montebelo Vista Alegre Ílhavo Hotel is a symbol of the history, art, and culture of the Central region of Portugal, combined with the universal value of the heritage and history of one of the most prestigious Portuguese brands: Vista Alegre."],["p","As part of Montebelo Hotels & Resorts, with a presence in Portugal and Mozambique, this 5-star hotel is located on the Ria de Aveiro shore, just 7kms from the beaches of Costa Nova and from Aveiro’ center, as well as 50 minutes from Oporto city."],["p","The hotel is part of the renovation project regarding the Vista Alegre factory area, comprising the Palace, which was the home of the Vista Alegre founders, the Palácio dos Pintores, the Chapel and the Vista Alegre Museum."],["p","With a panoramic view of the Ria, its Vista Alegre restaurant maintains the decoration and unique ambiance of the Hotel."],["p","The spa, outdoor pool, and unique set of spaces turn your stay or event into a memorable experience."],["p","In this hotel, everything is thought out in detail, from the moment of check-in until the time of check-out."],["p","The area surrounding this hotel, isolated from everything, transmits a sense of peace that rests the soul and charges us with energy."],["p","The pool is amazing for a hot summer, but the indoor pool is also a plus in this hotel with an amazing spa service."],["p","Can I come back every single year?"]],"date":"31 July 2020","tags":["vista alegre","living","portugal","hotel","1 day trip","aveiro","traveling","travel"]},{"title":"Cruel Restaurant - Porto, Portugal","blocks":[["p","Andrew toke me here this year for my birthday (Richie), it was an amazing and very tasteful adventure! Right in the downtown of Porto, Cruel is one of the most adventurous restaurants that will amaze you with their food and good taste!"],["p","At every birthday we go out to dinner as a couple and do dinner at home for our friends, just a small get together! This year it wasn't different, we still weren't on quarantine. 😔 Since it was my birthday it was Andrew who should decide the place and surprise me! And boy... yes he did!!!"],["ul","For Appetizers, we ordered berlin balls with salmon mousse and wasabi cream, and mushrooms stuffed with burnt goat cheese and peppers jam."],["p","Review: The berlin balls with salmon needed more flavor of salmon, it was a plain appetizer but the mushrooms here very good and the peppers jam was delicious!"],["ul","For Main Dish, we ordered the ruddy, confit and grilled pork cheeks, and hallucination mushroom risotto."],["p","Review: We always do a thing, where we order two different things and in the middle of the dinner course we change plates, this way we both can enjoy new flavors and delicacies! The Risotto is always moving, you should see it and it was really good, you could feed the freshness of the mushrooms and it had a hint of wine. The Pork cheeks were the most surprising for me and Andrew! They just melted in our mouths, full of flavor and the amount was pretty generous!"],["ul","For Dessert, we shared two desserts, tiramisu de lima em coma alcoólico, e crumble de ruibarbo com algodão doce."],["p","Review: The looks were mesmerizing! the crumble has a simple flavor but the presentation is so special and fluffy, but the tiramisu wins in flavor and the lime is really present and fresh!"],["p","Overall, the restaurant wins you over, because it continues to surprise you during the dinner and the flavor is present, and you can actually taste things that you never tried before!"],["p","Ps- I drank a sangria and Andrew a glass of white wine!"],["p","Cruel, Porto - ★★★★✩"],["h4","This is not a sponsored post, is our honest opinion!"]],"date":"2 September 2020","tags":["porto","living","portugal","restaurant"]},{"title":"Yuko Tavern Restaurant - Porto, Portugal","blocks":[["p","If you are coming to Portugal you have to try Francesinha! It's Mandatory! You won't find anything like this in another country! And the secret is kept in the sauce!"],["ul","For Appetizers, we didn't order appetizers, because we were in a hurry, but we heard that their fried codfish is delicious, gonna try it next time!"],["ul","For Main Dish, we ordered the one and only, Francesinha - Francesinha Tradicional com Ovo."],["p","Review: We love Francesinha, we are always making it at home, but we also like to try it at different restaurants, because of every place as its own secret! The sauce! You can have spicy ones, sweet ones, the meat flavor ones, and even shrimp sauce! We like the traditional Francesinha!"],["ul","For Dessert, we shared a Strawberry Cheesecake."],["p","Review: The plating was really simples but beautiful, the flavors were very strong and the strawberry was full of flavor and sweet! A must try!"],["p","The restaurant is very cozy, it's walls are made of traditional Portuguese Stone, that gives you an old vibe, but always keeping everything comfortable and clean! The staff is very helpful and knows how to sell you something that you'll love!"],["p","Ps- Richie drank a Super Bock Beer and Andrew a SevenUp!"],["p","Yuko Tavern, Porto - ★★★★✩"],["h4","This is not a sponsored post, is our honest opinion!"]],"date":"14 September 2020","tags":["living","porto","restaurant","portugal"]},{"title":"Un Poco Loco Restaurant - Aveiro, Portugal","blocks":[["p","If you ever go to Aveiro, in downtown, you have to go to Un Poco Loco Restaurant! This is a stop you need to make! This restaurant has the flavors on point and knows what they are doing! And don't get me started on those margaritas!"],["ul","For Appetizers, we order nachos ( ai, ai, aiiiii), Nachos - Totopos with Melted Cheese and Jalapeños."],["p","Review: This was the best dish of the entire meal (Margaritas aside)! I would go every weekend to Aveiro, just to eat this appetizer! They are hot, the cheese is melted in the oven, and the Jalapeños just adds the right amount of spice! I have to stop! My belly is begging again for this!"],["ul","For Main Dish, we ordered two dishes for both of us to try on, Poco Loco Tacos - Veal Sirloin, Tortilla, Cheese, Caramelized Onion in Tequila, Onion Pickle and Chipotle Salsa. Accompanied by Lettuce Salad and we also ordered Tacos Paquito, Chicken, Tortilla, Lettuce, Salsa Roja, and \"Salsa\" Verde"],["p","Review: The Poco Loco Tacos, was sweet and juicy, lots of flavors there, and the Tacos Paquito had a strong flavor of chili and coriander. Both of them are really good, and it's just enough for two people!"],["ul","For Dessert, we shared a Tres Leches Cake."],["p","Review: It's good, it's a Tres Leches Cake, simple and spot-on. But we should have tried the coffee pannacotta as well.. but regrets make you come back to places like this! 🤭"],["p","The restaurant is very cozy, you can feel the Mexican spirit and the candles and saints all around make you feel in the mood!"],["p","Ps- I loved the Red neon light on display at the restaurant window!"],["p","Ps2 - Richie drank a Margarita Original and Andrew a Margarita Loca (this one was a Passion Fruit Margarita! What a nice and fresh surprise!)"],["p","Un Poco Loco, Aveiro - ★★★★★"],["h4","This is not a sponsored post, is our honest opinion!"]],"date":"18 October 2020","tags":["living","restaurant","portugal","aveiro"]},{"title":"Eleven Lab Concept Restaurant - Porto, Portugal","blocks":[["ul","For Appetizers, we were in a hurry, so we didn't get any appetizers, you'll have to do a Russian Roulette on the menu! 😅"],["ul","For Main Dish, we ordered two dishes for both of us to try on, LA-CLUB Sandwich - Sautéed Chicken, Bacon, Cheddar Cheese, Tomato, Mix of Green Leaves, Boiled Egg and Mayonnaise served on semi-platter bread."],["p","Avocado Bowl - Avocado with seeds, mango, radishes, egg wrapped in poppy seeds, roasted sweet potatoes, cucumber served with a spinach base."],["p","Review: The LA-CLUB Sandwich was very juicy, and the chicken was very well seasoned, the fries were sweet potatoes fries, and they were delicious! The Avocado Bowl was really big! The avocado with seeds was a nice surprise, the rest of the dish was very well cooked, but nothing special! It was a plain dish!"],["ul","For Dessert, we ate Pannacottaaaaaaaaaa. Are we excited? Panacota LAB - Pannacotta with red fruit topping and strawberry jam."],["p","Review: It's good, it's so good, it's really really good. You can feel the strong flavor of vanilla and the jam is very nice, adding a nice contrast with the rest of the dish! But Andrew's is better ❤️ 🤭"],["p","Overall, it's a good restaurant to visit, and if you go here during summer try to get one of the outside tables! Because this restaurant is near the Douro River! Best view ever!!!"],["p","Ps- Richie drank a pineapple and mint juice and Andrew a Watermelon, ginger, and strawberry juice."],["p","Eleven Lab Concept, Porto - ★★★☆☆"],["h4","This is not a sponsored post, is our honest opinion!"]],"date":"25 October 2020","tags":["living","porto","restaurant","portugal"]}],"Living, home and celebrations":[{"title":"How to set up your Christmas Tree 🎄","blocks":[["p","It's Christmas time! 🎅 And it's with no doubt the most wonderful time of the year! Thankfully, I and Andrew are both really crazy about Christmas, we love to pick Christmas presents, do Christmas recipes, and fight about the Christmas Decorations!"],["p","This is our first home, since 2017 we live in a nice and cozy (small 🤣 ) one-bedroom apartment in the city of Oporto, Portugal. So we only can do a few things at Christmas... but one day... in the future, we'll go big! 🥰"],["p","Here you'll find a few tips to decorate your Christmas Tree!"],["p","Hope you find this useful! ❤️ 🎄"],["h3","How to set up your Christmas Tree - Step by step:"],["p","1. First, open all the branches of the pine, in order to leave it uniform and with a feeling of fullness."],["p","2. The hardest part is the Christmas lights! Our Christmas tree is 1.80m (6 feet tall) and we use 600 LED lights. It is necessary to place lights on all branches, circularly from inside the tree to the outside and again inside. Don't get dizzy."],["p","3. After putting the lights on, we like to put a box, or a drawer to give height, a stage, to our tree."],["p","4. Now, the best part! Put on the Christmas ornaments! First place the ribbons or bows you have, to fill some spaces inside the tree."],["p","5. Shall we put the Christmas balls? Start by placing the largest ornaments and then go on placing the smaller ones. Always fill the inside of the tree with the biggest ornaments, to cover the metallic parts that give the tree a fake look."],["p","6. Once placed, you can place props that you have to fill certain spaces that seem more sad/empty. For this, the best option is to get Christmas ornaments like flowers or leaves. There is a lot of options to chose from."],["p","7. Cover the box under the tree with a Christmas skirt. We used two, one larger one that looks like snow and then another smaller one that simulates snow."],["tip","Tip1: In a Christmas tree, you should have no more than 2 to 3 colors of Christmas ornaments."],["tip","Tip2: Buy basic ornaments in large quantities, then you will buy unique elements that will make your tree special over the years."],["tip","Tip3: If you can buy a tree that already has built-in lights, it will save your life, in terms of time, and the lights can be replaced on the unit if one goes down."],["tip","Tip4: Don't skimp on the Christmas tree, if you buy something good once, you will have no more worries, then over the years you will only have to buy one or the other ornament."],["tip","Tip5: If you are on a budget, invest in a fluffy tree, not on a big one. Fluffy trees will be easier to set and will need fewer ornaments, this way ending up prettier with less money."],["h3","You didn't use all the Christmas balls or ornaments?"],["p","The2Planners at your rescue! If you have Christmas balls left in your Christmas boxes, you can always fill small pieces of decoration that you already have at home! Our living room coffee table is now even more beautiful, filled with Christmas Spirit!"],["p","Love and be loved this Christmas! ❤️"],["p","A big kiss and a warm hug from The2Planners!"],["p","Merry Christmas!"],["p","👨‍❤️‍👨"]],"date":"26 November 2020","tags":["living","holidays","christmas"]},{"title":"Our Fun and Loving Christmas Cards!","blocks":[["p","Due to this pandemic, we couldn't make out traditional Christmas dinners with all of our friends and family, so we decided to give them a little of our Christmas spirit!"],["p","At the beginning of December, we did a homemade photoshoot with our Christmas tree and made some Christmas Cards to send them through mail to our close friends and family!"],["p","It was a nice surprise and it kept us home, during quarantine, so it was a win-win situation!"],["p","Our friends loved the idea, and now I think we may have started a tradition! 😍"],["p","When you have fun doing something you'll always find joy!"],["p","Have yourself a merry little Christmas!"]],"date":"22 December 2020","tags":["living","holidays","diy","christmas"]}]};

  const tick=()=>{if(!paused&&!document.hidden&&document.getElementById("car")===c)show(i+1);};

function surprise(){
  return `<div class="surprise"><div><h2>What shall we <em>cook tonight?</em></h2><p>Can't decide? Neither can we, most nights. Let the dice pick one of our ${ALL.filter(p=>p.kind==="recipes").length} recipes.</p>
  <button class="dice" id="dice" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="16" cy="16" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="16" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="16" r="1.3" fill="currentColor"/></svg>Surprise me</button></div>
  <div id="pickBox">${pickHTML(randRecipe())}</div></div>`;
}
const RECIPES=()=>ALL.filter(p=>p.kind==="recipes"&&p.photo);
const randRecipe=()=>{const r=RECIPES();return r[Math.floor(Math.random()*r.length)];};
function pickHTML(p,cls=""){
  const tag=p.tags.find(t=>["desserts","main dishes","appetizers","breakfast","drinks","bread"].includes(t))||"recipe";
  return `<a class="pick ${cls}" href="#${p.id}"><span class="ph"><img src="${src(p.photo.cover)}" alt=""></span><span><small>${esc(tag)}</small><b>${esc(titleOf(p))}</b><span class="go">Let's cook this</span></span></a>`;
}
function initSurprise(){
  const d=document.getElementById("dice"),box=document.getElementById("pickBox");if(!d)return;
  d.addEventListener("click",()=>{
    if(d.disabled)return;d.disabled=true;d.classList.remove("spin");void d.offsetWidth;d.classList.add("spin");
    const still=matchMedia("(prefers-reduced-motion: reduce)").matches;let n=still?0:9;
    const step=()=>{if(n-->0){box.innerHTML=pickHTML(randRecipe(),"rolling");setTimeout(step,70+(9-n)*12);}else{box.innerHTML=pickHTML(randRecipe(),"landed");d.disabled=false;}};
    step();
  });
}
function home(){
  return `${carousel()}
  <div class="wrap">
    <div class="lede">
      <div class="script">Hello,<br>we're Richie &amp; Andrew</div>
      <div><p>A couple from Porto who like to do everything ourselves. We cook our way through family recipes and far-off cuisines, plan trips down to the last tram stop, and write it all up here.</p>
      <div class="pillars">Cooking · Travelling · Daily life</div></div>
    </div>
    <section class="block"><div class="shead"><h2>Fresh <em>picks</em></h2></div>${bento()}</section>
    <section class="block">${surprise()}</section>
    <section class="block"><div class="shead"><h2>From our <em>kitchen</em></h2><a href="#recipes">All ${ALL.filter(p=>p.kind==="recipes").length} recipes</a></div><div class="grid">${latest("recipes",8).map(card).join("")}</div></section>
    <section class="block"><div class="shead"><h2>Where we've <em>been</em></h2><a href="#travel">All city guides</a></div>${tripMap()}</section>
    <section class="block"><div class="shead"><h2>Our daily <em>life</em></h2><a href="#living">See it all</a></div><div class="grid">${livingList("all").split("</a>").slice(0,4).join("</a>")+"</a>"}</div></section>
    <section class="block"><div class="since"><img src="${IMG.couple}" alt="Illustration of Richie and Andrew, arms round each other, with a ribbon reading Since 30.04.2016">
      <div><p>It started with a Christmas present for Richie's mum. For a whole year we recreated her recipes and designed her a cookbook, Maria Alice's Homemade Recipes. We never stopped.</p><p class="coffee-note">Enjoying our recipes and guides? Everything here is free, and a coffee keeps us cooking and planning.</p><div class="since-cta"><a class="btn" href="#about" style="text-decoration:none;display:inline-block">Meet us</a>${COFFEE}</div></div></div></section>
  </div>`;
}

  let box=document.getElementById("timers");if(!box){box=document.createElement("div");box.id="timers";box.className="timers";box.setAttribute("aria-live","polite");document.body.appendChild(box);}
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();}catch(e){}
  const el=document.createElement("div");el.className="tbox";
  el.innerHTML=`<b></b><span>${esc(title)}</span><button type="button" class="pp" aria-label="Pause"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button><button type="button" class="xx" aria-label="Stop timer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
  box.appendChild(el);
  let end=Date.now()+secs*1000,left=secs*1000,running=true,iv=null,done=false;
  const b=el.querySelector("b"),pp=el.querySelector(".pp");
  const draw=()=>{const ms=running?end-Date.now():left;const s=Math.max(0,Math.ceil(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;b.textContent=(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(ss).padStart(2,"0");
    if(running&&ms<=0&&!done){done=true;clearInterval(iv);el.classList.add("done");b.textContent="Done!";pp.remove();beep();try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}};
  iv=setInterval(draw,250);draw();
  pp.addEventListener("click",()=>{if(running){left=end-Date.now();running=false;pp.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg>';pp.setAttribute("aria-label","Resume");}else{end=Date.now()+left;running=true;pp.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>';pp.setAttribute("aria-label","Pause");}draw();});
  el.querySelector(".xx").addEventListener("click",()=>{clearInterval(iv);el.remove();});
}
function initTimers(p){
  view.querySelectorAll(".tmr").forEach(t=>t.addEventListener("click",()=>startTimer(+t.dataset.s,t.dataset.l,titleOf(p))));
}

let recipeState={q:"",cat:"all"};
const CATS=[["all","All"],["desserts","Desserts"],["main dishes","Mains"],["appetizers","Starters"],["breakfast","Breakfast"],["bread","Bread"],["drinks","Drinks"],["portuguese","Portuguese"],["christmas","Christmas"],["gluten free","Gluten free"]];
function recipes(){

  return `<div class="wrap"><div class="pagehead"><span class="kicker">from our kitchen</span><h1>Recipes</h1><p>Portuguese classics from Maria Alice's notebook, Christmas baking, and dishes we tasted abroad and rebuilt at home. Oven temperatures are given in both ºC and ºF.</p></div>

function drawRecipes(){

    .filter(p=>!q||p.title.toLowerCase().includes(q)||p.blocks.some(b=>b[0]==="ul"&&b[1].toLowerCase().includes(q)))
    .sort((a,b)=>b.ts-a.ts||a.short.localeCompare(b.short));
  document.getElementById("rgrid").innerHTML=list.map(card).join("")||`<p class="empty">No recipes match “${esc(recipeState.q)}”. Try an ingredient like cinnamon or codfish.</p>`;

function fmtText(t){

function postView(p){
  const b=p.blocks;let html="",i=0;let ingrN=0;let sc=false;const R=p.kind==="recipes";const T=s=>R?withTimers(fmtText(s)):fmtText(s);
  while(i<b.length){
    const [t,x]=b[i];
    html+=figs(p,i);
    if(R&&!sc&&(t==="ul"||(t==="h4"&&/ingredient/i.test(x)))){html+=scalerHTML(p);sc=true;}
    if(t==="ul"||t==="ol"){
      const items=[];do{items.push(b[i][1]);i++;}while(i<b.length&&b[i][0]===t&&!(p.photo&&p.photo.pl&&p.photo.pl[i]));
      if(p.kind==="recipes"&&t==="ul") html+=`<ul class="ingr">${items.map(it=>`<li><label><input type="checkbox" id="ing-${ingrN++}"><span>${fmtText(it)}</span></label></li>`).join("")}</ul>`;
      else if(t==="ol") html+=`<ol class="steps">${items.map(it=>`<li><span>${T(it)}</span></li>`).join("")}</ol>`;
      else html+=`<ul class="plain">${items.map(it=>`<li>${fmtText(it)}</li>`).join("")}</ul>`;
      continue;
    }
    if(t==="h3")html+=`<h3>${esc(x)}</h3>`;
    else if(t==="h4")html+=`<h4>${esc(x.replace(/\s*:\s*$/,""))}</h4>`;
    else if(t==="tip")html+=`<p class="tip">${T(x)}</p>`;
    else html+=`<p>${T(x)}</p>`;
    i++;
  }
  const back={recipes:["#recipes","All recipes"],travel:["#travel","All city guides"],"eat-out":["#living","Our daily life"],living:["#living","Our daily life"]}[p.kind];
  const more=ALL.filter(q=>q.kind===p.kind&&q!==p).sort((a,c)=>{const s=x=>x.tags.filter(t=>p.tags.includes(t)).length;return s(c)-s(a)||c.ts-a.ts;}).slice(0,4);
  const tags=p.tags.filter(t=>!["recipes","cooking","travel","traveling"].includes(t));
  return `<div class="wrap"><a class="back" href="${back[0]}">← ${back[1]}</a>
  <div class="post"><article><div class="dateline">${esc(p.date||"")}</div><h1>${esc(titleOf(p))}</h1>${subline(p)?`<div class="dateline" style="margin-top:4px">${p.kind==="eat-out"?subline(p):esc(subline(p))}</div>`:""}
    <div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
    <div class="body"><div class="feature"><div class="stampbox">${stampInner(p,true)}</div></div>${html}${figs(p,b.length)}
    </div></article>

  </aside></div></div>`;
}

function route(){
  const h=(location.hash||"#home").slice(1);
  let html,nav=h;
  if(h==="recipes")html=recipes();
  else if(h==="travel")html=travel();
  else if(h==="living"||h==="eat-out"){html=living(h==="eat-out"?"eat-out":"all");nav="living";}
  else if(h==="about")html=about();
  else if(byId[h]){html=postView(byId[h]);nav=byId[h].kind==="eat-out"?"living":byId[h].kind;}
  else {html=home();nav="home";}
  view.innerHTML=html;view.style.animation="none";void view.offsetWidth;view.style.animation="";
  document.querySelectorAll("nav.main a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+nav?"page":"false"));
  window.scrollTo(0,0);
  initCarousel();initSurprise();initMap();
  if(byId[h]&&byId[h].kind==="recipes"){initScaler();initTimers(byId[h]);}
  requestAnimationFrame(initReveal);
  if(h==="recipes"){
    drawRecipes();

    view.querySelectorAll("[data-cat]").forEach(b=>b.addEventListener("click",()=>{recipeState.cat=b.dataset.cat;view.querySelectorAll("[data-cat]").forEach(x=>x.setAttribute("aria-pressed",x===b));drawRecipes();}));

      document.getElementById("lgrid").innerHTML=list.map(card).join("")||`<p class="empty">No guides for this country yet.</p>`;
    }));

  if(h==="about") view.querySelectorAll(".mosaic button,.aboutpic").forEach(b=>b.addEventListener("click",()=>openLightbox(b.dataset.full)));
