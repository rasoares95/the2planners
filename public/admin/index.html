<style>
[hidden]{display:none!important}
.note{margin:0}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body)}
.adm{max-width:860px;margin:0 auto;padding-block:32px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.adm h1{font-family:var(--f-display);font-weight:300;font-size:34px;margin:0 0 4px}
.adm h2{font-family:var(--f-display);font-weight:500;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:34px 0 12px}
.adm .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.adm a.home{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.login{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.login input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-width:0;flex:1 1 220px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;margin-bottom:12px}
.item .meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--f-display);font-size:13px}
.item .meta a{color:var(--teal);text-decoration:none}
.item p{margin:0;overflow-wrap:anywhere}
.item .acts{display:flex;gap:8px;flex-wrap:wrap}
.b{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:8px 14px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.b.ok{background:var(--teal);border-color:var(--teal);color:#fff}
.b.no{border-color:var(--red);color:var(--red)}
.note,.msg{color:var(--muted);font-family:var(--f-display);font-size:14px}
.msg{min-height:1.3em;color:var(--teal)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-family:var(--f-display);font-size:13px}
</style>

<body>
<main class="adm">
  <div class="top"><h1>Comments</h1><a class="home" href="/">← Back to the site</a></div>
  <p class="note">Approve or reject new comments, and remove published ones. Only people with the password can see this page.</p>
  <form class="login" id="login"><label for="key" class="note" style="flex-basis:100%;margin-top:6px">Admin password</label><input id="key" type="password" autocomplete="current-password"><button class="b" type="submit">Open</button></form>
  <p class="msg" id="msg" aria-live="polite"></p>
  <div id="app" hidden>
    <h2>Waiting for approval <span id="pc"></span></h2>
    <div id="pending"></div>
    <h2>Published</h2>
    <div id="published"></div>
  </div>
</main>

l (Yule Log Cake) Recipe","recipes/white-wine-sangria":"White Wine Sangria Recipe","recipes/yogurt-cake":"Yogurt Cake Recipe","travel/china-15-days-from-beijing-to-shanghai":"CHINA | Trip Guide - 15 days from Beijing to Shanghai 🇨🇳","travel/beijing-4-days-in-beijing":"BEIJING | City Guide - 4 days in Beijing 🇨🇳","travel/xi-an-1-day-in-xi-an":"XI'AN | City Guide - 1 day in Xi'an 🇨🇳","travel/chengdu-1-day-in-chengdu-and-the-giant-pandas":"CHENGDU | City Guide - 1 day in Chengdu and the giant pandas 🇨🇳","travel/guilin-2-days-in-guilin-and-the-longji-rice-terraces":"GUILIN | City Guide - 2 days in Guilin and the Longji rice terraces 🇨🇳","travel/yangshuo-li-river-cruise-and-cycling-in-yangshuo":"YANGSHUO | City Guide - Li River cruise and cycling in Yangshuo 🇨🇳","travel/hangzhou-2-days-around-west-lake":"HANGZHOU | City Guide - 2 days around West Lake 🇨🇳","travel/shanghai-4-days-in-shanghai-and-zhujiajiao":"SHANGHAI | City Guide - 4 days in Shanghai and Zhujiajiao 🇨🇳","travel/picos-de-europa-4-days-in-the-picos-de-europa":"PICOS DE EUROPA | Road Trip - 4 days in the Picos de Europa 🇪🇸","travel/barcelona-4-days-in-barcelona-montserrat":"BARCELONA | City Guide - 4 days in Barcelona + Montserrat 🇪🇸","travel/vigo-2-days-in-vigo-spain":"VIGO | City Guide - 2 days in Vigo, Spain 🇪🇸","travel/milan-1-day-in-milan":"MILAN | City Guide - 1 day in Milan 🇮🇹","travel/cinque-terre-2-days-in-cinque-terre":"CINQUE TERRE | City Guide - 2 days in Cinque Terre 🇮🇹","travel/pisa-1-day-in-pisa":"PISA | City Guide - 1 day in Pisa 🇮🇹","travel/italy-8-days-in-northern-italy":"ITALY | City Guide - 8 days in Northern Italy 🇮🇹","travel/florence-2-days-in-florence":"FLORENCE | City Guide - 2 days in Florence 🇮🇹","travel/venice-1-day-in-venice":"VENICE | City Guide - 1 day in Venice 🇮🇹","travel/verona-1-day-in-verona":"VERONA | City Guide - 1 day in Verona 🇮🇹","travel/budapest-2-days-in-budapest":"BUDAPEST | City Guide - 2 days in Budapest 🇭🇺","travel/prague-3-days-in-prague":"PRAGUE | City Guide - 3 const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when=iso=>new Date(iso).toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
let KEY="";try{KEY=sessionStorage.getItem("t2p-admin")||"";}catch(e){}
async function api(method,body){
  const r=await fetch("/api/admin",{method,headers:{"x-admin-key":KEY,"content-type":"application/json"},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Something went wrong");return j;
}
function card(c,pending){
  const t=TITLES[c.post]||c.post;
  return `<div class="item" data-id="${esc(c.id)}" data-post="${esc(c.post)}"><div class="meta"><b>${esc(c.name)}</b><span>${esc(when(c.date))} · <a href="/${esc(c.post)}/" target="_blank" rel="noopener">${esc(t)}</a></span></div>
  <p>${esc(c.text).replace(/\n/g,"<br>")}</p>
  <div class="acts">${pending?`<button class="b ok" data-a="approve">Approve</button><button class="b no" data-a="reject">Reject</button>`:`<button class="b no" data-a="ask">Delete</button>`}</div></div>`;
}
async function load(){
  $("msg").textContent="Loading...";
  try{
    const d=await api("GET");
    $("app").hidden=false;$("login").hidden=true;$("msg").textContent="";
    $("pc").textContent=d.pending.length?`(${d.pending.length})`:"";
    $("pending").innerHTML=d.pending.length?d.pending.map(c=>card(c,true)).join(""):`<p class="note">Nothing waiting. All caught up!</p>`;
    $("published").innerHTML=d.published.length?d.published.map(c=>card(c,false)).join(""):`<p class="note">No published comments yet.</p>`;
  }catch(e){$("msg").textContent=e.message;$("login").hidden=false;$("app").hidden=true;}
}
$("login").addEventListener("submit",e=>{e.preventDefault();KEY=$("key").value;try{sessionStorage.setItem("t2p-admin",KEY);}catch(err){}load();});
document.addEventListener("click",async e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const it=b.closest(".item"),a=b.dataset.a;
  if(a==="ask"){b.parentElement.innerHTML=`<span class="confirm">Delete this comment for good? <button class="b no" data-a="delete">Yes, delete</button><button class="b" data-a="cancel">Cancel</button></span>`;return;}
  if(a==="cancel"){load();return;}
  b.disabled=true;
  try{await api("POST",{action:a,id:it.dataset.id,post:it.dataset.post});
    await load();$("msg").textContent={approve:"Approved. It's now on the post.",reject:"Rejected and removed.",delete:"Deleted."}[a];}
  catch(err){$("msg").textContent=err.message;b.disabled=false;}
});
if(KEY)load();
</script>
